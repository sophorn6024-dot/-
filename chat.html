<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>បន្ទប់សន្ទនា</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,[data-theme="light"]{
  --bg:linear-gradient(135deg,#cfeafb 0%,#eaf5fd 35%,#f7fbff 70%,#fbf8ee 100%);
  --surface:#fff;--card:#f4f7fa;--border:#e3e9ef;--text:#14202b;--muted:#6b7a89;--primary:#0a6aa6;
  --in:#fff;--in-text:#14202b;--out:#d9efff;--out-text:#0b2a40;--quote:#f1f1f1;
  --header:rgba(255,255,255,.86);--chip:#f3f6f9;--chip-text:#3d4b59;--chip-on:#dff0fb;--chip-on-text:#0a6aa6;
  --shadow:0 2px 10px rgba(20,40,60,.07);--wave:#c4c9ce;--wave-on:#0a6aa6;
  --c-user:#0d7a5f;--c-admin:#c2570c;--c-ai:#a21caf}
[data-theme="dark"]{
  --bg:linear-gradient(160deg,#071822 0%,#091c28 50%,#07151e 100%);
  --surface:#0e202c;--card:#11222e;--border:#183347;--text:#f1f5f9;--muted:#94a3b8;--primary:#38bdf8;
  --in:#0e202c;--in-text:#e2e8f0;--out:#0d3856;--out-text:#f1f5f9;--quote:#16303f;
  --header:rgba(9,24,34,.9);--chip:#11222e;--chip-text:#94a3b8;--chip-on:#143852;--chip-on-text:#38bdf8;
  --shadow:0 2px 12px rgba(0,0,0,.4);--wave:#3b5366;--wave-on:#38bdf8;
  --c-user:#34d399;--c-admin:#fbbf24;--c-ai:#e879f9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Kantumruy Pro','Khmer OS Battambang',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;text-align:center}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:34px 24px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.auth-card h2{color:#ef4444;font-size:17px;margin:12px 0 8px}.auth-card p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.btn-primary{background:linear-gradient(135deg,#0a6aa6,#2563eb);color:#fff;border:0;padding:10px 22px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer}
#app{display:none;flex-direction:column;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:880px;height:100vh;height:var(--vh,100dvh);overflow:hidden}
.header{flex:0 0 auto;margin:max(8px,env(safe-area-inset-top)) 10px 0;padding:8px 12px;background:var(--header);backdrop-filter:blur(10px);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;z-index:5}
.icon-btn{background:none;border:0;color:var(--text);font-size:19px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:rgba(10,106,166,.1);color:var(--primary)}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.logo img{width:100%;height:100%;object-fit:contain}
.title{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-bar{display:none;margin:8px 10px 0;padding:6px 10px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);align-items:center;gap:8px}
.search-bar input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-family:inherit;padding:6px}
.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 8px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.date-pill{align-self:center;background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:600;padding:5px 16px;border-radius:20px;margin:14px 0 8px;box-shadow:var(--shadow)}
[data-theme="dark"] .date-pill{background:rgba(255,255,255,.08)}
.load-more{align-self:center;background:var(--surface);border:0;color:var(--primary);font-size:12px;font-weight:700;padding:6px 16px;border-radius:16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8;padding:30px}
.row{display:flex;align-items:flex-end;gap:8px;max-width:94%;margin-top:3px}
.row.first{margin-top:10px}
.row.in{align-self:flex-start}.row.out{align-self:flex-end;flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;overflow:hidden;background:#0d7a5f;box-shadow:var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.av.ai{background:linear-gradient(135deg,#a855f7,#7c3aed);font-size:17px}
.av.sp{visibility:hidden;box-shadow:none}
.bub{background:var(--in);color:var(--in-text);border-radius:20px;border-bottom-left-radius:6px;padding:8px 14px 7px;box-shadow:var(--shadow);min-width:0;max-width:100%;font-size:15px;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
.row.out .bub{background:var(--out);color:var(--out-text);border-bottom-left-radius:20px;border-bottom-right-radius:6px}
.row:not(.last) .bub{border-bottom-left-radius:20px}
.row.out:not(.last) .bub{border-bottom-right-radius:20px}
.who{font-size:13px;font-weight:700;color:var(--c-user);margin-bottom:2px}
.who.admin{color:var(--c-admin)}.who.ai{color:var(--c-ai)}
.quote{background:var(--quote);border-radius:12px;padding:10px 12px;margin:4px 0 8px;font-size:14px;color:var(--muted);border-left:3px solid var(--c-ai)}
.quote b{display:block;font-size:12px;color:var(--c-ai);margin-bottom:2px}
.meta{float:right;margin:7px 0 -2px 12px;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.meta.block{float:none;display:flex;justify-content:flex-end;margin:2px 0 0}
.del{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;opacity:.55;padding:2px}.del:hover{opacity:1;color:#ef4444}
.body a{color:var(--primary);text-decoration:underline}
.body::after{content:"";display:block;clear:both}
.img{display:block;max-width:min(260px,64vw);max-height:300px;width:100%;object-fit:cover;border-radius:14px;cursor:zoom-in;margin:2px 0 4px}
video.vid{display:block;max-width:min(280px,66vw);max-height:300px;border-radius:14px;margin:2px 0 4px;background:#000}
.audio{display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:12px;min-width:min(290px,66vw);padding:4px 0 0}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;grid-row:1/3;box-shadow:0 3px 8px rgba(10,106,166,.3)}
[data-theme="dark"] .play{color:#07151e}
.spd{grid-row:1/3;background:none;border:0;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;padding:4px;min-width:34px}
.wave{display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:var(--wave);display:block}
.wave i.on{background:var(--wave-on)}
.ameta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px;gap:8px}
.fab{position:absolute;right:14px;bottom:12px;width:42px;height:42px;border-radius:50%;background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:15px;z-index:6}
.fab .badge{position:absolute;top:-6px;right:-4px;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;display:none}
.dock{flex:0 0 auto;background:var(--surface);margin:0 10px max(10px,env(safe-area-inset-bottom));border-radius:28px;box-shadow:0 -2px 18px rgba(20,40,60,.1);padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:7}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--chip);color:var(--chip-text);border:0;border-radius:20px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:var(--chip-on);color:var(--chip-on-text)}
.compose{display:flex;align-items:flex-end;gap:6px}
.tools{display:flex;align-items:center;gap:2px;padding-bottom:3px}
.tool{background:none;border:0;color:var(--text);font-size:21px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85}
.tool:hover{color:var(--primary);background:rgba(10,106,166,.08)}
#msgInput{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:16px;line-height:1.5;padding:10px 6px;max-height:120px;height:44px}
#msgInput::placeholder{color:#9aa7b4}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,#0b7fc0,#0a5a8e);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(10,106,166,.35);transition:transform .12s}
.send:active{transform:scale(.92)}.send.rec{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.recbar{display:none;flex:1;align-items:center;gap:10px;color:#ef4444;font-weight:700;font-size:14px;padding:10px 6px}
.recbar button{background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px}
.recdot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
.emoji{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:8px;max-height:210px;overflow-y:auto;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px}
.emoji button{font-size:23px;background:none;border:0;border-radius:8px;padding:4px;cursor:pointer}.emoji button:active{background:rgba(10,106,166,.18)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{width:100%;max-width:440px;max-height:82vh;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.mlist{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.mem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:9px 12px}
.mem .av{width:40px;height:40px;font-size:15px}.mem b{font-size:14px;display:block}.mem small{font-size:12px;color:var(--muted)}
.lightbox{background:rgba(0,0,0,.9);z-index:200}.lightbox img{max-width:96vw;max-height:92vh;border-radius:8px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-80px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;z-index:300;transition:.25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}.toast.err{background:#dc2626}
@media (min-width:768px){.row{max-width:78%}.header,.dock{margin-left:14px;margin-right:14px}}
@media (max-width:420px){.tab{padding:8px 14px;font-size:13px}.tool{width:38px}.av{width:34px;height:34px}.title{font-size:15px}}
</style>
</head>
<body>
<div class="auth" id="auth"><div class="auth-card"><div style="font-size:44px">🔒</div><h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2><p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីចូលរួមការសន្ទនា។</p><button class="btn-primary" onclick="goIndex()">🔑 ទៅកាន់ទំព័រដើម</button></div></div>

<div id="app">
  <div class="header">
    <button class="icon-btn" onclick="goIndex()" title="ថយក្រោយ"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="logo" onclick="openMembers()"><img src="logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa-solid fa-school',style:'color:#eab308;font-size:20px'}))"></div>
    <div class="title" id="roomTitle"></div>
    <button class="icon-btn" onclick="toggleSearch()" title="ស្វែងរក"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="icon-btn" onclick="openMembers()" title="សមាជិក"><i class="fa-solid fa-user-group"></i></button>
  </div>
  <div class="search-bar" id="searchBar"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i><input id="searchInput" placeholder="ស្វែងរកសារ..." oninput="onSearch(this.value)"><button class="icon-btn" style="width:30px;height:30px;font-size:14px" onclick="toggleSearch()">✕</button></div>

  <div class="stage">
    <div id="chatBox"></div>
    <button class="fab" id="fab" onclick="scrollBottom(true)"><i class="fa-solid fa-chevron-down"></i><span class="badge" id="fabBadge"></span></button>
  </div>

  <div class="dock" id="dock">
    <div class="emoji" id="emoji"></div>
    <div class="tabs" id="tabs"></div>
    <div class="compose">
      <div class="tools" id="tools">
        <button class="tool" onclick="toggleEmoji()" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
        <button class="tool" onclick="pickFile('video')" title="វីដេអូ"><i class="fa-solid fa-video"></i></button>
        <button class="tool" onclick="pickFile('image')" title="រូបភាព"><i class="fa-regular fa-image"></i></button>
      </div>
      <div class="recbar" id="recbar"><span class="recdot"></span><span id="recTimer">0:00</span><button onclick="cancelRec()">បោះបង់</button></div>
      <textarea id="msgInput" rows="1" placeholder="ផ្ញើសារ..." oninput="onInput()" onfocus="closeEmoji()"></textarea>
      <button class="send" id="sendBtn" onclick="mainAction()"><i class="fa-solid fa-microphone" id="ico"></i></button>
    </div>
    <input type="file" id="fileIn" style="display:none" onchange="onFile(this)">
  </div>
</div>

<div class="overlay" id="memModal" onclick="if(event.target===this)closeMembers()"><div class="modal"><div class="mhead"><span><i class="fa-solid fa-user-group"></i> សមាជិកទាំងអស់</span><button class="icon-btn" onclick="closeMembers()">✕</button></div><div class="mlist" id="memList"></div></div></div>
<div class="overlay lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
/* ប្តូរឈ្មោះក្រុម និងបន្ទប់ (room_id) ក្នុងតារាង chat_messages នៅទីនេះ */
const APP_TITLE='ក្រុមធំ-ដោះស្រាយចម្ងល់';
const TABS=[{key:'ai',label:'ជំនួយការ AI',room:'ai'},{key:'general',label:'ជជែកទូទៅ',room:'global'},{key:'owner',label:'ជាមួយម្ចាស់ប្រព័ន្ធ',room:'owner'}];
const PAGE=60, MAX_VIDEO_MB=8, MAX_IMG_W=1200;

const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|data:(image|audio|video)\/)/.test(u)?u:''};
const pad=n=>(n<10?'0':'')+n;
const timeStr=iso=>{const d=new Date(iso);return isNaN(d)?'':pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3000)}

/* ---------- session / theme ---------- */
let ME=null;try{ME=JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){}
const MY_CODE=String(ME?.username||ME?.teacher_id||'').toLowerCase();
const MY_NAME=String(ME?.teacher_name||ME?.username||'').trim();
const IS_ADMIN=String(ME?.role||'').toLowerCase()==='admin';
function goIndex(){try{if(window.parent&&window.parent!==window){window.parent.location.href='index.html';return}}catch(e){}location.href='index.html'}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}
applyTheme((()=>{try{const u=new URLSearchParams(location.search).get('theme');let p=null;try{p=window.parent.document.documentElement.getAttribute('data-theme')}catch(e){}return u||p||localStorage.getItem('krou_theme_manual')||'light'}catch(e){return'light'}})());
window.addEventListener('message',e=>{if(e.data&&e.data.type==='THEME_CHANGE')applyTheme(e.data.theme)});
window.addEventListener('storage',e=>{if(e.key==='krou_theme_manual'&&e.newValue)applyTheme(e.newValue)});

/* ---------- viewport (keyboard-safe on all devices) ---------- */
function fitViewport(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--vh',h+'px');if(nearBottom(260))scrollBottom()}
window.addEventListener('resize',fitViewport);
if(window.visualViewport){visualViewport.addEventListener('resize',fitViewport);visualViewport.addEventListener('scroll',()=>window.scrollTo(0,0))}

/* ---------- users (from database) ---------- */
let users={};try{users=JSON.parse(localStorage.getItem('krou_teachers_cache')||'{}');Object.values(users).forEach(u=>{delete u.password;delete u.phone;delete u.dob;delete u.address})}catch(e){}
async function loadUsers(){
  try{const{data,error}=await sb.from('users').select('id, teacher_id, teacher_name, username, role, assigned_classes, photo_url');if(error||!data)return;
    users={};data.forEach(u=>{if(u.username)users[String(u.username).toLowerCase()]=u;if(u.teacher_id)users[String(u.teacher_id).toLowerCase()]=u;if(u.teacher_name)users[String(u.teacher_name).trim()]=u});
    try{localStorage.setItem('krou_teachers_cache',JSON.stringify(users))}catch(e){}}catch(e){}
}
const PALETTE=['#0d7a5f','#2563eb','#c2410c','#7c3aed','#0891b2','#be185d','#4d7c0f','#b45309'];
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function userSub(u){if(!u)return'';if(String(u.role||'').toLowerCase()==='admin')return'Admin';return u.assigned_classes?'ថ្នាក់ទី '+u.assigned_classes:''}
function sender(m){
  const code=String(m.sender_code||'').toLowerCase(),nm=String(m.sender_name||'').trim();
  const u=users[code]||users[nm];
  const role=String((u&&u.role)||m.sender_role||'').toLowerCase();
  const isAI=['ai','bot','assistant'].includes(role)||['ai','bot'].includes(code);
  const name=(u&&u.teacher_name)||nm||'អ្នកប្រើប្រាស់';
  const sub=isAI?'':userSub(u)||(role==='admin'?'Admin':'');
  return{name,sub,isAI,isAdmin:role==='admin',photo:safeUrl(u&&u.photo_url),initial:name.trim().charAt(0)||'U',color:hue(code||name)};
}

/* ---------- state ---------- */
let tab=TABS[1]||TABS[0], msgs=[], oldestReached=false, query='', lastSig='', unseen=0, chan=null, busy=false;
const box=$('chatBox');
const nearBottom=(t=120)=>box.scrollHeight-box.scrollTop-box.clientHeight<t;
function scrollBottom(smooth){box.scrollTo({top:box.scrollHeight,behavior:smooth?'smooth':'auto'});unseen=0;updateFab()}
function updateFab(){const far=!nearBottom(160);$('fab').style.display=far?'flex':'none';const b=$('fabBadge');b.style.display=unseen>0&&far?'block':'none';b.textContent=unseen}
box.addEventListener('scroll',()=>{if(nearBottom(160))unseen=0;updateFab()});

/* ---------- tabs ---------- */
function renderTabs(){$('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.key===tab.key?'on':''}" onclick="switchTab('${t.key}')">${esc(t.label)}</button>`).join('')}
function switchTab(k){const t=TABS.find(x=>x.key===k);if(!t||t.key===tab.key)return;tab=t;msgs=[];oldestReached=false;lastSig='';stopAudio();renderTabs();render(true);subscribe();refresh(true)}

/* ---------- data ---------- */
async function refresh(force){
  if(busy)return;busy=true;const room=tab.room;
  try{
    const{data,error}=await sb.from('chat_messages').select('*').eq('room_id',room).order('created_at',{ascending:false}).limit(PAGE);
    if(error)throw error;if(room!==tab.room)return;
    const fresh=(data||[]).slice().reverse();
    const full=(data||[]).length>=PAGE;
    const keep=full&&fresh.length?msgs.filter(m=>m.created_at<fresh[0].created_at):[];
    if(!full)oldestReached=true;
    const prevLast=msgs.length?msgs[msgs.length-1].id:null;
    msgs=keep.concat(fresh);
    const added=msgs.filter(m=>prevLast!==null&&m.id>prevLast&&!isMine(m)).length;
    const stick=force||nearBottom(160);
    if(!stick)unseen+=added;
    render(stick);
  }catch(e){if(force)toast('មិនអាចទាញយកសារបាន៖ '+(e.message||e),true)}
  finally{busy=false}
}
async function loadOlder(){
  if(!msgs.length||oldestReached)return;
  const{data,error}=await sb.from('chat_messages').select('*').eq('room_id',tab.room).lt('created_at',msgs[0].created_at).order('created_at',{ascending:false}).limit(PAGE);
  if(error){toast('មិនអាចទាញសារចាស់បាន',true);return}
  if(!data||data.length<PAGE)oldestReached=true;
  const h=box.scrollHeight;msgs=(data||[]).slice().reverse().concat(msgs);render(false);box.scrollTop+=box.scrollHeight-h;
}
function subscribe(){
  try{if(chan)sb.removeChannel(chan);
    chan=sb.channel('chat_'+tab.room).on('postgres_changes',{event:'*',schema:'public',table:'chat_messages',filter:'room_id=eq.'+tab.room},()=>refresh()).subscribe()}catch(e){}
}
const isMine=m=>{const c=String(m.sender_code||'').toLowerCase();return(c&&c===MY_CODE)||(!c&&String(m.sender_name||'').trim()===MY_NAME)};

/* ---------- render ---------- */
const dateLabel=iso=>{const d=new Date(iso);if(isNaN(d))return'';const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return'ថ្ងៃនេះ';if(d.toDateString()===y.toDateString())return'ម្សិលមិញ';
  return d.toLocaleDateString('km-KH',{day:'numeric',month:'short',year:'numeric'})};
const linkify=s=>s.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
function seededBars(id,n=34){let s=0;for(const c of String(id))s=(s*33+c.charCodeAt(0))>>>0;const out=[];for(let i=0;i<n;i++){s=(s*1664525+1013904223)>>>0;out.push(6+(s>>>8)%24)}return out}

function quoteHtml(m){
  let who='',txt='';
  if(m.reply_to_id!=null){const r=msgs.find(x=>String(x.id)===String(m.reply_to_id));if(r){who=sender(r).name;txt=r.type==='text'?r.content:(r.type==='image'?'🖼️ រូបភាព':r.type==='audio'?'🎙️ សំឡេង':'🎬 វីដេអូ')}}
  else if(m.reply_text){txt=m.reply_text;who=m.reply_name||''}
  if(!txt)return'';
  return`<div class="quote">${who?`<b>${esc(who)}</b>`:''}${esc(String(txt).slice(0,200))}</div>`;
}
function bodyHtml(m,time,del){
  const meta=`<span class="meta">${del}${time}</span>`;
  const url=safeUrl(m.content);
  if(m.type==='audio'){
    return`<div class="audio" data-id="${m.id}"><button class="play" data-act="play"><i class="fa-solid fa-play"></i></button><button class="spd" data-act="speed">1x</button>
      <div><div class="wave">${seededBars(m.id).map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="ameta"><span class="dur">--:--</span><span>${del}${time}</span></div></div></div>`;
  }
  if(m.type==='image')return`<img class="img" src="${url}" data-act="zoom" loading="lazy" alt="">${m.caption?`<div class="body">${linkify(esc(m.caption))}${meta}</div>`:`<div class="meta block">${del}${time}</div>`}`;
  if(m.type==='video')return`<video class="vid" src="${url}" controls preload="metadata" playsinline></video>${m.caption?`<div class="body">${linkify(esc(m.caption))}${meta}</div>`:`<div class="meta block">${del}${time}</div>`}`;
  return`<div class="body">${linkify(esc(m.content)).replace(/\n/g,'<br>')}${meta}</div>`;
}
function render(stick){
  const q=query.trim().toLowerCase();
  const list=q?msgs.filter(m=>m.type==='text'&&String(m.content||'').toLowerCase().includes(q)):msgs;
  const sig=tab.key+'|'+q+'|'+list.map(m=>m.id+':'+(m.content||'').length).join(',')+'|'+Object.keys(users).length+'|'+oldestReached;
  if(sig===lastSig)return;lastSig=sig;
  $('roomTitle').textContent=APP_TITLE;
  if(!list.length){box.innerHTML=`<div class="empty">${q?'រកមិនឃើញសារទេ':'មិនទាន់មានសារសន្ទនានៅឡើយទេ<br><small>វាយបញ្ចូលសារខាងក្រោមដើម្បីចាប់ផ្តើម</small>'}</div>`;updateFab();return}
  let h=!oldestReached&&!q?'<button class="load-more" data-act="older">ទាញសារចាស់ៗ</button>':'';
  let lastDate='';
  list.forEach((m,i)=>{
    const dl=dateLabel(m.created_at);if(dl&&dl!==lastDate){h+=`<div class="date-pill">${dl}</div>`;lastDate=dl}
    const s=sender(m),mine=isMine(m);
    const prev=list[i-1],next=list[i+1];
    const same=(a,b)=>a&&b&&String(a.sender_code||a.sender_name)===String(b.sender_code||b.sender_name)&&dateLabel(a.created_at)===dateLabel(b.created_at)&&Math.abs(new Date(b.created_at)-new Date(a.created_at))<300000;
    const first=!same(prev,m),last=!same(m,next);
    let av='';
    if(!mine){
      if(!last)av='<div class="av sp"></div>';
      else if(s.isAI)av='<div class="av ai"><i class="fa-solid fa-robot"></i></div>';
      else if(s.photo)av=`<div class="av"><img src="${esc(s.photo)}" data-ini="${esc(s.initial)}" alt=""></div>`;
      else if(s.isAdmin)av=`<div class="av"><img src="logo.png" data-ini="${esc(s.initial)}" alt=""></div>`;
      else av=`<div class="av" style="background:${s.color}">${esc(s.initial)}</div>`;
    }
    const who=(!mine&&first)?`<div class="who ${s.isAI?'ai':s.isAdmin?'admin':''}">${s.isAI?'🤖 ':''}${esc(s.name)}${s.sub?' · '+esc(s.sub):''}</div>`:'';
    const del=(mine||IS_ADMIN)?`<button class="del" data-act="del" title="លុបសារ"><i class="fa-solid fa-trash-can"></i></button>`:'';
    h+=`<div class="row ${mine?'out':'in'} ${first?'first':''} ${last?'last':''}" data-id="${m.id}">${av}<div class="bub">${who}${quoteHtml(m)}${bodyHtml(m,timeStr(m.created_at),del)}</div></div>`;
  });
  const keep=box.scrollTop,h0=box.scrollHeight;
  box.innerHTML=h;
  if(stick)scrollBottom();else box.scrollTop=keep+(0);
  updateFab();hydrateAudio();
}
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.ini!==undefined){const p=t.parentElement;if(p){p.style.background='#0d7a5f';p.textContent=t.dataset.ini}}},true);

/* ---------- delegated clicks ---------- */
box.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const row=e.target.closest('.row');const id=row&&row.dataset.id;
  switch(el.dataset.act){
    case'older':loadOlder();break;
    case'del':deleteMsg(id);break;
    case'zoom':$('lbImg').src=el.src;$('lightbox').style.display='flex';break;
    case'play':playAudio(el,row);break;
    case'speed':cycleSpeed(el);break;
  }
});

/* ---------- audio ---------- */
let audio=null,audioBtn=null,rate=1;
const fmt=s=>!isFinite(s)||s<0?'--:--':Math.floor(s/60)+':'+pad(Math.floor(s%60));
function msgById(id){return msgs.find(m=>String(m.id)===String(id))}
function hydrateAudio(){
  box.querySelectorAll('.audio').forEach(el=>{
    const m=msgById(el.dataset.id);if(!m||el._d)return;el._d=1;
    const a=new Audio();a.preload='metadata';a.src=safeUrl(m.content);
    const set=()=>{el.querySelector('.dur').textContent=fmt(a.duration)};
    a.onloadedmetadata=()=>{if(a.duration===Infinity){a.currentTime=1e101;a.ontimeupdate=()=>{a.ontimeupdate=null;a.currentTime=0;set()}}else set()};
  });
}
function paintWave(card,ratio){const bars=card.querySelectorAll('.wave i');const n=Math.round(bars.length*ratio);bars.forEach((b,i)=>b.classList.toggle('on',i<n))}
function stopAudio(){if(audio){audio.pause();audio=null}if(audioBtn){audioBtn.innerHTML='<i class="fa-solid fa-play"></i>';audioBtn=null}}
function playAudio(btn,row){
  const card=btn.closest('.audio');
  if(audio&&audioBtn===btn){if(audio.paused){audio.play();btn.innerHTML='<i class="fa-solid fa-pause"></i>'}else{audio.pause();btn.innerHTML='<i class="fa-solid fa-play"></i>'}return}
  stopAudio();const m=msgById(row.dataset.id);if(!m)return;
  audio=new Audio(safeUrl(m.content));audioBtn=btn;audio.playbackRate=rate;
  const dur=card.querySelector('.dur');
  audio.ontimeupdate=()=>{const d=isFinite(audio.duration)?audio.duration:0;paintWave(card,d?audio.currentTime/d:0);dur.textContent=fmt(audio.currentTime)};
  audio.onended=()=>{btn.innerHTML='<i class="fa-solid fa-play"></i>';paintWave(card,0);dur.textContent=fmt(audio.duration);audio=null;audioBtn=null};
  audio.onerror=()=>{toast('មិនអាចចាក់សំឡេងនេះបាន',true);stopAudio()};
  audio.play().then(()=>btn.innerHTML='<i class="fa-solid fa-pause"></i>').catch(()=>toast('មិនអាចចាក់សំឡេងបាន',true));
}
function cycleSpeed(btn){const s=[1,1.5,2];rate=s[(s.indexOf(rate)+1)%s.length];box.querySelectorAll('.spd').forEach(b=>b.textContent=rate+'x');if(audio)audio.playbackRate=rate}

/* ---------- sending ---------- */
async function send(type,content,caption){
  const payload={room_id:tab.room,sender_name:ME?.teacher_name||ME?.username||'',sender_code:ME?.username||ME?.teacher_id||'',sender_role:ME?.role||'teacher',type,content};
  if(caption)payload.caption=caption;
  const{data,error}=await sb.from('chat_messages').insert([payload]).select();
  if(error)throw error;
  if(data&&data[0]&&!msgs.some(m=>m.id===data[0].id)){msgs.push(data[0]);render(true)}else refresh(true);
}
function onInput(){const i=$('msgInput');i.style.height='44px';i.style.height=Math.min(i.scrollHeight,120)+'px';
  const has=i.value.trim().length>0;$('ico').className='fa-solid '+(has?'fa-paper-plane':'fa-microphone')}
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendText()}});
async function sendText(){
  const i=$('msgInput'),t=i.value.trim();if(!t)return;
  i.value='';onInput();closeEmoji();
  try{await send('text',t)}catch(e){i.value=t;onInput();toast('មិនអាចផ្ញើសារបានទេ៖ '+(e.message||e),true)}
}
function mainAction(){$('msgInput').value.trim()?sendText():toggleRec()}

/* ---------- media ---------- */
let pickType='image';
function pickFile(t){pickType=t;const f=$('fileIn');f.accept=t+'/*';f.click()}
function toDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;if(w>MAX_IMG_W){h=Math.round(h*MAX_IMG_W/w);w=MAX_IMG_W}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=rej;img.src=u})}
async function onFile(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    if(pickType==='video'){
      if(f.size>MAX_VIDEO_MB*1048576){toast('វីដេអូធំពេក (អតិបរមា '+MAX_VIDEO_MB+'MB)',true);return}
      toast('កំពុងផ្ញើវីដេអូ...');await send('video',await toDataUrl(f),'');
    }else{
      const data=await compress(f);const cap=(prompt('បញ្ចូលចំណងជើងរូបភាព (ទុកទទេបានបើមិនមាន)៖')||'').trim();
      await send('image',data,cap);
    }
  }catch(e){toast('ផ្ញើមិនបាន៖ '+(e.message||e),true)}
}

/* ---------- voice recording ---------- */
let rec=null,chunks=[],recT=null,recS=0,recCancel=false;
function recUI(on){$('recbar').style.display=on?'flex':'none';$('msgInput').style.display=on?'none':'block';$('tools').style.display=on?'none':'flex';$('sendBtn').classList.toggle('rec',on);$('ico').className='fa-solid '+(on?'fa-stop':'fa-microphone')}
async function toggleRec(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('ឧបករណ៍មិនគាំទ្រការថតសំឡេង',true);return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    chunks=[];recCancel=false;rec=new MediaRecorder(stream,mt?{mimeType:mt}:{});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
      clearInterval(recT);recUI(false);stream.getTracks().forEach(t=>t.stop());
      if(recCancel||!chunks.length)return;
      try{await send('audio',await toDataUrl(new Blob(chunks,{type:rec.mimeType||'audio/mp4'})))}catch(e){toast('ផ្ញើសំឡេងមិនបាន៖ '+(e.message||e),true)}
    };
    rec.start(250);recS=0;$('recTimer').textContent='0:00';recUI(true);
    recT=setInterval(()=>{recS++;$('recTimer').textContent=Math.floor(recS/60)+':'+pad(recS%60)},1000);
  }catch(e){toast('សូមអនុញ្ញាតសិទ្ធិប្រើ Microphone',true)}
}
function cancelRec(){recCancel=true;if(rec&&rec.state==='recording')rec.stop()}

/* ---------- delete ---------- */
async function deleteMsg(id){
  if(!id||!confirm('តើលោកអ្នកពិតជាចង់លុបសារនេះមែនទេ?'))return;
  try{const{error}=await sb.from('chat_messages').delete().eq('id',id);if(error)throw error;
    msgs=msgs.filter(m=>String(m.id)!==String(id));render(false)}catch(e){toast('លុបមិនបាន៖ '+(e.message||e),true)}
}

/* ---------- emoji / search / members ---------- */
const EMOJIS="😀😃😄😁😆😅😂🤣🙂😉😊😇🥰😍🤩😘😋😜🤪🤗🤔😏😌😴😷🤯🥳😎🤓😢😭😡👍👎👏🙌🙏🤝👊✌️👌❤️🔥💯✨🎉⭐💡☕✅❌📚✏️🏫".match(/\p{Extended_Pictographic}(\uFE0F)?(\u200D\p{Extended_Pictographic}(\uFE0F)?)*/gu)||[];
function toggleEmoji(){const d=$('emoji');if(d.style.display==='grid'){d.style.display='none';return}
  if(!d.childElementCount)d.innerHTML=EMOJIS.map(e=>`<button type="button">${e}</button>`).join('');d.style.display='grid'}
function closeEmoji(){$('emoji').style.display='none'}
$('emoji').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=$('msgInput');i.value+=b.textContent;onInput();i.focus()});
document.addEventListener('click',e=>{if(!e.target.closest('#emoji')&&!e.target.closest('#tools'))closeEmoji()});
function toggleSearch(){const b=$('searchBar'),on=b.style.display==='flex';b.style.display=on?'none':'flex';if(on){$('searchInput').value='';onSearch('')}else $('searchInput').focus()}
function onSearch(v){query=v;render(false)}
async function openMembers(){
  $('memModal').style.display='flex';drawMembers(uniqueUsers(Object.values(users)));
  try{const{data}=await sb.from('users').select('id, teacher_id, teacher_name, username, role, assigned_classes, photo_url').order('id',{ascending:true});if(data)drawMembers(data)}catch(e){}
}
const uniqueUsers=a=>{const s=new Set();return a.filter(u=>{const k=u.id||u.username;if(s.has(k))return false;s.add(k);return true})};
function drawMembers(list){
  list=list.slice().sort((a,b)=>(String(b.role)==='admin')-(String(a.role)==='admin'));
  $('memList').innerHTML=list.length?list.map(u=>{const nm=u.teacher_name||u.username||'',p=safeUrl(u.photo_url);
    return`<div class="mem"><div class="av" style="background:${hue(u.username||nm)}">${p?`<img src="${esc(p)}" data-ini="${esc(nm.charAt(0))}" alt="">`:esc(nm.charAt(0)||'U')}</div><div><b>${esc(nm)}</b><small>${esc(userSub(u)||'គ្រូបង្រៀន')}</small></div></div>`}).join(''):'<div class="empty">មិនមានបញ្ជីសមាជិកឡើយ</div>';
}
function closeMembers(){$('memModal').style.display='none'}

/* ---------- init ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  if(!ME||!ME.username){$('auth').style.display='flex';return}
  $('app').style.display='flex';$('roomTitle').textContent=APP_TITLE;
  fitViewport();renderTabs();render(true);
  loadUsers().then(()=>{lastSig='';refresh(true)});
  subscribe();
  setInterval(()=>{if(!document.hidden)refresh()},10000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
});
</script>
