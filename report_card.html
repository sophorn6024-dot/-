<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ព្រឹត្តិបត្រពិន្ទុ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 📊 Excel & PDF Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    body {
      background: #1e293b;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .f-moul {
      font-family: 'Khmer OS Muol Light', 'Moul', cursive !important;
      font-weight: normal;
    }

    /* 🔒 AUTH DENIED WRAPPER */
    #authDeniedWrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
      padding: 30px 20px;
      width: 100%;
    }
    .auth-card {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 24px;
      padding: 38px 28px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f8fafc;
    }
    .auth-icon {
      width: 64px; height: 64px; border-radius: 20px;
      background: rgba(239, 68, 68, 0.15); color: #ef4444;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 14px;
    }
    .auth-card h2 { font-size: 17.5px; margin-bottom: 8px; color: #ef4444; }
    .auth-card p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 22px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff; padding: 10px 24px; border-radius: 12px;
      font-weight: 700; font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
    }

    /* =========================================================
       🎛️ TOP TOOLBAR (ក្បាលលើរៀបជា ២ ជួរលើទូរសព្ទ)
    ========================================================= */
    .top-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid #334155;
    }

    .tb-row-1, .tb-row-2 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .pill-btn, .pill-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 13px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      outline: none;
      white-space: nowrap;
    }
    .pill-btn:hover, .pill-select:hover {
      background: #334155;
      border-color: #64748b;
    }

    .pill-btn.primary {
      background: #00875a;
      color: #ffffff;
      border-color: #00875a;
    }
    .pill-btn.primary:hover { background: #00734c; }

    .dropdown-popup {
      display: none;
      position: fixed;
      min-width: 190px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      padding: 6px;
      z-index: 99999;
      animation: popIn 0.15s ease-out;
    }
    .dropdown-popup.show { display: block; }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      padding: 9px 12px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dropdown-item:hover { background: #1e293b; }
    .dropdown-item.active { background: #0284c7; color: #fff; }

    .student-nav-group {
      display: inline-flex;
      align-items: center;
      background: #1e293b;
      border-radius: 18px;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 4px;
    }
    .student-nav-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .student-nav-btn:hover { background: #334155; }
    .student-select-clean {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      padding: 0 6px;
      max-width: 140px;
    }
    .student-select-clean option { background: #0f172a; color: #fff; }

    @media screen and (max-width: 768px) {
      .top-toolbar {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .tb-row-1, .tb-row-2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }
      .btn-label { display: none !important; }
      .pill-btn {
        width: 36px; height: 36px; padding: 0;
        justify-content: center; border-radius: 50%;
      }
      .tb-group .fa-chevron-down { display: none; }
      .pill-select { height: 34px; padding: 0 8px; font-size: 11.5px; max-width: 105px; }
      .student-select-clean { max-width: 100px; font-size: 11.5px; }
      .tb-row-2 .pill-btn { flex: 1; border-radius: 18px; }
      .tb-row-2 .pill-btn.primary { flex: 1.2; }
    }

    /* =========================================================
       📄 PAPER STAGE & SCALING SYSTEM
    ========================================================= */
    .paper-stage-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .paper-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    .report-sheet {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      padding: 14mm 16mm 14mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: block;
      position: relative;
      color: #000;
    }

    .sheet-national-header { text-align: center; margin-bottom: 4px; }
    .nat-title-1 { font-size: 14.5px; margin-bottom: 2px; }
    .nat-title-2 { font-size: 13px; margin-bottom: 2px; }
    .nat-symbol { font-size: 10.5px; letter-spacing: 2.5px; }

    .sheet-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .left-dept-info { text-align: left; font-size: 12px; line-height: 1.45; }
    .left-dept-info div:first-child { font-weight: 700; }
    .left-dept-info div:last-child { font-weight: 700; }

    .center-doc-title { text-align: center; flex: 1; margin-right: 70px; }
    .doc-main-title { font-size: 16.5px; color: #000; margin-bottom: 2px; }
    .doc-academic-year { font-size: 13px; font-weight: 600; }

    .student-meta-line {
      text-align: center;
      font-size: 12.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .student-meta-line span.hl-val { font-weight: 700; }
    .student-meta-line span.hl-rank { color: #dc2626; font-weight: 800; }

    /* ── Table Styling ── */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 11px;
      border: 1px solid #000;
      margin-bottom: 12px;
    }
    .report-table th, .report-table td {
      border: 1px solid #000;
      padding: 4px 3px;
      vertical-align: middle;
      height: 25px;
      white-space: nowrap;
    }
    .report-table thead th {
      background: #e2e8f0;
      font-weight: 700;
      font-size: 11.5px;
      white-space: nowrap;
    }
    
    .report-table td.sub-name {
      text-align: center;
      font-weight: 700;
      white-space: nowrap !important;
      padding: 4px 6px;
    }
    .report-table td.bold-val { font-weight: 700; }

    .gr-A { color: #0284c7; font-weight: 800; }
    .gr-B { color: #b45309; font-weight: 800; }
    .gr-C { color: #16a34a; font-weight: 800; }
    .gr-D { color: #2563eb; font-weight: 800; }
    .gr-E { color: #7c3aed; font-weight: 800; }
    .gr-F { color: #dc2626; font-weight: 800; }

    .summary-cell-text { font-size: 11px; font-weight: 700; padding: 5px 3px; white-space: nowrap; }

    /* ── Signatures & Footer ── */
    .sheet-signatures-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 10px;
      padding: 0 4px;
      width: 100%;
      font-size: 11px;
    }
    .sig-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .sig-col.left-col { width: 28%; margin-top: 50px; }
    .sig-col.mid-col  { width: 30%; margin-top: 28px; }
    .sig-col.right-col { width: 42%; margin-top: 0; }

    .sig-title-moul { font-size: 11.5px; color: #000; margin-bottom: 3px; }
    .sig-role { font-weight: 700; font-size: 11.5px; margin-bottom: 45px; }
    .sig-name { font-weight: 700; font-size: 12.5px; }
    .sig-solar-date { font-size: 11px; font-weight: 700; margin-top: 3px; white-space: nowrap; }

    .clean-lunar-input {
      font-size: 11px;
      font-weight: bold;
      color: #000;
      border: 1px dashed transparent;
      background: transparent;
      text-align: center;
      width: 100%;
      outline: none;
      cursor: text;
      padding: 2px 4px;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      transition: all 0.2s;
    }
    .clean-lunar-input:hover, .clean-lunar-input:focus {
      border-color: #3b82f6;
      background: rgba(239, 246, 255, 0.7);
      border-radius: 4px;
    }

    .parent-dotted-lines {
      width: 100%;
      border-bottom: 1px dotted #000;
      height: 14px;
      margin-top: 10px;
    }

    /* 2 នាក់ • សន្លឹកផ្តេក A4 (Landscape Mode) */
    .paper-stage.layout-2col .report-sheet-container-2col {
      background: #ffffff;
      width: 297mm;
      min-height: 210mm;
      max-height: 210mm;
      padding: 6mm 8mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8mm;
      overflow: hidden;
    }

    .paper-stage.layout-2col .report-sheet {
      width: 100%;
      min-height: auto;
      box-shadow: none;
      padding: 0;
      font-size: 9px;
    }

    .paper-stage.layout-2col .nat-title-1 { font-size: 11.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-title-2 { font-size: 10.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-symbol { font-size: 8.5px; letter-spacing: 1.5px; }
    .paper-stage.layout-2col .doc-main-title { font-size: 12px; margin-bottom: 1px; }
    .paper-stage.layout-2col .doc-academic-year { font-size: 9.5px; }
    .paper-stage.layout-2col .left-dept-info { font-size: 9px; line-height: 1.3; }
    .paper-stage.layout-2col .center-doc-title { margin-right: 35px; }
    .paper-stage.layout-2col .student-meta-line { font-size: 9.5px; margin-bottom: 3px; }
    
    .paper-stage.layout-2col .report-table { font-size: 8.8px; margin-bottom: 5px; }
    .paper-stage.layout-2col .report-table th,
    .paper-stage.layout-2col .report-table td {
      padding: 2px 1px;
      height: 18px;
      white-space: nowrap !important;
    }
    
    .paper-stage.layout-2col .summary-cell-text { font-size: 8.5px; padding: 2px; }
    .paper-stage.layout-2col .sheet-signatures-area { font-size: 8.5px; margin-top: 3px; }
    .paper-stage.layout-2col .sig-col.left-col { width: 27%; margin-top: 34px; }
    .paper-stage.layout-2col .sig-col.mid-col  { width: 29%; margin-top: 16px; }
    .paper-stage.layout-2col .sig-col.right-col { width: 44%; margin-top: 0; }
    .paper-stage.layout-2col .sig-title-moul { font-size: 8.5px; }
    .paper-stage.layout-2col .sig-role { font-size: 8.5px; margin-bottom: 24px; }
    .paper-stage.layout-2col .sig-name { font-size: 9px; }
    .paper-stage.layout-2col .clean-lunar-input { font-size: 7.8px; padding: 1px; }
    .paper-stage.layout-2col .sig-solar-date { font-size: 8px; }
    .paper-stage.layout-2col .parent-dotted-lines { height: 9px; margin-top: 5px; }

    .empty-state-card {
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 440px;
      margin-top: 40px;
    }

    @page { size: A4 portrait; margin: 6mm 8mm; }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; overflow: visible !important; }
      .top-toolbar, #authDeniedWrap { display: none !important; }
      .paper-stage-wrapper { padding: 0 !important; overflow: visible !important; display: block !important; }
      .paper-stage { transform: none !important; gap: 0 !important; }
      .report-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }
      .clean-lunar-input { border: none !important; background: transparent !important; }
      .paper-stage.layout-2col .report-sheet-container-2col {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- 🔒 AUTH DENIED -->
  <div id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2 class="f-moul">សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login ដើម្បីមើល និងបោះពុម្ពព្រឹត្តិបត្រពិន្ទុ។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       1. TOOLBAR ផ្នែកខាងលើ (រៀបជា ២ ជួរស្អាតលើទូរសព្ទ)
  ========================================================= -->
  <div class="top-toolbar" id="mainToolbar" style="display:none;">
    
    <!-- ជួរទី១ (ជួរលើ) -->
    <div class="tb-row-1">
      <!-- ប៊ូតុងត្រឡប់ -->
      <button type="button" class="pill-btn" onclick="goBackToScore()" title="ត្រឡប់ទៅស្រង់ពិន្ទុ">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="btn-label">ត្រឡប់</span>
      </button>

      <!-- ជ្រើសរើសថ្នាក់ -->
      <select id="classSelectPill" class="pill-select" onchange="onClassChange(this.value)">
        <option value="">កំពុងទាញយកថ្នាក់...</option>
      </select>

      <!-- រុករកសិស្ស -->
      <div class="student-nav-group">
        <button type="button" class="student-nav-btn" onclick="prevStudent()" title="សិស្សមុន">‹</button>
        <select class="student-select-clean" id="studentSelectBox" onchange="onStudentSelect(this.value)">
          <option value="">គ្មានសិស្ស</option>
        </select>
        <button type="button" class="student-nav-btn" onclick="nextStudent()" title="សិស្សបន្ទាប់">›</button>
      </div>

      <!-- ប្តូរទម្រង់សន្លឹក (១ នាក់ / ២ នាក់) -->
      <div class="tb-group">
        <button type="button" class="pill-btn" onclick="toggleDropdown('layoutDropdown', this)" title="ប្តូរទម្រង់សន្លឹក">
          <i class="fa-solid fa-file-lines"></i>
          <span class="btn-label" id="currentLayoutText">1 នាក់ • បញ្ឈរ</span>
          <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 2px;"></i>
        </button>

        <div class="dropdown-popup" id="layoutDropdown">
          <div class="dropdown-item active" onclick="setLayoutMode('1_portrait', '1 នាក់ • សន្លឹកបញ្ឈរ', this)">
            <span>1 នាក់ • សន្លឹកបញ្ឈរ</span> <i class="fa-solid fa-check"></i>
          </div>
          <div class="dropdown-item" onclick="setLayoutMode('2_landscape', '2 នាក់ • សន្លឹកផ្តេក A4', this)">
            <span>2 នាក់ • សន្លឹកផ្តេក A4</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ជួរទី២ (ជួរក្រោម) -->
    <div class="tb-row-2">
      <!-- 🌟 ជ្រើសរើសប្រភេទព្រឹត្តិបត្រ: ខែ ឬ ឆមាស -->
      <select id="reportTypeSelect" class="pill-select" onchange="onReportTypeChange(this.value)" style="flex:1;">
        <option value="monthly">ព្រឹត្តិបត្រខែ</option>
        <option value="semester">ព្រឹត្តិបត្រឆមាស</option>
      </select>

      <!-- ជ្រើសរើសខែ (បង្ហាញតែពេលជ្រើសរើសព្រឹត្តិបត្រខែ) -->
      <select id="monthSelectPill" class="pill-select" onchange="onMonthChange(this.value)" style="flex:1;">
        <!-- បញ្ចូលខែតាម JS -->
      </select>

      <!-- និទ្ទេស -->
      <div class="tb-group" style="flex:1;">
        <button type="button" class="pill-btn" onclick="toggleDropdown('gradeDropdown', this)" title="ប្តូរនិទ្ទេស (A-F ឬ ខ្មែរ)" style="width:100%;">
          <i class="fa-solid fa-language"></i>
          <span class="btn-label" id="currentGradeText">A–F</span>
          <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 2px;"></i>
        </button>

        <div class="dropdown-popup" id="gradeDropdown">
          <div class="dropdown-item active" onclick="setGradeFormat('AF', 'និទ្ទេស A–F', this)">

  <script>

    const ALL_MONTHS = ['វិច្ឆិកា','ធ្នូ','មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'];
    const CAL_MONTH = {
      'មករា': 1, 'កុម្ភៈ': 2, 'មីនា': 3, 'មេសា': 4, 'ឧសភា': 5, 'មិថុនា': 6,
      'កក្កដា': 7, 'សីហា': 8, 'កញ្ញា': 9, 'តុលា': 10, 'វិច្ឆិកា': 11, 'ធ្នូ': 12
    };

    let reportMode = 'monthly'; // 'monthly' | 'semester'
    let selectedMonth = 'តុលា';
    let layoutMode = '1_portrait';
    let gradeMode = 'AF';
    let currentClassName = '';
    let studentsList = [];
    let currentStudentIndex = 0;
    let isFitScreen = true;

    const now = new Date();
    const currentYear = now.getFullYear();
    const academicYearStr = `${currentYear}-${currentYear + 1}`;

    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
    function toKhmerNum(n) { return String(n).replace(/\d/g, d => KHMER_DIGITS[d]); }

    /* 🌟 គណនាថ្ងៃដាច់ខែសុរិយគតិស្វ័យប្រវត្តិតាមខែដែលបានជ្រើសរើស */
    function getAutoSolarDate(mName) {
      const year = currentYear;
      const mNum = CAL_MONTH[mName] || 10;
      const lastDay = new Date(year, mNum, 0).getDate();
      return `កំពង់ល្ពៅ, ថ្ងៃទី${toKhmerNum(lastDay)} ខែ${mName} ឆ្នាំ${toKhmerNum(year)}`;
    }

    let teacherLunarDate = "ថ្ងៃព្រហស្បតិ៍ ៤កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let teacherName = CURRENT_USER?.teacher_name || "សេង សុភាន់";

    function cleanGrade(g) {
      return String(g || '').replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/, '').trim();
    }

    const GRADE_KH_MAP = {
      'A': 'ល្អប្រសើរ',
      'B': 'ល្អណាស់',
      'C': 'ល្អ',
      'D': 'បង្គួរ',
      'E': 'មធ្យម',
      'F': 'ខ្សោយ'
    };

    function formatGrade(code) {
      if (!code || code === '-') return '-';
      return (gradeMode === 'KH') ? (GRADE_KH_MAP[code] || code) : code;
    }

    function calculateGrade(avg) {
      if (avg >= 9) return 'A';
      if (avg >= 8) return 'B';
      if (avg >= 7) return 'C';
      if (avg >= 6) return 'D';
      if (avg >= 5) return 'E';
      return 'F';
    }

    function toggleDropdown(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const isShown = el.classList.contains('show');
      closeAllDropdowns();
      if (!isShown) {
        el.classList.add('show');
        if (btn) {
          const r = btn.getBoundingClientRect();
          el.style.top = (r.bottom + 6) + 'px';
          let left = r.left;
          if (left + 200 > window.innerWidth) left = window.innerWidth - 206;
          el.style.left = Math.max(8, left) + 'px';
        }
      }
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-popup').forEach(d => d.classList.remove('show'));
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tb-group')) closeAllDropdowns();
    });

    window.addEventListener('scroll', closeAllDropdowns, true);
    window.addEventListener('resize', closeAllDropdowns);

    function setLayoutMode(mode, label, el) {
      layoutMode = mode;
      document.getElementById('currentLayoutText').innerText = label;
      document.querySelectorAll('#layoutDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function setGradeFormat(fmt, label, el) {
      gradeMode = fmt;
      document.getElementById('currentGradeText').innerText = label;
      document.querySelectorAll('#gradeDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function onReportTypeChange(val) {
      reportMode = val;
      document.getElementById('monthSelectPill').style.display = (val === 'monthly') ? 'inline-block' : 'none';
      loadRealDataForClass(currentClassName);
    }

    function onMonthChange(val) {
      selectedMonth = val;
      loadRealDataForClass(currentClassName);
    }

    /* =========================================================
       4. FETCH REAL DATA FROM SUPABASE
    ========================================================= */
    async function initClassDropdown() {
      const sel = document.getElementById('classSelectPill');
      const mSel = document.getElementById('monthSelectPill');
      
      // បញ្ចូលជម្រើសខែ
      mSel.innerHTML = ALL_MONTHS.map(m => `<option value="${m}" ${m==='តុលា'?'selected':''}>ខែ ${m}</option>`).join('');

      sel.innerHTML = '<option value="">កំពុងទាញយកថ្នាក់...</option>';

      try {
        const { data, error } = await sb.from('students').select('grade').limit(5000);
        if (error) throw error;

        let rawClasses = Array.from(new Set((data || []).map(d => cleanGrade(d.grade)).filter(Boolean)));
        rawClasses.sort((a,b) => a.localeCompare(b, 'km', { numeric: true }));

        sel.innerHTML = rawClasses.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');

        const cleanUserClass = cleanGrade(USER_CLASS);
        if (!IS_ADMIN && cleanUserClass) {
          sel.value = cleanUserClass;
          sel.disabled = true;
          currentClassName = cleanUserClass;
        } else {
          sel.value = (cleanUserClass && rawClasses.includes(cleanUserClass)) ? cleanUserClass : (rawClasses[0] || '');
          currentClassName = sel.value;
        }

        await loadRealDataForClass(currentClassName);

      } catch (err) {
        sel.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
      }
    }

    function onClassChange(val) {
      currentClassName = val;
      loadRealDataForClass(val);
    }

    async function loadRealDataForClass(cls) {
      const pure = cleanGrade(cls);
      if (!pure) return;

      document.getElementById('paperWorkspace').innerHTML = `
        <div class="empty-state-card">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7; margin-bottom:12px;"></i>
          <div>កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${pure}...</div>
        </div>`;

      try {
        // ១. ទាញយកសិស្សពិត
        const { data: stData, error: stErr } = await sb
          .from('students')
          .select('*')
          .in('grade', [pure, `ថ្នាក់ទី${pure}`, `ថ្នាក់ទី ${pure}`])
          .order('id', { ascending: true });
        if (stErr) throw stErr;

        if (!stData || stData.length === 0) {
          studentsList = [];
          populateStudentSelect();
          document.getElementById('paperWorkspace').innerHTML = `
            <div class="empty-state-card">
              <i class="fa-solid fa-user-slash fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
              <div>មិនទាន់មានទិន្នន័យសិស្សក្នុងថ្នាក់ទី ${pure} នៅឡើយទេ</div>
            </div>`;
          return;
        }

        // ២. ទាញយកមុខវិជ្ជាពិតពី table subjects
        const { data: subData } = await sb
          .from('subjects')
          .select('*')
          .eq('assigned_class', pure)
          .eq('subject_type', reportMode)
          .order('sort_order', { ascending: true })
          .order('id', { ascending: true });

        // ៣. ទាញយកពិន្ទុពិត
        const targetPeriod = (reportMode === 'monthly') ? selectedMonth : 'ឆមាស';
        let scoreQuery = sb.from('scores').select('*').eq('assigned_class', pure).eq('score_type', reportMode);
        
        if (reportMode === 'monthly') {
          scoreQuery = scoreQuery.eq('period', selectedMonth);
        }

        const { data: scData } = await scoreQuery;

        const scoreMap = {};
        const scoreMapS1 = {};
        const scoreMapS2 = {};

        (scData || []).forEach(row => {
          let scObj = row.scores || {};
          if (typeof scObj === 'string') {
            try { scObj = JSON.parse(scObj); } catch(e) { scObj = {}; }
          }
          const sid = String(row.student_id);
          if (reportMode === 'monthly') {
            scoreMap[sid] = scObj;
          } else {
            if (row.period === 'ឆមាសទី១') scoreMapS1[sid] = scObj;
            if (row.period === 'ឆមាសទី២') scoreMapS2[sid] = scObj;
          }
        });

        // ៤. ទាញយកអវត្តមាន
        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, status')
          .eq('assigned_class', pure);

        const unexcusedMap = {};
        const excusedMap = {};
        const unexcusedCodes = ['A', 'អ', 'អត់ច្បាប់', 'អវត្តមាន', 'ABSENT', 'UNEXCUSED'];
        const excusedCodes = ['C', 'ច', 'ច្បាប់', 'មានច្បាប់', 'EXCUSED', 'PERMISSION'];

        (attData || []).forEach(a => {
          const sid = String(a.student_id);
          const st = String(a.status || '').trim().toUpperCase();
          if (unexcusedCodes.includes(st)) unexcusedMap[sid] = (unexcusedMap[sid] || 0) + 1;
          if (excusedCodes.includes(st)) excusedMap[sid] = (excusedMap[sid] || 0) + 1;
        });

        // ៥. រៀបចំទិន្នន័យ (🌟 ច្រោះចោលមុខវិជ្ជាណាដែលគ្មានពិន្ទុ)
        studentsList = stData.map(st => {
          const sid = String(st.student_id || st.id);
          const sc = scoreMap[sid] || {};
          const sc1 = scoreMapS1[sid] || {};
          const sc2 = scoreMapS2[sid] || {};

          let totalScore = 0;
          let activeSubjectCount = 0;

          if (reportMode === 'monthly') {
            // បែងចែកជាមុខវិជ្ជាមេ និងមុខវិជ្ជារង
            const parents = (subData || []).filter(s => !s.parent_id);
            const activeGroups = [];

            parents.forEach(p => {
              const children = (subData || []).filter(c => String(c.parent_id) === String(p.id));
              
              if (children.length > 0) {
                // 🌟 ច្រោះយកតែជំនាញរងណាដែលមានពិន្ទុ
                const activeChildren = [];
                children.forEach(c => {
                  const val = sc[c.code || `sub_${c.id}`];
                  const num = parseFloat(val);
                  if (!isNaN(num) && val !== '' && val !== null) {
                    activeChildren.push({
                      name: c.name,
                      code: c.code || `sub_${c.id}`,
                      max: Number(c.max_score) || 10,
                      score: num,
                      grade: calculateGrade(num)
                    });
                    totalScore += num;
                    activeSubjectCount++;
                  }
                });

                if (activeChildren.length > 0) {
                  activeGroups.push({
                    parentName: p.name,
                    isGroup: true,
                    children: activeChildren
                  });
                }
              } else {
                // មុខវិជ្ជាទោល (គ្មានរង)
                const val = sc[p.code || `sub_${p.id}`];
                const num = parseFloat(val);
                if (!isNaN(num) && val !== '' && val !== null) {
                  activeGroups.push({
                    parentName: p.name,
                    isGroup: false,
                    max: Number(p.max_score) || 10,
                    score: num,
                    grade: calculateGrade(num)
                  });
                  totalScore += num;
                  activeSubjectCount++;
                }
              }
            });

            const avgScore = activeSubjectCount > 0 ? (totalScore / activeSubjectCount) : 0;

            return {
              id: st.student_id || st.id,
              name: st.student_name || 'គ្មានឈ្មោះ',
              gender: st.gender || 'ប្រុស',
              grade: pure,
              totalScore: totalScore,
              avgScore: avgScore,
              gradeLabel: avgScore > 0 ? calculateGrade(avgScore) : '-',
              absentUnexcused: unexcusedMap[sid] || 0,
              absentExcused: excusedMap[sid] || 0,
              monthlyGroups: activeGroups
            };

          } else {
            // ព្រឹត្តិបត្រឆមាស
            let sem1Total = 0, sem1Count = 0;
            let sem2Total = 0, sem2Count = 0;
            const activeSemSubjects = [];

            (subData || []).forEach(sub => {
              const code = sub.code || `sub_${sub.id}`;
              const v1 = parseFloat(sc1[code]);
              const v2 = parseFloat(sc2[code]);
              const has1 = !isNaN(v1);
              const has2 = !isNaN(v2);

              // 🌟 បើគ្មានពិន្ទុទាំងឆមាស១ និង២ ទេ មិនបាច់បង្ហាញឡើយ
              if (!has1 && !has2) return;

              if (has1) { sem1Total += v1; sem1Count++; }
              if (has2) { sem2Total += v2; sem2Count++; }

              let subAvg = '-';
              if (has1 && has2) subAvg = ((v1 + v2) / 2);
              else if (has1) subAvg = v1;
              else if (has2) subAvg = v2;

              activeSemSubjects.push({
                name: sub.name,
                max: Number(sub.max_score) || 10,
                s1: has1 ? v1 : '-',
                s2: has2 ? v2 : '-',
                avg: (subAvg !== '-') ? subAvg.toFixed(2).replace(/\.00$/, '') : '-',
                grade: (subAvg !== '-') ? calculateGrade(subAvg) : '-'
              });
            });

            const avg1 = sem1Count > 0 ? (sem1Total / sem1Count) : 0;
            const avg2 = sem2Count > 0 ? (sem2Total / sem2Count) : 0;
            let yearAvg = 0;
            if (sem1Count > 0 && sem2Count > 0) yearAvg = (avg1 + avg2) / 2;
            else if (sem1Count > 0) yearAvg = avg1;
            else if (sem2Count > 0) yearAvg = avg2;

            return {
              id: st.student_id || st.id,
              name: st.student_name || 'គ្មានឈ្មោះ',
              gender: st.gender || 'ប្រុស',
              grade: pure,
              avgSem1: avg1,
              avgSem2: avg2,
              avgYear: yearAvg,
              yearGrade: yearAvg > 0 ? calculateGrade(yearAvg) : '-',
              absentUnexcused: unexcusedMap[sid] || 0,
              absentExcused: excusedMap[sid] || 0,
              semSubjects: activeSemSubjects
            };
          }
        });

        // ៦. គណនាចំណាត់ថ្នាក់
        const scoreKey = (reportMode === 'monthly') ? 'avgScore' : 'avgYear';
        const sorted = [...studentsList].sort((a, b) => b[scoreKey] - a[scoreKey]);
        const rankMap = {};
        let lastScore = null, lastRank = 0;
        sorted.forEach((item, index) => {
          if (item[scoreKey] === lastScore) {
            rankMap[item.id] = lastRank;
          } else {
            rankMap[item.id] = index + 1;
            lastRank = index + 1;
            lastScore = item[scoreKey];
          }
        });

        studentsList.forEach(s => {
          s.rank = rankMap[s.id] || 1;
        });

        currentStudentIndex = 0;
        populateStudentSelect();
        renderReportWorkspace();

      } catch (err) {
        console.error(err);
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុសផ្ទុកទិន្នន័យ៖ ${err.message}</div>`;
      }
    }

    function populateStudentSelect() {
      const sel = document.getElementById('studentSelectBox');
      if (!studentsList.length) {
        sel.innerHTML = '<option value="">គ្មានសិស្ស</option>';
        return;
      }
      sel.innerHTML = studentsList.map((s, idx) => 
        `<option value="${idx}">${idx + 1}. ${s.name}</option>`
      ).join('');
      sel.value = String(currentStudentIndex);
    }

    function onStudentSelect(idx) {
      currentStudentIndex = parseInt(idx, 10);
      renderReportWorkspace();
    }

    function prevStudent() {
      if (currentStudentIndex > 0) {
        currentStudentIndex--;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    function nextStudent() {
      if (currentStudentIndex < studentsList.length - 1) {
        currentStudentIndex++;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    /* =========================================================
       5. HTML GENERATOR (ខែ និង ឆមាស តាមរូបភាពគំរូ)
    ========================================================= */
    function generateReportHTML(st) {
      if (!st) return '';

      const totalAbsent = (st.absentUnexcused || 0) + (st.absentExcused || 0);
      const isMonthly = (reportMode === 'monthly');
      const docTitle = isMonthly ? `ព្រឹត្តិបត្រពិន្ទុ ខែ ${selectedMonth}` : `ព្រឹត្តិបត្រពិន្ទុ ${academicYearStr}`;
      const solarDateStr = isMonthly ? getAutoSolarDate(selectedMonth) : getAutoSolarDate('តុលា');

      let theadHtml = '';
      let tbodyHtml = '';
      let summaryRowsHtml = '';

      if (isMonthly) {
        // ── ព្រឹត្តិបត្រខែ ──
        theadHtml = `
          <tr>
            <th style="width: 32px;">ល.រ</th>
            <th colspan="2">មុខវិជ្ជា</th>
            <th style="width: 78px;">ពិន្ទុអតិបរមា</th>
            <th style="width: 82px;">ពិន្ទុទទួលបាន</th>
            <th style="width: 72px;">ចំណាត់ថ្នាក់</th>
            <th style="width: 52px;">និទ្ទេស</th>
            <th style="width: 78px;">សេចក្តីផ្សេងៗ</th>
          </tr>
        `;

        let rowCounter = 1;
        (st.monthlyGroups || []).forEach(g => {
          if (g.isGroup) {
            // មានជំនាញរង
            g.children.forEach((c, idx) => {
              const grClass = `gr-${c.grade}`;
              tbodyHtml += `<tr>`;
              tbodyHtml += `<td>${rowCounter++}</td>`;
              if (idx === 0) {
                tbodyHtml += `<td rowspan="${g.children.length}" style="font-weight:700; background:#fcfcfc;">${g.parentName}</td>`;
              }
              tbodyHtml += `<td style="text-align:left; padding-left:8px;">${c.name}</td>`;
              tbodyHtml += `<td>${c.max}</td>`;
              tbodyHtml += `<td class="bold-val">${c.score}</td>`;
              tbodyHtml += `<td style="color:#dc2626; font-weight:800;">${st.rank}</td>`;
              tbodyHtml += `<td class="${grClass}">${formatGrade(c.grade)}</td>`;
              tbodyHtml += `<td></td>`;
              tbodyHtml += `</tr>`;
            });
          } else {
            // មុខវិជ្ជាទោល
            const grClass = `gr-${g.grade}`;
            tbodyHtml += `<tr>`;
            tbodyHtml += `<td>${rowCounter++}</td>`;
            tbodyHtml += `<td colspan="2" style="font-weight:700;">${g.parentName}</td>`;
            tbodyHtml += `<td>${g.max}</td>`;
            tbodyHtml += `<td class="bold-val">${g.score}</td>`;
            tbodyHtml += `<td style="color:#dc2626; font-weight:800;">${st.rank}</td>`;
            tbodyHtml += `<td class="${grClass}">${formatGrade(g.grade)}</td>`;
            tbodyHtml += `<td></td>`;
            tbodyHtml += `</tr>`;
          }
        });

        summaryRowsHtml = `
          <tr style="background:#f8fafc;">
            <td colspan="3" class="summary-cell-text" style="text-align:left; padding-left:12px;">
              ពិន្ទុសរុប ${st.totalScore.toFixed(2)} • មធ្យមភាគ ${st.avgScore.toFixed(2)}
            </td>
            <td colspan="2" class="summary-cell-text">
              ចំណាត់ថ្នាក់ទី <span style="color:#dc2626; font-weight:800;">${st.rank}</span>
            </td>
            <td colspan="3" class="summary-cell-text gr-${st.gradeLabel}">
              និទ្ទេស ${formatGrade(st.gradeLabel)}
            </td>
          </tr>
          <tr style="background:#f8fafc;">
            <td colspan="3" class="summary-cell-text">
              អវត្តមាន (ឥតច្បាប់) ៖ ${st.absentUnexcused}
            </td>
            <td colspan="2" class="summary-cell-text">
              អវត្តមាន (មានច្បាប់) ៖ ${st.absentExcused}
            </td>
            <td colspan="3" class="summary-cell-text">
              សរុប ៖ ${totalAbsent}
            </td>
          </tr>
        `;

      } else {
        // ── ព្រឹត្តិបត្រឆមាស ──
        theadHtml = `
          <tr>
            <th style="width: 32px;">ល.រ</th>
            <th style="min-width: 140px;">មុខវិជ្ជា</th>
            <th style="width: 75px;">ពិន្ទុអតិបរមា</th>
            <th style="width: 85px;">ប្រឡងឆមាសទី១</th>
            <th style="width: 85px;">ប្រឡងឆមាសទី២</th>
            <th style="width: 68px;">មធ្យមភាគ</th>
            <th style="width: 52px;">និទ្ទេស</th>
          </tr>
        `;

        (st.semSubjects || []).forEach((row, i) => {
          const grClass = row.grade !== '-' ? `gr-${row.grade}` : '';
          tbodyHtml += `
            <tr>
              <td>${i + 1}</td>
              <td class="sub-name">${row.name}</td>
              <td>${row.max}</td>
              <td>${row.s1}</td>
              <td>${row.s2}</td>
              <td class="bold-val">${row.avg}</td>
              <td class="${grClass}">${formatGrade(row.grade)}</td>
            </tr>
          `;
        });

        summaryRowsHtml = `
          <tr style="background:#f8fafc;">
            <td colspan="4" class="summary-cell-text" style="text-align:left; padding-left:12px;">
              មធ្យមភាគឆមាសទី១ ${st.avgSem1 > 0 ? st.avgSem1.toFixed(2) : '-'} • ឆមាសទី២ ${st.avgSem2 > 0 ? st.avgSem2.toFixed(2) : '-'} • ប្រចាំឆ្នាំ ${st.avgYear > 0 ? st.avgYear.toFixed(2) : '-'}
            </td>
            <td colspan="2" class="summary-cell-text">
              ចំណាត់ថ្នាក់ទី <span style="color:#dc2626; font-weight:800;">${st.rank}</span>
            </td>
            <td class="summary-cell-text gr-${st.yearGrade}">
              និទ្ទេស ${formatGrade(st.yearGrade)}
            </td>
          </tr>
          <tr style="background:#f8fafc;">
            <td colspan="3" class="summary-cell-text">
              អវត្តមាន (ឥតច្បាប់) ៖ ${st.absentUnexcused}
            </td>
            <td colspan="2" class="summary-cell-text">
              អវត្តមាន (មានច្បាប់) ៖ ${st.absentExcused}
            </td>
            <td colspan="2" class="summary-cell-text">
              សរុប ៖ ${totalAbsent}
            </td>
          </tr>
        `;
      }

      return `
        <div class="report-sheet">
          <div class="sheet-national-header">
            <div class="nat-title-1 f-moul">ព្រះរាជាណាចក្រកម្ពុជា</div>
            <div class="nat-title-2 f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
            <div class="nat-symbol">─────── ❖ ───────</div>
          </div>

          <div class="sheet-sub-header">
            <div class="left-dept-info">
              <div>ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
              <div style="font-weight:700;">សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
              <div>ថ្នាក់ទី${st.grade}</div>
            </div>

            <div class="center-doc-title">
              <div class="doc-main-title f-moul">${docTitle}</div>
              <div class="doc-academic-year">ឆ្នាំសិក្សា ${academicYearStr}</div>
            </div>
          </div>

          <div class="student-meta-line">
            សិស្សឈ្មោះ: <span class="hl-val">${st.name}</span> • 
            ភេទ <span class="hl-val">${st.gender}</span> • 
            អត្តលេខ <span class="hl-val">${st.id}</span> • 
            ចំណាត់ថ្នាក់ទី <span class="hl-rank">${st.rank}</span>
          </div>

          <table class="report-table">
            <thead>${theadHtml}</thead>
            <tbody>
              ${tbodyHtml}
              ${summaryRowsHtml}
            </tbody>
          </table>

          <div class="sheet-signatures-area">
            <div class="sig-col left-col">
              <div class="sig-title-moul f-moul">បានឃើញ និងឯកភាព</div>
              <div class="sig-role f-moul">នាយកសាលា</div>
            </div>

            <div class="sig-col mid-col">
              <div class="sig-title-moul f-moul">មតិរបស់មាតាបិតា</div>
              <div class="f-moul" style="font-size:11px; margin-bottom:4px;">ឬអាណាព្យាបាលសិស្ស</div>
              <div class="parent-dotted-lines"></div>
              <div class="parent-dotted-lines"></div>
            </div>

            <div class="sig-col right-col">
              <div contenteditable="true" class="clean-lunar-input" onblur="teacherLunarDate=this.innerText.trim()" title="ចុចត្រង់នេះដើម្បីកែប្រែថ្ងៃខែចន្ទគតិ">${teacherLunarDate}</div>
              <div class="sig-solar-date">${solarDateStr}</div>
              <div class="sig-role f-moul" style="margin-top:2px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
              <div class="sig-name">${teacherName}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       6. RENDER WORKSPACE & MOBILE RESPONSIVE SCALING
    ========================================================= */
    function renderReportWorkspace() {
      const container = document.getElementById('paperWorkspace');

      if (!studentsList.length) {
        container.className = 'paper-stage';
        container.innerHTML = `
          <div class="empty-state-card">
            <i class="fa-solid fa-folder-open fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
            <div>មិនមានទិន្នន័យសិស្សត្រូវបង្ហាញឡើយ</div>
          </div>`;
        return;
      }

      if (layoutMode === '1_portrait') {
        container.className = 'paper-stage';
        const currentStudent = studentsList[currentStudentIndex] || studentsList[0];
        container.innerHTML = generateReportHTML(currentStudent);
      } else {
        container.className = 'paper-stage layout-2col';
        const st1 = studentsList[currentStudentIndex] || studentsList[0];
        const st2 = studentsList[currentStudentIndex + 1] || st1;

        container.innerHTML = `
          <div class="report-sheet-container-2col">
            ${generateReportHTML(st1)}
            ${generateReportHTML(st2)}
          </div>
        `;
      }

      applyAutoMobileScale();
    }

    function applyAutoMobileScale() {
      const stage = document.getElementById('paperWorkspace');
      const wrapper = document.getElementById('paperStageWrapper');
      if (!stage || !wrapper) return;

      const screenWidth = window.innerWidth;

      if (screenWidth <= 850 && isFitScreen) {
        const paperWidth = (layoutMode === '1_portrait') ? 794 : 1122;
        const availableWidth = screenWidth - 16;
        const scaleRatio = Math.min(1, availableWidth / paperWidth);

        stage.style.transform = `scale(${scaleRatio})`;
        stage.style.transformOrigin = 'top center';
        
        const scaledHeight = (stage.scrollHeight || 1122) * scaleRatio;
        wrapper.style.minHeight = (scaledHeight + 30) + 'px';
      } else {
        stage.style.transform = 'none';
        wrapper.style.minHeight = 'auto';
      }
    }

    function toggleMobileFitScreen() {
      isFitScreen = !isFitScreen;
      document.getElementById('txtFitScreen').innerText = isFitScreen ? 'សមអេក្រង់' : 'ទំហំដើម';
      const icon = document.querySelector('#btnFitScreen i');
      if (icon) icon.className = isFitScreen ? 'fa-solid fa-expand' : 'fa-solid fa-compress';
      applyAutoMobileScale();
    }

    window.addEventListener('resize', applyAutoMobileScale);

    function printReport() {
      const stage = document.getElementById('paperWorkspace');
      if (stage) stage.style.transform = 'none';
      window.print();
      applyAutoMobileScale();
    }

    function downloadPDF() {
      if (!studentsList.length) return alert('គ្មានទិន្នន័យដើម្បីទាញយកជា PDF ឡើយ!');
      const stage = document.getElementById('paperWorkspace');
      stage.style.transform = 'none';

      const isPortrait = (layoutMode === '1_portrait');
      const st = studentsList[currentStudentIndex] || studentsList[0];

      const opt = {
        margin: [4, 4, 4, 4],
        filename: `ព្រឹត្តិបត្រពិន្ទុ_${st.name}_ថ្នាក់ទី${st.grade}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isPortrait ? 'portrait' : 'landscape' }
      };

      html2pdf().set(opt).from(stage).save().then(() => {
        applyAutoMobileScale();
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuthentication()) return;
      await initClassDropdown();
    });
  </script>
</body>
</html>
