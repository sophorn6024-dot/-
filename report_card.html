<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ព្រឹត្តិបត្រពិន្ទុ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 📊 PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    body {
      background: #1e293b;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .f-moul {
      font-family: 'Khmer OS Muol Light', 'Moul', cursive !important;
      font-weight: normal;
    }

    /* =========================================================
       🔒 AUTH DENIED WRAPPER (ការពារការ LOGIN)
    ========================================================= */
    #authDeniedWrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
      padding: 30px 20px;
      width: 100%;
    }
    .auth-card {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 24px;
      padding: 38px 28px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f8fafc;
    }
    .auth-icon {
      width: 64px; height: 64px; border-radius: 20px;
      background: rgba(239, 68, 68, 0.15); color: #ef4444;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 14px;
    }
    .auth-card h2 { font-size: 17.5px; margin-bottom: 8px; color: #ef4444; }
    .auth-card p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 22px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff; padding: 10px 24px; border-radius: 12px;
      font-weight: 700; font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
    }

    /* =========================================================
       🎛️ TOP TOOLBAR (របារឧបករណ៍ផ្នែកខាងលើ)
    ========================================================= */
    .top-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid #334155;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .top-toolbar::-webkit-scrollbar { height: 3px; }
    .top-toolbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .pill-btn, .pill-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 14px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      outline: none;
      white-space: nowrap;
    }
    .pill-btn:hover, .pill-select:hover {
      background: #334155;
      border-color: #64748b;
    }

    .pill-btn.primary {
      background: #00875a;
      color: #ffffff;
      border-color: #00875a;
    }
    .pill-btn.primary:hover { background: #00734c; }

    /* Dropdown Popup */
    .dropdown-popup {
      display: none;
      position: fixed;
      min-width: 190px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      padding: 6px;
      z-index: 99999;
      animation: popIn 0.15s ease-out;
    }
    .dropdown-popup.show { display: block; }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      padding: 9px 12px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .dropdown-item:hover { background: #1e293b; }
    .dropdown-item.active { background: #0284c7; color: #fff; }

    /* Student Navigator */
    .student-nav-group {
      display: inline-flex;
      align-items: center;
      background: #1e293b;
      border-radius: 18px;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 4px;
    }
    .student-nav-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .student-nav-btn:hover { background: #334155; }
    .student-select-clean {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      padding: 0 6px;
      max-width: 150px;
    }
    .student-select-clean option { background: #0f172a; color: #fff; }

    /* 📱 MOBILE COMPACT MODE (លើទូរសព្ទបង្ហាញតែ ICON) */
    @media screen and (max-width: 768px) {
      .btn-label { display: none !important; }
      
      .top-toolbar {
        padding: 6px 8px;
        gap: 6px;
        justify-content: flex-start;
      }
      .pill-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        justify-content: center;
        gap: 0;
        border-radius: 50%;
      }
      .tb-group .fa-chevron-down { display: none; }
      
      .pill-select {
        height: 34px;
        padding: 0 8px;
        font-size: 11.5px;
        max-width: 110px;
      }
      .student-select-clean {
        max-width: 105px;
        font-size: 11.5px;
        padding: 0 4px;
      }
    }

    /* =========================================================
       📄 PAPER STAGE & SCALING SYSTEM
    ========================================================= */
    .paper-stage-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .paper-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    /* =========================================================
       📑 1 នាក់ • សន្លឹកបញ្ឈរ A4 (Portrait Mode)
    ========================================================= */
    .report-sheet {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      padding: 14mm 16mm 14mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: block;
      position: relative;
      color: #000;
    }

    .sheet-national-header { text-align: center; margin-bottom: 4px; }
    .nat-title-1 { font-size: 14.5px; margin-bottom: 2px; }
    .nat-title-2 { font-size: 13px; margin-bottom: 2px; }
    .nat-symbol { font-size: 10.5px; letter-spacing: 2.5px; }

    .sheet-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .left-dept-info { text-align: left; font-size: 12px; line-height: 1.45; }
    .left-dept-info div:first-child { font-weight: 700; }
    .left-dept-info div:last-child { font-weight: 700; }

    .center-doc-title { text-align: center; flex: 1; margin-right: 70px; }
    .doc-main-title { font-size: 16.5px; color: #000; margin-bottom: 2px; }
    .doc-academic-year { font-size: 13px; font-weight: 600; }

    .student-meta-line {
      text-align: center;
      font-size: 12.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .student-meta-line span.hl-val { font-weight: 700; }
    .student-meta-line span.hl-rank { color: #dc2626; font-weight: 800; }

    /* ── Table Styling ── */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 11.5px;
      border: 1px solid #000;
      margin-bottom: 12px;
    }
    .report-table th, .report-table td {
      border: 1px solid #000;
      padding: 4px 3px;
      vertical-align: middle;
      height: 25px;
      white-space: nowrap; /* 🌟 រារាំងមិនឱ្យធ្លាក់បន្ទាត់ជាដាច់ខាត */
    }
    .report-table thead th {
      background: #e2e8f0;
      font-weight: 700;
      font-size: 11.5px;
      white-space: nowrap;
    }
    
    /* 🌟 ក្រឡាមុខវិជ្ជា៖ កុំឱ្យធ្លាក់ ២ បន្ទាត់ & ទុកទំហំធំទូលាយ */
    .report-table td.sub-name {
      text-align: center;
      font-weight: 700;
      white-space: nowrap !important; /* 🌟 មិនធ្លាក់បន្ទាត់ */
      padding: 4px 6px;
    }
    .report-table td.bold-val { font-weight: 700; }

    .gr-A { color: #0284c7; font-weight: 800; }
    .gr-B { color: #b45309; font-weight: 800; }
    .gr-C { color: #16a34a; font-weight: 800; }
    .gr-D { color: #2563eb; font-weight: 800; }
    .gr-E { color: #7c3aed; font-weight: 800; }
    .gr-F { color: #dc2626; font-weight: 800; }

    .summary-cell-text { font-size: 11px; font-weight: 700; padding: 5px 3px; white-space: nowrap; }

    /* ── Signatures & Footer ── */
    .sheet-signatures-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 10px;
      padding: 0 4px;
      font-size: 11px;
    }
    .sig-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 180px;
    }

    .sig-col.left-col { min-width: 190px; margin-top: 50px; }
    .sig-col.mid-col  { min-width: 170px; margin-top: 28px; }
    .sig-col.right-col { min-width: 200px; margin-top: 0; }

    .sig-title-moul { font-size: 11.5px; color: #000; margin-bottom: 3px; }
    .sig-role { font-weight: 700; font-size: 11.5px; margin-bottom: 45px; }
    .sig-name { font-weight: 700; font-size: 12.5px; }
    .sig-solar-date { font-size: 11px; font-weight: 700; margin-top: 3px; }

    .clean-lunar-input {
      font-size: 11px;
      font-weight: bold;
      color: #000;
      border: 1px dashed transparent;
      background: transparent;
      text-align: center;
      width: 100%;
      outline: none;
      cursor: text;
      padding: 2px;
      transition: all 0.2s;
    }
    .clean-lunar-input:hover, .clean-lunar-input:focus {
      border-color: #3b82f6;
      background: rgba(239, 246, 255, 0.7);
      border-radius: 4px;
    }

    .parent-dotted-lines {
      width: 100%;
      border-bottom: 1px dotted #000;
      height: 14px;
      margin-top: 10px;
    }

    /* =========================================================
       📑 2 នាក់ • សន្លឹកផ្តេក A4 (Landscape Mode)
    ========================================================= */
    .paper-stage.layout-2col .report-sheet-container-2col {
      background: #ffffff;
      width: 297mm;
      min-height: 210mm;
      max-height: 210mm;
      padding: 6mm 8mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8mm;
      overflow: hidden;
    }

    .paper-stage.layout-2col .report-sheet {
      width: 100%;
      min-height: auto;
      box-shadow: none;
      padding: 0;
      font-size: 9.5px;
    }

    .paper-stage.layout-2col .nat-title-1 { font-size: 11.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-title-2 { font-size: 10.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-symbol { font-size: 8.5px; letter-spacing: 1.5px; }
    .paper-stage.layout-2col .doc-main-title { font-size: 12.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .doc-academic-year { font-size: 10px; }
    .paper-stage.layout-2col .left-dept-info { font-size: 9.5px; line-height: 1.35; }
    .paper-stage.layout-2col .center-doc-title { margin-right: 40px; }
    .paper-stage.layout-2col .student-meta-line { font-size: 10px; margin-bottom: 4px; }
    
    .paper-stage.layout-2col .report-table { font-size: 9.2px; margin-bottom: 6px; }
    .paper-stage.layout-2col .report-table th,
    .paper-stage.layout-2col .report-table td {
      padding: 2px 1px;
      height: 19px;
      white-space: nowrap !important;
    }
    
    /* 🌟 បែងចែកទទឹងក្រឡា Mode 2 នាក់ ឱ្យសមមាត្រ កុំឱ្យរុញមុខវិជ្ជាធ្លាក់បន្ទាត់ */
    .paper-stage.layout-2col .report-table th.col-no { width: 22px !important; }
    .paper-stage.layout-2col .report-table th.col-sub { width: auto !important; min-width: 108px !important; }
    .paper-stage.layout-2col .report-table th.col-max { width: 50px !important; }
    .paper-stage.layout-2col .report-table th.col-s1 { width: 62px !important; }
    .paper-stage.layout-2col .report-table th.col-s2 { width: 62px !important; }
    .paper-stage.layout-2col .report-table th.col-avg { width: 44px !important; }
    .paper-stage.layout-2col .report-table th.col-gr { width: 34px !important; }

    .paper-stage.layout-2col .summary-cell-text { font-size: 8.8px; padding: 2px; }

    .paper-stage.layout-2col .sheet-signatures-area { font-size: 9px; margin-top: 4px; }
    .paper-stage.layout-2col .sig-col { min-width: 120px; }
    .paper-stage.layout-2col .sig-col.left-col { min-width: 120px; margin-top: 36px; }
    .paper-stage.layout-2col .sig-col.mid-col  { min-width: 110px; margin-top: 18px; }
    .paper-stage.layout-2col .sig-col.right-col { min-width: 130px; margin-top: 0; }
    .paper-stage.layout-2col .sig-title-moul { font-size: 9px; }
    .paper-stage.layout-2col .sig-role { font-size: 9px; margin-bottom: 26px; }
    .paper-stage.layout-2col .sig-name { font-size: 9.5px; }
    .paper-stage.layout-2col .clean-lunar-input { font-size: 8.5px; padding: 1px; }
    .paper-stage.layout-2col .sig-solar-date { font-size: 8.5px; }
    .paper-stage.layout-2col .parent-dotted-lines { height: 10px; margin-top: 6px; }

    .empty-state-card {
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 440px;
      margin-top: 40px;
    }

    /* =========================================================
       🖨️ PRINT & PDF SETUP
    ========================================================= */
    @page { size: A4 portrait; margin: 6mm 8mm; }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; overflow: visible !important; }
      .top-toolbar, #authDeniedWrap { display: none !important; }
      .paper-stage-wrapper { padding: 0 !important; overflow: visible !important; display: block !important; }
      .paper-stage { transform: none !important; gap: 0 !important; }
      .report-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }
      .clean-lunar-input { border: none !important; background: transparent !important; }
      .paper-stage.layout-2col .report-sheet-container-2col {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       🔒 AUTH DENIED (ផ្ទៀងផ្ទាត់ការ LOGIN)
  ========================================================= -->
  <div id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2 class="f-moul">សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីមើល និងបោះពុម្ពព្រឹត្តិបត្រពិន្ទុ។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       1. TOOLBAR ផ្នែកខាងលើ
  ========================================================= -->
  <div class="top-toolbar" id="mainToolbar" style="display:none;">
    
    <!-- ជ្រើសរើសថ្នាក់ (Class Selector) -->
    <select id="classSelectPill" class="pill-select" onchange="onClassChange(this.value)">
      <option value="">កំពុងទាញយកថ្នាក់...</option>
    </select>

    <!-- Dropdown: ចំនួនសន្លឹក និងទិសដៅ -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('layoutDropdown', this)" title="ប្តូរទម្រង់សន្លឹក (បញ្ឈរ/ផ្តេក)">
        <i class="fa-solid fa-file-lines"></i>
        <span class="btn-label" id="currentLayoutText">1 នាក់ • សន្លឹកបញ្ឈរ</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 2px;"></i>
      </button>

      <div class="dropdown-popup" id="layoutDropdown">
        <div class="dropdown-item active" onclick="setLayoutMode('1_portrait', '1 នាក់ • សន្លឹកបញ្ឈរ', this)">
          <span>1 នាក់ • សន្លឹកបញ្ឈរ</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setLayoutMode('2_landscape', '2 នាក់ • សន្លឹកផ្តេក A4', this)">
          <span>2 នាក់ • សន្លឹកផ្តេក A4</span>
        </div>
      </div>
    </div>

    <!-- Dropdown: ប្រភេទនិទ្ទេស -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('gradeDropdown', this)" title="ប្តូរនិទ្ទេស (A-F ឬ ខ្មែរ)">
        <i class="fa-solid fa-language"></i>
        <span class="btn-label" id="currentGradeText">និទ្ទេស A–F</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 2px;"></i>
      </button>

      <div class="dropdown-popup" id="gradeDropdown">
        <div class="dropdown-item active" onclick="setGradeFormat('AF', 'និទ្ទេស A–F', this)">
          <span>និទ្ទេស A–F</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setGradeFormat('KH', 'និទ្ទេស ខ្មែរ', this)">

  <!-- =========================================================
       3. JAVASCRIPT: SUPABASE & DYNAMIC REAL DATA
  ========================================================= -->
  <script>
    /* ── Supabase Configuration ── */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── Read Session User & Authentication Check ── */
    function readSession() {
      try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
    }
    const CURRENT_USER = readSession();
    const USER_ROLE = CURRENT_USER?.role || "teacher";
    const USER_CLASS = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
    const IS_ADMIN = String(USER_ROLE).toLowerCase().trim() === 'admin';

    function checkAuthentication() {
      if (!CURRENT_USER || !CURRENT_USER.username) {
        document.getElementById('authDeniedWrap').style.display = 'flex';
        document.getElementById('mainToolbar').style.display = 'none';
        document.getElementById('paperStageWrapper').style.display = 'none';
        return false;
      }
      document.getElementById('authDeniedWrap').style.display = 'none';

    }

    function goToIndex(e) {
      if (e) e.preventDefault();
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'OPEN_LOGIN', action: 'LOGIN' }, '*');
          window.parent.location.href = 'index.html';
          return;
        } catch(err) {}
      }
      window.location.href = 'index.html';
    }

    /* ── State ── */
    let layoutMode = '1_portrait';
    let gradeMode = 'AF';
    let currentClassName = '';
    let studentsList = [];
    let currentStudentIndex = 0;
    let isFitScreen = true;

    const now = new Date();
    const currentYear = now.getFullYear();
    const academicYearStr = `${currentYear}-${currentYear + 1}`;

    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
    function toKhmerNum(n) { return String(n).replace(/\d/g, d => KHMER_DIGITS[d]); }

    function getAutoSolarDate() {
      const year = currentYear;
      const lastDay = new Date(year, 10, 0).getDate();
      return `កំពង់ល្ពៅ, ថ្ងៃទី${toKhmerNum(lastDay)} ខែតុលា ឆ្នាំ${toKhmerNum(year)}`;
    }

    let currentSolarDate = getAutoSolarDate();
    let teacherLunarDate = "ថ្ងៃពុធ ៣កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let teacherName = CURRENT_USER?.teacher_name || "គ្រូទទួលបន្ទុកថ្នាក់";

    function cleanGrade(g) {
      return String(g || '').replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/, '').trim();
    }

    const GRADE_KH_MAP = {
      'A': 'ល្អប្រសើរ',
      'B': 'ល្អណាស់',
      'C': 'ល្អ',
      'D': 'បង្គួរ',
      'E': 'មធ្យម',
      'F': 'ខ្សោយ'
    };

    function formatGrade(code) {
      if (!code || code === '-') return '-';
      return (gradeMode === 'KH') ? (GRADE_KH_MAP[code] || code) : code;
    }

    function calculateGrade(avg) {
      if (avg >= 9) return 'A';
      if (avg >= 8) return 'B';
      if (avg >= 7) return 'C';
      if (avg >= 6) return 'D';
      if (avg >= 5) return 'E';
      return 'F';
    }

    /* 🌟 Dropdown Controller */
    function toggleDropdown(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const isShown = el.classList.contains('show');
      closeAllDropdowns();
      if (!isShown) {
        el.classList.add('show');
        if (btn) {
          const r = btn.getBoundingClientRect();
          el.style.top = (r.bottom + 6) + 'px';
          
          let left = r.left;
          if (left + 200 > window.innerWidth) {
            left = window.innerWidth - 206;
          }
          el.style.left = Math.max(8, left) + 'px';
        }
      }
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-popup').forEach(d => d.classList.remove('show'));
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tb-group')) closeAllDropdowns();
    });

    window.addEventListener('scroll', closeAllDropdowns, true);
    window.addEventListener('resize', closeAllDropdowns);

    function setLayoutMode(mode, label, el) {
      layoutMode = mode;
      document.getElementById('currentLayoutText').innerText = label;
      document.querySelectorAll('#layoutDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function setGradeFormat(fmt, label, el) {
      gradeMode = fmt;
      document.getElementById('currentGradeText').innerText = label;
      document.querySelectorAll('#gradeDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    /* =========================================================
       4. FETCH REAL DATA FROM SUPABASE
    ========================================================= */
    async function initClassDropdown() {
      const sel = document.getElementById('classSelectPill');
      sel.innerHTML = '<option value="">កំពុងទាញយកថ្នាក់...</option>';

      try {
        const { data, error } = await sb.from('students').select('grade').limit(5000);
        if (error) throw error;

        let rawClasses = Array.from(new Set((data || []).map(d => cleanGrade(d.grade)).filter(Boolean)));
        rawClasses.sort((a,b) => a.localeCompare(b, 'km', { numeric: true }));

        sel.innerHTML = rawClasses.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');

        const cleanUserClass = cleanGrade(USER_CLASS);
        if (!IS_ADMIN && cleanUserClass) {
          sel.value = cleanUserClass;
          sel.disabled = true;
          currentClassName = cleanUserClass;
        } else {
          sel.value = (cleanUserClass && rawClasses.includes(cleanUserClass)) ? cleanUserClass : (rawClasses[0] || '');
          currentClassName = sel.value;
        }

        await loadRealDataForClass(currentClassName);

      } catch (err) {
        sel.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

    function onClassChange(val) {
      currentClassName = val;
      loadRealDataForClass(val);
    }

    async function loadRealDataForClass(cls) {
      const pure = cleanGrade(cls);
      if (!pure) return;

      document.getElementById('paperWorkspace').innerHTML = `
        <div class="empty-state-card">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7; margin-bottom:12px;"></i>
          <div>កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${pure}...</div>
        </div>`;

      try {
        // ១. ទាញយកបញ្ជីសិស្សពិត
        const { data: stData, error: stErr } = await sb
          .from('students')
          .select('*')
          .in('grade', [pure, `ថ្នាក់ទី${pure}`, `ថ្នាក់ទី ${pure}`])
          .order('id', { ascending: true });
        if (stErr) throw stErr;

        if (!stData || stData.length === 0) {
          studentsList = [];
          populateStudentSelect();
          document.getElementById('paperWorkspace').innerHTML = `
            <div class="empty-state-card">
              <i class="fa-solid fa-user-slash fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
              <div>មិនទាន់មានទិន្នន័យសិស្សក្នុងថ្នាក់ទី ${pure} នៅឡើយទេ</div>
            </div>`;
          return;
        }

        // ២. ទាញយកមុខវិជ្ជាឆមាសពិត
        const { data: subData } = await sb
          .from('subjects')
          .select('*')
          .eq('assigned_class', pure)
          .eq('subject_type', 'semester')
          .order('sort_order', { ascending: true });

        const defaultSemSubjects = [
          { name: "អំណាន", code: "read", max: 10 },
          { name: "ស្ដាប់ និងនិយាយ", code: "listen", max: 10 },
          { name: "សរសេរតាមអាន", code: "dictation", max: 10 },
          { name: "តែងសេចក្ដី", code: "essay", max: 10 },
          { name: "គណិតវិទ្យា", code: "math", max: 10 },
          { name: "វិទ្យាសាស្ត្រ", code: "science", max: 10 },
          { name: "សិក្សាសង្គម", code: "social", max: 10 },
          { name: "គេហវិទ្យា-អប់រំសិល្បៈ", code: "homeArts", max: 10 },
          { name: "អប់រំកាយ-សុខភាព", code: "pe", max: 10 },
          { name: "អប់រំបំណិនជីវិត", code: "ethics", max: 10 },
          { name: "ភាសាបរទេស", code: "foreign", max: 10 }
        ];

        let classSubjects = (subData && subData.length > 0)
          ? subData.map((s, i) => ({ no: i + 1, name: s.name, code: s.code || `sub_${s.id}`, max: Number(s.max_score) || 10 }))
          : defaultSemSubjects.map((s, i) => ({ no: i + 1, name: s.name, code: s.code, max: s.max }));

        // ៣. ទាញយកពិន្ទុឆមាសទី១ និងទី២
        const { data: scData } = await sb
          .from('scores')
          .select('*')
          .eq('assigned_class', pure)
          .eq('score_type', 'semester');

        const scoreMapS1 = {};
        const scoreMapS2 = {};

        (scData || []).forEach(row => {
          let scObj = row.scores || {};
          if (typeof scObj === 'string') {
            try { scObj = JSON.parse(scObj); } catch(e) { scObj = {}; }
          }
          const sid = String(row.student_id);
          if (row.period === 'ឆមាសទី១') scoreMapS1[sid] = scObj;
          if (row.period === 'ឆមាសទី២') scoreMapS2[sid] = scObj;
        });

        // ៤. ទាញយកអវត្តមានសិស្សពិត
        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, status')
          .eq('assigned_class', pure);

        const unexcusedMap = {};
        const excusedMap = {};
        const unexcusedCodes = ['A', 'អ', 'អត់ច្បាប់', 'អវត្តមាន', 'ABSENT', 'UNEXCUSED'];
        const excusedCodes = ['C', 'ច', 'ច្បាប់', 'មានច្បាប់', 'EXCUSED', 'PERMISSION'];

        (attData || []).forEach(a => {
          const sid = String(a.student_id);
          const st = String(a.status || '').trim().toUpperCase();
          if (unexcusedCodes.includes(st)) unexcusedMap[sid] = (unexcusedMap[sid] || 0) + 1;
          if (excusedCodes.includes(st)) excusedMap[sid] = (excusedMap[sid] || 0) + 1;
        });

        // ៥. បូកសរុបពិន្ទុ មធ្យមភាគ និងចំណាត់ថ្នាក់
        studentsList = stData.map(st => {
          const sid = String(st.student_id || st.id);
          const sc1 = scoreMapS1[sid] || {};
          const sc2 = scoreMapS2[sid] || {};

          let sem1Total = 0, sem1Count = 0;
          let sem2Total = 0, sem2Count = 0;

          const studentScores = classSubjects.map((sub, i) => {
            const v1 = parseFloat(sc1[sub.code]);
            const v2 = parseFloat(sc2[sub.code]);

            const has1 = !isNaN(v1);
            const has2 = !isNaN(v2);

            if (has1) { sem1Total += v1; sem1Count++; }
            if (has2) { sem2Total += v2; sem2Count++; }

            let subAvg = '-';
            let subGrade = '-';

            if (has1 && has2) subAvg = ((v1 + v2) / 2);
            else if (has1) subAvg = v1;
            else if (has2) subAvg = v2;

            if (subAvg !== '-') {
              subGrade = calculateGrade(subAvg);
              subAvg = subAvg.toFixed(2).replace(/\.00$/, '');
            }

            return {
              no: i + 1,
              name: sub.name,
              max: sub.max,
              s1: has1 ? v1 : '-',
              s2: has2 ? v2 : '-',
              avg: subAvg,
              grade: subGrade
            };
          });

          const avg1 = sem1Count > 0 ? (sem1Total / sem1Count) : 0;
          const avg2 = sem2Count > 0 ? (sem2Total / sem2Count) : 0;
          let yearAvg = 0;

          if (sem1Count > 0 && sem2Count > 0) yearAvg = (avg1 + avg2) / 2;
          else if (sem1Count > 0) yearAvg = avg1;
          else if (sem2Count > 0) yearAvg = avg2;

          return {
            id: st.student_id || st.id,
            name: st.student_name || 'គ្មានឈ្មោះ',
            gender: st.gender || 'ប្រុស',
            grade: pure,
            avgSem1: avg1,
            avgSem2: avg2,
            avgYear: yearAvg,
            yearGrade: yearAvg > 0 ? calculateGrade(yearAvg) : '-',
            absentUnexcused: unexcusedMap[sid] || 0,
            absentExcused: excusedMap[sid] || 0,
            scores: studentScores
          };
        });

        // ៦. គណនាចំណាត់ថ្នាក់
        const sortedList = [...studentsList].sort((a, b) => b.avgYear - a.avgYear);
        const rankMap = {};
        let lastAvg = null, lastRank = 0;
        sortedList.forEach((item, index) => {
          if (item.avgYear === lastAvg) {
            rankMap[item.id] = lastRank;
          } else {
            rankMap[item.id] = index + 1;
            lastRank = index + 1;
            lastAvg = item.avgYear;
          }
        });

        studentsList.forEach(s => {
          s.rank = rankMap[s.id] || '-';
          s.yearRank = rankMap[s.id] || '-';
        });

        currentStudentIndex = 0;
        populateStudentSelect();
        renderReportWorkspace();

      } catch (err) {
        console.error(err);
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុសផ្ទុកទិន្នន័យ៖ ${err.message}</div>`;
      }
    }

    /* ── Student Navigator ── */
    function populateStudentSelect() {
      const sel = document.getElementById('studentSelectBox');
      if (!studentsList.length) {
        sel.innerHTML = '<option value="">គ្មានសិស្ស</option>';
        return;
      }
      sel.innerHTML = studentsList.map((s, idx) => 
        `<option value="${idx}">${idx + 1}. ${s.name}</option>`
      ).join('');
      sel.value = String(currentStudentIndex);
    }

    function onStudentSelect(idx) {
      currentStudentIndex = parseInt(idx, 10);
      renderReportWorkspace();
    }

    function prevStudent() {
      if (currentStudentIndex > 0) {
        currentStudentIndex--;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    function nextStudent() {
      if (currentStudentIndex < studentsList.length - 1) {
        currentStudentIndex++;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    /* =========================================================
       5. HTML TEMPLATE FOR SINGLE REPORT CARD
    ========================================================= */

      if (!st) return '';

      let rowsHtml = '';
      st.scores.forEach(row => {
        const grClass = row.grade !== '-' ? `gr-${row.grade}` : '';
        rowsHtml += `
          <tr>
            <td>${row.no}</td>
            <td class="sub-name">${row.name}</td>
            <td>${row.max}</td>
            <td>${row.s1}</td>
            <td>${row.s2}</td>
            <td class="bold-val">${row.avg}</td>
            <td class="${grClass}">${formatGrade(row.grade)}</td>
          </tr>
        `;
      });

      const totalAbsent = (st.absentUnexcused || 0) + (st.absentExcused || 0);
      const yearGradeClass = st.yearGrade !== '-' ? `gr-${st.yearGrade}` : '';

      return `
        <div class="report-sheet">
          <!-- ក្បាលទំព័រជាតិ -->
          <div class="sheet-national-header">
            <div class="nat-title-1 f-moul">ព្រះរាជាណាចក្រកម្ពុជា</div>
            <div class="nat-title-2 f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
            <div class="nat-symbol">─────── ❖ ───────</div>
          </div>

          <!-- ឈ្មោះសាលា និង ចំណងជើង -->
          <div class="sheet-sub-header">
            <div class="left-dept-info">
              <div>ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
              <div style="font-weight:700;">សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
              <div>ថ្នាក់ទី${st.grade}</div>
            </div>

            <div class="center-doc-title">
              <div class="doc-main-title f-moul">ព្រឹត្តិបត្រពិន្ទុ ${academicYearStr}</div>
              <div class="doc-academic-year">ឆ្នាំសិក្សា ${academicYearStr}</div>
            </div>
          </div>

          <!-- ព័ត៌មានសិស្ស -->
          <div class="student-meta-line">
            សិស្សឈ្មោះ: <span class="hl-val">${st.name}</span> • 
            ភេទ <span class="hl-val">${st.gender}</span> • 
            អត្តលេខ <span class="hl-val">${st.id}</span> • 
            ចំណាត់ថ្នាក់ទី <span class="hl-rank">${st.rank}</span>
          </div>

          <!-- តារាងពិន្ទុមុខវិជ្ជា (🌟 មុខវិជ្ជាលើ ១ បន្ទាត់រហូត មិនធ្លាក់ជា ២ បន្ទាត់ឡើយ) -->
          <table class="report-table">
            <thead>
              <tr>
                <th class="col-no" style="width: 32px;">ល.រ</th>
                <th class="col-sub" style="min-width: 140px;">មុខវិជ្ជា</th>
                <th class="col-max" style="width: 75px;">ពិន្ទុអតិបរមា</th>
                <th class="col-s1" style="width: 85px;">ប្រឡងឆមាសទី១</th>
                <th class="col-s2" style="width: 85px;">ប្រឡងឆមាសទី២</th>
                <th class="col-avg" style="width: 68px;">មធ្យមភាគ</th>
                <th class="col-gr" style="width: 52px;">និទ្ទេស</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
              <!-- ជួរទី១ សង្ខេបលទ្ធផល -->
              <tr style="background:#f8fafc;">
                <td colspan="4" class="summary-cell-text" style="text-align:left; padding-left:12px;">
                  មធ្យមភាគឆមាសទី១ ${st.avgSem1 > 0 ? st.avgSem1.toFixed(2) : '-'} • ឆមាសទី២ ${st.avgSem2 > 0 ? st.avgSem2.toFixed(2) : '-'} • ប្រចាំឆ្នាំ ${st.avgYear > 0 ? st.avgYear.toFixed(2) : '-'}
                </td>
                <td colspan="2" class="summary-cell-text" style="color:#000;">
                  ចំណាត់ថ្នាក់ទី <span style="color:#dc2626; font-weight:800;">${st.yearRank}</span>
                </td>
                <td class="summary-cell-text ${yearGradeClass}">
                  និទ្ទេស ${formatGrade(st.yearGrade)}
                </td>
              </tr>
              <!-- ជួរទី២ សង្ខេបអវត្តមាន -->
              <tr style="background:#f8fafc;">
                <td colspan="3" class="summary-cell-text">
                  អវត្តមាន (ឥតច្បាប់) ៖ ${st.absentUnexcused}
                </td>
                <td colspan="3" class="summary-cell-text">
                  អវត្តមាន (មានច្បាប់) ៖ ${st.absentExcused}
                </td>
                <td class="summary-cell-text">
                  សរុប ៖ ${totalAbsent}
                </td>
              </tr>
            </tbody>
          </table>

          <!-- 🌟 កន្លែងហត្ថលេខា (នាយកសាលាទាបជាងគ្រូ តាមក្បួនច្បាប់) -->
          <div class="sheet-signatures-area">
            <!-- ឆ្វេង៖ នាយកសាលា (ស្ថិតនៅទាបជាងគ្រូ) -->
            <div class="sig-col left-col">
              <div class="sig-title-moul f-moul">បានឃើញ និងឯកភាព</div>
              <div class="sig-role f-moul">នាយកសាលា</div>
            </div>

            <!-- កណ្ដាល៖ មតិអាណាព្យាបាល -->
            <div class="sig-col mid-col">
              <div class="sig-title-moul f-moul">មតិរបស់មាតាបិតា</div>
              <div class="f-moul" style="font-size:11px; margin-bottom:4px;">ឬអាណាព្យាបាលសិស្ស</div>
              <div class="parent-dotted-lines"></div>
              <div class="parent-dotted-lines"></div>
            </div>

            <!-- ស្ដាំ៖ គ្រូទទួលបន្ទុកថ្នាក់ -->
            <div class="sig-col right-col">
              <input type="text" class="clean-lunar-input" value="${teacherLunarDate}" onchange="teacherLunarDate=this.value" title="ចុចត្រង់នេះដើម្បីកែប្រែថ្ងៃខែចន្ទគតិ">
              <div class="sig-solar-date">${currentSolarDate}</div>
              <div class="sig-role f-moul" style="margin-top:2px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
              <div class="sig-name">${teacherName}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       6. RENDER WORKSPACE & MOBILE RESPONSIVE SCALING
    ========================================================= */
    function renderReportWorkspace() {
      const container = document.getElementById('paperWorkspace');

      if (!studentsList.length) {
        container.className = 'paper-stage';
        container.innerHTML = `
          <div class="empty-state-card">
            <i class="fa-solid fa-folder-open fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
            <div>មិនមានទិន្នន័យសិស្សត្រូវបង្ហាញឡើយ</div>
          </div>`;
        return;
      }

      if (layoutMode === '1_portrait') {
        container.className = 'paper-stage';
        const currentStudent = studentsList[currentStudentIndex] || studentsList[0];
        container.innerHTML = generateReportHTML(currentStudent);
      } else {
        container.className = 'paper-stage layout-2col';
        const st1 = studentsList[currentStudentIndex] || studentsList[0];
        const st2 = studentsList[currentStudentIndex + 1] || st1;

        container.innerHTML = `
          <div class="report-sheet-container-2col">
            ${generateReportHTML(st1)}
            ${generateReportHTML(st2)}
          </div>
        `;
      }

      applyAutoMobileScale();
    }

    /* 🌟 អនុគមន៍ពង្រីក/បង្រួមសមអេក្រង់ទូរសព្ទស្វ័យប្រវត្តិ */
    function applyAutoMobileScale() {
      const stage = document.getElementById('paperWorkspace');
      const wrapper = document.getElementById('paperStageWrapper');
      if (!stage || !wrapper) return;

      const screenWidth = window.innerWidth;

      if (screenWidth <= 850 && isFitScreen) {
        const paperWidth = (layoutMode === '1_portrait') ? 794 : 1122;
        const availableWidth = screenWidth - 16;
        const scaleRatio = Math.min(1, availableWidth / paperWidth);

        stage.style.transform = `scale(${scaleRatio})`;
        stage.style.transformOrigin = 'top center';
        
        const scaledHeight = (stage.scrollHeight || 1122) * scaleRatio;
        wrapper.style.minHeight = (scaledHeight + 30) + 'px';
      } else {
        stage.style.transform = 'none';
        wrapper.style.minHeight = 'auto';
      }
    }

    function toggleMobileFitScreen() {
      isFitScreen = !isFitScreen;
      document.getElementById('txtFitScreen').innerText = isFitScreen ? 'សមអេក្រង់' : 'ទំហំដើម';
      const icon = document.querySelector('#btnFitScreen i');
      if (icon) icon.className = isFitScreen ? 'fa-solid fa-expand' : 'fa-solid fa-compress';
      applyAutoMobileScale();
    }

    window.addEventListener('resize', applyAutoMobileScale);

    function printReport() {
      const stage = document.getElementById('paperWorkspace');
      if (stage) stage.style.transform = 'none';
      window.print();
      applyAutoMobileScale();
    }

    function downloadPDF() {
      if (!studentsList.length) return alert('គ្មានទិន្នន័យដើម្បីទាញយកជា PDF ឡើយ!');
      const stage = document.getElementById('paperWorkspace');
      stage.style.transform = 'none';

      const isPortrait = (layoutMode === '1_portrait');
      const st = studentsList[currentStudentIndex] || studentsList[0];

      const opt = {
        margin: [4, 4, 4, 4],
        filename: `ព្រឹត្តិបត្រពិន្ទុ_${st.name}_ថ្នាក់ទី${st.grade}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isPortrait ? 'portrait' : 'landscape' }
      };

      html2pdf().set(opt).from(stage).save().then(() => {
        applyAutoMobileScale();
      });
    }

    /* ── ដំណើរការពេលបើកទំព័រដំបូង ── */
    window.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuthentication()) return;
      await initClassDropdown();
    });
  </script>
</body>
</html>
