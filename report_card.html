<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ព្រឹត្តិបត្រពិន្ទុ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 📊 Excel & PDF Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    select, option, input, button {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif !important;
      font-weight: 700 !important;
    }

    body {
      background: #1e293b;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .f-moul {
      font-family: 'Khmer OS Muol Light', 'Moul', cursive !important;
      font-weight: normal;
    }

    /* 🔒 AUTH DENIED WRAPPER */
    #authDeniedWrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
      padding: 30px 20px;
      width: 100%;
    }
    .auth-card {
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 24px;
      padding: 38px 28px;
      max-width: 430px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f8fafc;
    }
    .auth-icon {
      width: 64px; height: 64px; border-radius: 20px;
      background: rgba(239, 68, 68, 0.15); color: #ef4444;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 14px;
    }
    .auth-card h2 { font-size: 17.5px; margin-bottom: 8px; color: #ef4444; }
    .auth-card p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 22px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff; padding: 10px 24px; border-radius: 12px;
      font-weight: 700; font-size: 13px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer;
    }

    /* =========================================================
       🎛️ TOP TOOLBAR
    ========================================================= */
    .top-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #0f172a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid #334155;
    }

    .tb-row-1, .tb-row-2 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .pill-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 13px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      outline: none;
      white-space: nowrap;
    }
    .pill-btn:hover {
      background: #334155;
      border-color: #64748b;
    }
    .pill-btn.primary {
      background: #00875a;
      color: #ffffff;
      border-color: #00875a;
    }
    .pill-btn.primary:hover { background: #00734c; }

    /* =========================================================
       🌟 CUSTOM SELECT (ប៊ូតុងជ្រើសរើស ទម្រង់ថ្មី)
    ========================================================= */
    .cselect {
      position: relative;
      display: inline-flex;
    }
    .cs-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 13px;
      border-radius: 18px;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.15s ease;
      outline: none;
      white-space: nowrap;
      width: 100%;
    }
    .cs-btn:hover { background: #334155; border-color: #64748b; }
    .cs-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .cs-label {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .cs-chev {
      font-size: 10px;
      color: #38bdf8;
      transition: transform 0.2s ease;
    }
    .cs-btn.open .cs-chev,
    .pill-btn.open .fa-chevron-down { transform: rotate(180deg); }
    .pill-btn .fa-chevron-down { transition: transform 0.2s ease; }

    /* ប៊ូតុងខែ ពណ៌ខៀវលេចធ្លោ */
    .cselect.month .cs-btn {
      color: #38bdf8;
      border-color: #0284c7;
      background: #0b1f33;
    }
    .cselect.month .cs-btn:hover { background: #10304d; }

    /* ប៊ូតុងសិស្ស (នៅក្នុង nav group) */
    .student-nav-group {
      display: inline-flex;
      align-items: center;
      background: #1e293b;
      border-radius: 18px;
      border: 1px solid #475569;
      height: 36px;
      padding: 0 4px;
    }
    .student-nav-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .student-nav-btn:hover { background: #334155; }
    .student-nav-group .cs-btn {
      background: transparent;
      border: none;
      height: 28px;
      padding: 0 6px;
      border-radius: 14px;
    }
    .student-nav-group .cs-btn:hover { background: #334155; }
    .student-nav-group .cs-label { max-width: 120px; }

    /* =========================================================
       🪟 DROPDOWN POPUP (ស្តាយថ្មី ពណ៌ស មូល ស្រស់ស្អាត)
    ========================================================= */
    .dropdown-popup {
      display: none;
      position: fixed;
      min-width: 190px;
      max-height: 300px;
      overflow-y: auto;
      background: #ffffff;
      border: none;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      padding: 6px;
      z-index: 99999;
      animation: popIn 0.15s ease-out;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    .dropdown-popup::-webkit-scrollbar { width: 5px; }
    .dropdown-popup::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dropdown-popup.show { display: block; }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      padding: 14px 18px;
      border-radius: 16px;
      color: #1e293b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      white-space: nowrap;
    }
    .dropdown-item:hover { background: #f1f5f9; }
    .dropdown-item.active { background: #d9f0fa; color: #0284c7; }
    .dropdown-item .fa-check { display: none; font-size: 14px; }
    .dropdown-item.active .fa-check { display: inline; }

    @media screen and (max-width: 768px) {
      .top-toolbar {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      .tb-row-1, .tb-row-2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }
      .btn-label { display: none !important; }
      .pill-btn {
        width: 36px; height: 36px; padding: 0;
        justify-content: center; border-radius: 50%;
      }
      .tb-group .fa-chevron-down { display: none; }
      .cs-btn { height: 34px; padding: 0 10px; font-size: 11.5px; }
      .cs-label { max-width: 95px; }
      .student-nav-group .cs-label { max-width: 95px; }
      .tb-row-1 .cselect { flex: 0 1 auto; }
      .tb-row-2 .cselect { flex: 1; }
      .tb-row-2 .pill-btn { flex: 1; border-radius: 18px; }
      .tb-row-2 .pill-btn.primary { flex: 1.2; }
      .dropdown-item { font-size: 14px; padding: 12px 16px; }
    }

    /* =========================================================
       📄 PAPER STAGE & SCALING SYSTEM
    ========================================================= */
    .paper-stage-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .paper-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    .report-sheet {
      background: #ffffff;
      width: 210mm;
      min-height: 295mm;
      padding: 12mm 15mm 12mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      position: relative;
      color: #000;
    }

    .sheet-national-header { text-align: center; margin-bottom: 4px; }
    .nat-title-1 { font-size: 14.5px; margin-bottom: 2px; }
    .nat-title-2 { font-size: 13px; margin-bottom: 2px; }
    .nat-symbol { font-size: 10.5px; letter-spacing: 2.5px; }

    .sheet-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .left-dept-info { text-align: left; font-size: 12px; line-height: 1.45; }
    .left-dept-info div:first-child { font-weight: 700; }
    .left-dept-info div:last-child { font-weight: 700; }

    .center-doc-title { text-align: center; flex: 1; margin-right: 70px; }
    .doc-main-title { font-size: 16.5px; color: #000; margin-bottom: 2px; }
    .doc-academic-year { font-size: 13px; font-weight: 600; }

    .student-meta-line {
      text-align: center;
      font-size: 12.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .student-meta-line span.hl-val { font-weight: 700; }
    .student-meta-line span.hl-rank { color: #dc2626; font-weight: 800; }

    /* ── Table Styling ── */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 11px;
      border: 1px solid #000;
      margin-bottom: 12px;
    }
    .report-table th, .report-table td {
      border: 1px solid #000;
      padding: 4px 3px;
      vertical-align: middle;
      height: var(--row-h, 25px);
      white-space: nowrap;
    }
    .report-table thead th {
      background: #e2e8f0;
      font-weight: 700;
      font-size: 11.5px;
      white-space: nowrap;
    }

    .report-table td.sub-name {
      text-align: center;
      font-weight: 700;
      white-space: nowrap !important;
      padding: 4px 6px;
    }
    .report-table td.bold-val { font-weight: 700; }

    .gr-A { color: #0284c7; font-weight: 800; }
    .gr-B { color: #b45309; font-weight: 800; }
    .gr-C { color: #16a34a; font-weight: 800; }
    .gr-D { color: #2563eb; font-weight: 800; }
    .gr-E { color: #7c3aed; font-weight: 800; }
    .gr-F { color: #dc2626; font-weight: 800; }

    .summary-cell-text { font-size: 11px; font-weight: 700; padding: 5px 3px; white-space: nowrap; }

    /* ── Signatures & Footer ── */
    .sheet-signatures-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: auto;
      padding: 8mm 4px 0;
      width: 100%;
      font-size: 11px;
    }
    .sig-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .sig-col.left-col { width: 28%; margin-top: 50px; }
    .sig-col.mid-col  { width: 30%; margin-top: 28px; }
    .sig-col.right-col { width: 42%; margin-top: 0; }

    .sig-title-moul { font-size: 11.5px; color: #000; margin-bottom: 3px; }
    .sig-role { font-weight: 700; font-size: 11.5px; margin-bottom: 45px; }
    .sig-name { font-weight: 700; font-size: 12.5px; }
    .sig-solar-date { font-size: 11px; font-weight: 700; margin-top: 3px; white-space: nowrap; }

    .clean-lunar-input {
      font-size: 11px;
      font-weight: bold;
      color: #000;
      border: 1px dashed transparent;
      background: transparent;
      text-align: center;
      width: 100%;
      outline: none;
      cursor: text;
      padding: 2px 4px;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      transition: all 0.2s;
    }
    .clean-lunar-input:hover, .clean-lunar-input:focus {
      border-color: #3b82f6;
      background: rgba(239, 246, 255, 0.7);
      border-radius: 4px;
    }

    .parent-dotted-lines {
      width: 100%;
      border-bottom: 1px dotted #000;
      height: 14px;
      margin-top: 10px;
    }

    /* 2 នាក់ • សន្លឹកផ្តេក A4 */
    .paper-stage.layout-2col .report-sheet-container-2col {
      position: relative;
      background: #ffffff;
      width: 297mm;
      height: 209mm;
      padding: 7mm 9mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 12mm;
      overflow: hidden;
    }
    .paper-stage.layout-2col .report-sheet-container-2col::before {
      content: '';
      position: absolute;
      top: 6mm; bottom: 6mm; left: 50%;
      border-left: 1px dashed #94a3b8;
    }
    .paper-stage.layout-2col .report-sheet {
      width: 100%;
      min-height: 0;
      height: 100%;
      box-shadow: none;
      padding: 0;
      font-size: 9px;
      overflow: hidden;
    }
    .paper-stage.layout-2col .nat-title-1 { font-size: 12px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-title-2 { font-size: 11px; margin-bottom: 1px; }
    .paper-stage.layout-2col .nat-symbol { font-size: 9px; letter-spacing: 1.5px; }
    .paper-stage.layout-2col .doc-main-title { font-size: 12.5px; margin-bottom: 1px; }
    .paper-stage.layout-2col .doc-academic-year { font-size: 10px; }
    .paper-stage.layout-2col .left-dept-info { font-size: 9.5px; line-height: 1.3; }
    .paper-stage.layout-2col .center-doc-title { margin-right: 40px; }
    .paper-stage.layout-2col .sheet-sub-header { margin-bottom: 5px; }
    .paper-stage.layout-2col .student-meta-line { font-size: 10px; margin-bottom: 4px; }

    .paper-stage.layout-2col .report-table { font-size: 9.5px; margin-bottom: 5px; }
    .paper-stage.layout-2col .report-table th,
    .paper-stage.layout-2col .report-table td {
      padding: 1px 2px;
      white-space: nowrap !important;
    }
    .paper-stage.layout-2col .report-table thead th {
      width: auto !important;
      font-size: 9.5px;
      white-space: normal !important;
      line-height: 1.25;
    }
    .paper-stage.layout-2col .summary-cell-text { font-size: 9.3px; padding: 2px; }
    .paper-stage.layout-2col .sheet-signatures-area { font-size: 9px; padding-top: 3mm; }
    .paper-stage.layout-2col .sig-col.left-col { width: 27%; margin-top: 30px; }
    .paper-stage.layout-2col .sig-col.mid-col  { width: 29%; margin-top: 14px; }
    .paper-stage.layout-2col .sig-col.right-col { width: 44%; margin-top: 0; }
    .paper-stage.layout-2col .sig-title-moul { font-size: 9px; }
    .paper-stage.layout-2col .sig-role { font-size: 9px; margin-bottom: 22px; }
    .paper-stage.layout-2col .sig-name { font-size: 9.5px; }
    .paper-stage.layout-2col .clean-lunar-input { font-size: 8.2px; padding: 1px; }
    .paper-stage.layout-2col .sig-solar-date { font-size: 8.5px; }
    .paper-stage.layout-2col .parent-dotted-lines { height: 9px; margin-top: 5px; }

    body.exporting .report-sheet,
    body.exporting .report-sheet-container-2col { box-shadow: none !important; }

    .empty-state-card {
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 440px;
      margin-top: 40px;
    }

    @page { size: A4 portrait; margin: 0; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        min-height: 0 !important;
        width: auto !important;
        overflow: visible !important;
      }
      .top-toolbar, #authDeniedWrap, .dropdown-popup { display: none !important; }
      .paper-stage-wrapper {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        min-height: 0 !important;
        width: auto !important;
        overflow: visible !important;
      }
      .paper-stage {
        display: block !important;
        transform: none !important;
        gap: 0 !important;
        width: auto !important;
      }
      .report-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .paper-stage.layout-2col .report-sheet-container-2col {
        box-shadow: none !important;
        margin: 0 !important;
        width: 297mm !important;
        height: 209mm !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .paper-stage.layout-2col .report-sheet { width: 100% !important; height: 100% !important; }
      .clean-lunar-input { border: none !important; background: transparent !important; }
    }
  </style>
</head>
<body>

  <!-- 🔒 AUTH DENIED -->
  <div id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2 class="f-moul">សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login ដើម្បីមើល និងបោះពុម្ពព្រឹត្តិបត្រពិន្ទុ។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       1. TOOLBAR ផ្នែកខាងលើ
  ========================================================= -->
  <div class="top-toolbar" id="mainToolbar" style="display:none;">

    <!-- ជួរទី១ -->
    <div class="tb-row-1">
      <!-- ប៊ូតុងត្រឡប់ -->
      <button type="button" class="pill-btn" onclick="goBackToScore()" title="ត្រឡប់ទៅស្រង់ពិន្ទុ">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="btn-label">ត្រឡប់</span>
      </button>

      <!-- 🌟 ជ្រើសរើសថ្នាក់ (បង្ហាញតែ Admin ប៉ុណ្ណោះ) -->
      <div id="csClass" style="display:none;"></div>

      <!-- រុករកសិស្ស -->
      <div class="student-nav-group">
        <button type="button" class="student-nav-btn" onclick="prevStudent()" title="សិស្សមុន">‹</button>
        <div id="csStudent"></div>
        <button type="button" class="student-nav-btn" onclick="nextStudent()" title="សិស្សបន្ទាប់">›</button>

    /* =========================================================
       🌟 CUSTOM SELECT COMPONENT
       ប៊ូតុងជ្រើសរើសទម្រង់ថ្មី (ប៉ុបអាប់ពណ៌ស មូល + ធីកពណ៌ខៀវ)
    ========================================================= */
    function createCSelect(containerId, cfg = {}) {
      const root = document.getElementById(containerId);
      const state = {
        options: [],
        value: '',
        disabled: false,
        placeholder: cfg.placeholder || '',
        onChange: cfg.onChange || function() {}
      };

      root.classList.add('cselect');
      if (cfg.className) root.classList.add(cfg.className);
      root.innerHTML = `
        <button type="button" class="cs-btn">
          <span class="cs-label"></span>
          <i class="fa-solid fa-chevron-down cs-chev"></i>
        </button>`;

      const btn = root.querySelector('.cs-btn');
      const label = root.querySelector('.cs-label');

      const pop = document.createElement('div');
      pop.className = 'dropdown-popup cs-popup';
      document.body.appendChild(pop);

      function renderLabel() {
        const cur = state.options.find(o => String(o.value) === String(state.value));
        label.textContent = cur ? (cur.btnLabel || cur.label) : state.placeholder;
      }

      function renderPopup() {
        pop.innerHTML = '';
        state.options.forEach(o => {
          const item = document.createElement('div');
          item.className = 'dropdown-item' + (String(o.value) === String(state.value) ? ' active' : '');
          item.innerHTML = `<span>${o.label}</span><i class="fa-solid fa-check"></i>`;
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const changed = String(state.value) !== String(o.value);
            state.value = o.value;
            renderLabel();
            closeAllDropdowns();
            if (changed) state.onChange(o.value);
          });
          pop.appendChild(item);
        });
      }

      function open() {
        if (state.disabled) return;
        closeAllDropdowns();
        renderPopup();

        const r = btn.getBoundingClientRect();
        pop.style.minWidth = Math.max(r.width, 150) + 'px';
        pop.style.top = (r.bottom + 6) + 'px';
        pop.style.maxHeight = Math.max(140, Math.min(300, window.innerHeight - r.bottom - 16)) + 'px';
        pop.classList.add('show');
        btn.classList.add('open');

        // កំណត់ទីតាំងផ្តេក មិនឱ្យលើសអេក្រង់
        const pw = pop.offsetWidth;
        let left = r.left;
        if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
        pop.style.left = Math.max(8, left) + 'px';

        // រមូរទៅរកធាតុដែលបានជ្រើស
        const act = pop.querySelector('.dropdown-item.active');
        if (act) pop.scrollTop = act.offsetTop - (pop.clientHeight / 2) + (act.clientHeight / 2);
      }

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (pop.classList.contains('show')) closeAllDropdowns();
        else open();
      });

      return {
        setOptions(list) { state.options = list || []; renderLabel(); },
        setValue(v) { state.value = v; renderLabel(); },
        getValue() { return state.value; },
        setDisabled(d) { state.disabled = !!d; btn.disabled = !!d; },
        setPlaceholder(t) { state.placeholder = t; renderLabel(); },
        show(display) { root.style.display = display || 'flex'; },
        hide() { root.style.display = 'none'; }
      };
    }

          if (left + 220 > window.innerWidth) left = window.innerWidth - 226;
          el.style.left = Math.max(8, left) + 'px';

    }

        CS.cls.setPlaceholder('កំហុសទាញយកថ្នាក់');
      }
    }

    function onClassChange(val) {
      currentClassName = val;
      loadRealDataForClass(val);
    }

    async function loadRealDataForClass(cls) {
      const pure = cleanGrade(cls) || getTeacherClass();
      if (!pure) return;

      currentClassName = pure;

      document.getElementById('paperWorkspace').innerHTML = `
        <div class="empty-state-card">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7; margin-bottom:12px;"></i>
          <div>កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${pure}...</div>
        </div>`;

      try {
        // ១. ទាញយកសិស្សពិត
        const { data: allSt, error: stErr } = await sb.from('students').select('*').order('id', { ascending: true });
        if (stErr) throw stErr;

        const stData = (allSt || []).filter(s => cleanGrade(s.grade) === pure);

        if (!stData || stData.length === 0) {
          studentsList = [];
          populateStudentSelect();
          document.getElementById('paperWorkspace').innerHTML = `
            <div class="empty-state-card">
              <i class="fa-solid fa-user-slash fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
              <div>មិនទាន់មានទិន្នន័យសិស្សក្នុងថ្នាក់ទី ${pure} នៅឡើយទេ</div>
            </div>`;
          return;
        }

        // ២. ទាញយកមុខវិជ្ជា
        const { data: dbSubData } = await sb
          .from('subjects')
          .select('*')
          .or(`assigned_class.eq.${pure},assigned_class.eq.all`)
          .eq('subject_type', reportMode)
          .order('sort_order', { ascending: true })
          .order('id', { ascending: true });

        // ៣. ទាញយកពិន្ទុ
        const classVariants = [pure, 'ថ្នាក់ទី' + pure, 'ថ្នាក់ទី ' + pure, 'ថ្នាក់' + pure, 'ថ្នាក់ ' + pure];
        const { data: scData } = await sb
          .from('scores')
          .select('*')
          .in('assigned_class', classVariants)
          .eq('score_type', reportMode);

        const scoreMap = {};
        const scoreMapS1 = {};
        const scoreMapS2 = {};

        (scData || []).forEach(row => {
          let scObj = row.scores || {};
          if (typeof scObj === 'string') {
            try { scObj = JSON.parse(scObj); } catch(e) { scObj = {}; }
          }
          const sid = String(row.student_id).trim();
          if (reportMode === 'monthly') {
            if (row.period === selectedMonth) {
              scoreMap[sid] = scObj;
            }
          } else {
            if (row.period === 'ឆមាសទី១') scoreMapS1[sid] = scObj;
            if (row.period === 'ឆមាសទី២') scoreMapS2[sid] = scObj;
          }
        });

        // ៤. ទាញយកអវត្តមាន
        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, status')
          .in('assigned_class', classVariants);

        const unexcusedMap = {};
        const excusedMap = {};
        const unexcusedCodes = ['A', 'អ', 'អត់ច្បាប់', 'អវត្តមាន', 'ABSENT', 'UNEXCUSED'];
        const excusedCodes = ['C', 'ច', 'ច្បាប់', 'មានច្បាប់', 'EXCUSED', 'PERMISSION'];

        (attData || []).forEach(a => {
          const sid = String(a.student_id).trim();
          const st = String(a.status || '').trim().toUpperCase();
          if (unexcusedCodes.includes(st)) unexcusedMap[sid] = (unexcusedMap[sid] || 0) + 1;
          if (excusedCodes.includes(st)) excusedMap[sid] = (excusedMap[sid] || 0) + 1;
        });

        // ៥. រៀបចំទិន្នន័យ
        studentsList = stData.map(st => {
          const sid1 = String(st.student_id || '').trim();
          const sid2 = String(st.id || '').trim();

          const sc = scoreMap[sid1] || scoreMap[sid2] || {};
          const sc1 = scoreMapS1[sid1] || scoreMapS1[sid2] || {};
          const sc2 = scoreMapS2[sid1] || scoreMapS2[sid2] || {};

          let totalScore = 0;
          let activeSubjectCount = 0;

          if (reportMode === 'monthly') {
            let rawGroups = [];
            if (dbSubData && dbSubData.length > 0) {
              const parents = dbSubData.filter(s => !s.parent_id);
              parents.forEach(p => {
                const children = dbSubData.filter(c => String(c.parent_id) === String(p.id));
                rawGroups.push({
                  parentName: p.name,
                  isGroup: children.length > 0,
                  children: children.map(c => ({ name: c.name, code: c.code || `sub_${c.id}`, id: c.id, max: Number(c.max_score)||10 })),
                  code: p.code || `sub_${p.id}`,
                  id: p.id,
                  max: Number(p.max_score) || 10
                });
              });
            } else {
              rawGroups = JSON.parse(JSON.stringify(DEFAULT_MONTHLY_TEMPLATE));
            }

            const activeGroups = [];

            rawGroups.forEach(g => {
              if (g.isGroup) {
                const activeChildren = [];
                (g.children || []).forEach(c => {
                  const scoreVal = getSubjectScore(sc, c);
                  if (scoreVal !== null) {
                    activeChildren.push({
                      name: c.name,
                      max: c.max || 10,
                      score: scoreVal,
                      grade: calculateGrade(scoreVal)
                    });
                    totalScore += scoreVal;
                    activeSubjectCount++;
                  }
                });

                if (activeChildren.length > 0) {
                  activeGroups.push({
                    parentName: g.parentName,
                    isGroup: true,
                    children: activeChildren
                  });
                }
              } else {
                const scoreVal = getSubjectScore(sc, g);
                if (scoreVal !== null) {
                  activeGroups.push({
                    parentName: g.parentName,
                    isGroup: false,
                    max: g.max || 10,
                    score: scoreVal,
                    grade: calculateGrade(scoreVal)
                  });
                  totalScore += scoreVal;
                  activeSubjectCount++;
                }
              }
            });

            const avgScore = activeSubjectCount > 0 ? (totalScore / activeSubjectCount) : 0;

            return {
              id: st.student_id || st.id,
              name: st.student_name || 'គ្មានឈ្មោះ',
              gender: st.gender || 'ប្រុស',
              grade: pure,
              totalScore: totalScore,
              avgScore: avgScore,
              gradeLabel: avgScore > 0 ? calculateGrade(avgScore) : '-',
              absentUnexcused: unexcusedMap[sid1] || unexcusedMap[sid2] || 0,
              absentExcused: excusedMap[sid1] || excusedMap[sid2] || 0,
              monthlyGroups: activeGroups
            };

          } else {
            let semList = (dbSubData && dbSubData.length > 0)
              ? dbSubData.map(s => ({ name: s.name, code: s.code || `sub_${s.id}`, id: s.id, max: Number(s.max_score)||10 }))
              : JSON.parse(JSON.stringify(DEFAULT_SEMESTER_TEMPLATE));

            let sem1Total = 0, sem1Count = 0;
            let sem2Total = 0, sem2Count = 0;
            const activeSemSubjects = [];

            semList.forEach(sub => {
              const v1 = getSubjectScore(sc1, sub);
              const v2 = getSubjectScore(sc2, sub);
              const has1 = v1 !== null;
              const has2 = v2 !== null;

              if (!has1 && !has2) return;

              if (has1) { sem1Total += v1; sem1Count++; }
              if (has2) { sem2Total += v2; sem2Count++; }

              let subAvg = '-';
              if (has1 && has2) subAvg = ((v1 + v2) / 2);
              else if (has1) subAvg = v1;
              else if (has2) subAvg = v2;

              activeSemSubjects.push({
                name: sub.name,
                max: sub.max || 10,
                s1: has1 ? v1 : '-',
                s2: has2 ? v2 : '-',
                avg: (subAvg !== '-') ? subAvg.toFixed(2).replace(/\.00$/, '') : '-',
                grade: (subAvg !== '-') ? calculateGrade(subAvg) : '-'
              });
            });

            const avg1 = sem1Count > 0 ? (sem1Total / sem1Count) : 0;
            const avg2 = sem2Count > 0 ? (sem2Total / sem2Count) : 0;
            let yearAvg = 0;
            if (sem1Count > 0 && sem2Count > 0) yearAvg = (avg1 + avg2) / 2;
            else if (sem1Count > 0) yearAvg = avg1;
            else if (sem2Count > 0) yearAvg = avg2;

            return {
              id: st.student_id || st.id,
              name: st.student_name || 'គ្មានឈ្មោះ',
              gender: st.gender || 'ប្រុស',
              grade: pure,
              avgSem1: avg1,
              avgSem2: avg2,
              avgYear: yearAvg,
              yearGrade: yearAvg > 0 ? calculateGrade(yearAvg) : '-',
              absentUnexcused: unexcusedMap[sid1] || unexcusedMap[sid2] || 0,
              absentExcused: excusedMap[sid1] || excusedMap[sid2] || 0,
              semSubjects: activeSemSubjects
            };
          }
        });

        // ៦. គណនាចំណាត់ថ្នាក់
        const scoreKey = (reportMode === 'monthly') ? 'avgScore' : 'avgYear';
        const sorted = [...studentsList].sort((a, b) => b[scoreKey] - a[scoreKey]);
        const rankMap = {};
        let lastScore = null, lastRank = 0;
        sorted.forEach((item, index) => {
          if (item[scoreKey] === lastScore) {
            rankMap[item.id] = lastRank;
          } else {
            rankMap[item.id] = index + 1;
            lastRank = index + 1;
            lastScore = item[scoreKey];
          }
        });

        studentsList.forEach(s => {
          s.rank = rankMap[s.id] || 1;
        });

        currentStudentIndex = 0;
        populateStudentSelect();
        renderReportWorkspace();

      } catch (err) {
        console.error(err);
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុសផ្ទុកទិន្នន័យ៖ ${err.message}</div>`;
      }
    }

    function populateStudentSelect() {
      if (!studentsList.length) {
        CS.student.setOptions([]);
        CS.student.setValue('');
        CS.student.setPlaceholder('គ្មានសិស្ស');
        return;
      }
      CS.student.setOptions(studentsList.map((s, idx) => ({
        value: String(idx),
        label: `${idx + 1}. ${s.name}`
      })));
      CS.student.setValue(String(currentStudentIndex));
    }

    function onStudentSelect(idx) {
      currentStudentIndex = parseInt(idx, 10);
      renderReportWorkspace();
    }

    function prevStudent() {
      const step = (layoutMode === '2_landscape') ? 2 : 1;
      if (currentStudentIndex > 0) {
        currentStudentIndex = Math.max(0, currentStudentIndex - step);
        CS.student.setValue(String(currentStudentIndex));
        renderReportWorkspace();
      }
    }

    function nextStudent() {
      const step = (layoutMode === '2_landscape') ? 2 : 1;
      if (currentStudentIndex < studentsList.length - 1) {
        currentStudentIndex = Math.min(studentsList.length - 1, currentStudentIndex + step);
        CS.student.setValue(String(currentStudentIndex));
        renderReportWorkspace();
      }
    }

       5. HTML GENERATOR

              <div contenteditable="true" class="clean-lunar-input" onblur="teacherLunarDate=this.innerText.trim()" title="ចុចត្រង់នេះដើម្បីកែប្រែថ្ងៃខែចន្ទគតិ">${teacherLunarDate}</div>
              <div class="sig-solar-date">${solarDateStr}</div>
              <div class="sig-role f-moul" style="margin-top:2px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
              <div class="sig-name">${teacherName}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       6. RENDER WORKSPACE & MOBILE RESPONSIVE SCALING
    ========================================================= */
    function applyPageStyle() {
      let el = document.getElementById('dynPageStyle');
      if (!el) {
        el = document.createElement('style');
        el.id = 'dynPageStyle';
        document.head.appendChild(el);
      }
      const orient = (layoutMode === '2_landscape') ? 'landscape' : 'portrait';
      el.textContent = '@page { size: A4 ' + orient + '; margin: 0; }';
    }

    /* កំណត់កម្ពស់ជួរតារាងស្វ័យប្រវត្តិ ឱ្យពេញក្រដាស A4 ស្អាត */
    function calcRowH(st) {
      let n;
      if (reportMode === 'monthly') {
        n = (st.monthlyGroups || []).reduce((sum, g) => sum + (g.isGroup ? g.children.length : 1), 0);
      } else {
        n = (st.semSubjects || []).length;
      }
      n = Math.max(n, 4) + 3; // + ក្បាលតារាង + ២ ជួរសរុប
      const two = (layoutMode === '2_landscape');
      const avail = two ? 116 : 168;
      const min = two ? 4.8 : 5.6;
      const max = two ? 9 : 14;
      return Math.max(min, Math.min(max, avail / n)).toFixed(2);
    }

    function renderReportWorkspace() {
      applyPageStyle();
      const container = document.getElementById('paperWorkspace');

      if (!studentsList.length) {
        container.className = 'paper-stage';
        container.innerHTML = `
          <div class="empty-state-card">
            <i class="fa-solid fa-folder-open fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
            <div>មិនមានទិន្នន័យសិស្សត្រូវបង្ហាញឡើយ</div>
          </div>`;
        return;
      }

      if (layoutMode === '1_portrait') {
        container.className = 'paper-stage';
        const currentStudent = studentsList[currentStudentIndex] || studentsList[0];
        container.innerHTML = generateReportHTML(currentStudent);
      } else {
        container.className = 'paper-stage layout-2col';
        const st1 = studentsList[currentStudentIndex] || studentsList[0];
        const st2 = studentsList[currentStudentIndex + 1] || null;

        container.innerHTML = `
          <div class="report-sheet-container-2col">
            ${generateReportHTML(st1)}
            ${st2 ? generateReportHTML(st2) : '<div></div>'}
          </div>
        `;
      }

      applyAutoMobileScale();
    }

    function applyAutoMobileScale() {
      const stage = document.getElementById('paperWorkspace');
      const wrapper = document.getElementById('paperStageWrapper');
      if (!stage || !wrapper) return;

      const screenWidth = window.innerWidth;

      if (screenWidth <= 850 && isFitScreen) {
        const paperWidth = (layoutMode === '1_portrait') ? 794 : 1122;
        const availableWidth = screenWidth - 16;
        const scaleRatio = Math.min(1, availableWidth / paperWidth);

        stage.style.transform = `scale(${scaleRatio})`;
        stage.style.transformOrigin = 'top center';

        const scaledHeight = (stage.scrollHeight || 1122) * scaleRatio;
        wrapper.style.minHeight = (scaledHeight + 30) + 'px';
      } else {
        stage.style.transform = 'none';
        wrapper.style.minHeight = 'auto';
      }
    }

    function toggleMobileFitScreen() {
      isFitScreen = !isFitScreen;
      document.getElementById('txtFitScreen').innerText = isFitScreen ? 'សមអេក្រង់' : 'ទំហំដើម';
      const icon = document.querySelector('#btnFitScreen i');
      if (icon) icon.className = isFitScreen ? 'fa-solid fa-expand' : 'fa-solid fa-compress';
      applyAutoMobileScale();
    }

    window.addEventListener('resize', applyAutoMobileScale);

    function printReport() {
      const stage = document.getElementById('paperWorkspace');
      if (stage) stage.style.transform = 'none';
      applyPageStyle();
      window.print();
      applyAutoMobileScale();
    }

    function downloadPDF() {
      if (!studentsList.length) return alert('គ្មានទិន្នន័យដើម្បីទាញយកជា PDF ឡើយ!');
      const stage = document.getElementById('paperWorkspace');
      stage.style.transform = 'none';

      const isPortrait = (layoutMode === '1_portrait');
      const st = studentsList[currentStudentIndex] || studentsList[0];

      const opt = {
        margin: [0, 0, 0, 0],
        filename: `ព្រឹត្តិបត្រពិន្ទុ_${st.name}_ថ្នាក់ទី${st.grade}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isPortrait ? 'portrait' : 'landscape' }
      };

      document.body.classList.add('exporting');
      html2pdf().set(opt).from(stage).save().then(() => {
        document.body.classList.remove('exporting');
        applyAutoMobileScale();
      }).catch(() => {
        document.body.classList.remove('exporting');
        applyAutoMobileScale();
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuthentication()) return;
      initCustomSelects();
      await initClassDropdown();
    });
  </script>
</body>
