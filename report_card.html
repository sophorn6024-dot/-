<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព្រឹត្តិបត្រពិន្ទុ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 📊 PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    body {
      background: #334155;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    .f-moul {
      font-family: 'Khmer OS Muol Light', 'Moul', cursive !important;
      font-weight: normal;
    }

    /* =========================================================
       🎛️ TOP TOOLBAR (របារឧបករណ៍ផ្នែកខាងលើ)
    ========================================================= */
    .top-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #1e293b;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid #334155;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .pill-btn, .pill-select {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 38px;
      padding: 0 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
      white-space: nowrap;
    }

    .pill-btn:hover, .pill-select:hover {
      background: #475569;
      border-color: #64748b;
    }

    .pill-btn.primary {
      background: #00875a;
      color: #ffffff;
      border-color: #00875a;
    }
    .pill-btn.primary:hover {
      background: #00734c;
    }

    /* Dropdown Menu Popup */
    .dropdown-popup {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 180px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      padding: 6px;
      z-index: 2000;
    }
    .dropdown-popup.show { display: block; }

    .dropdown-item {
      padding: 9px 14px;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: #334155; }
    .dropdown-item.active { background: #0284c7; color: #fff; }

    /* Student Navigator */
    .student-nav-group {
      display: inline-flex;
      align-items: center;
      background: #334155;
      border-radius: 20px;
      border: 1px solid #475569;
      height: 38px;
      padding: 0 4px;
    }
    .student-nav-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .student-nav-btn:hover { background: #475569; }
    .student-select-clean {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      padding: 0 8px;
      max-width: 150px;
    }
    .student-select-clean option { background: #1e293b; color: #fff; }

    /* =========================================================
       📄 PAPER WORKSPACE (សន្លឹកក្រដាស A4)
    ========================================================= */
    .paper-stage {
      padding: 25px 15px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ទម្រង់បញ្ឈរ (Portrait - 1 នាក់ក្នុង ១ សន្លឹក) */
    .report-sheet {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 16mm 15mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: #000;
      page-break-after: always;
    }

    /* ទម្រង់ផ្តេក (Landscape - 2 នាក់ក្នុង ១ សន្លឹក A4) */
    .paper-stage.layout-2col .report-sheet-container-2col {
      background: #ffffff;
      width: 297mm;
      min-height: 210mm;
      padding: 8mm 10mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12mm;
      position: relative;
      page-break-after: always;
    }

    .paper-stage.layout-2col .report-sheet {
      width: 100%;
      min-height: auto;
      box-shadow: none;
      padding: 0;
    }

    /* ── Headers ── */
    .sheet-national-header {
      text-align: center;
      margin-bottom: 6px;
    }
    .nat-title-1 { font-size: 15px; margin-bottom: 3px; }
    .nat-title-2 { font-size: 13px; margin-bottom: 2px; }
    .nat-symbol { font-size: 11px; letter-spacing: 3px; }

    .sheet-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .left-dept-info {
      text-align: left;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .left-dept-info div:first-child { font-weight: 700; }
    .left-dept-info div:last-child { font-weight: 700; }

    .center-doc-title {
      text-align: center;
      flex: 1;
      margin-right: 80px;
    }
    .doc-main-title {
      font-size: 17px;
      color: #000;
      margin-bottom: 2px;
    }
    .doc-academic-year {
      font-size: 13.5px;
      font-weight: 600;
    }

    .student-meta-line {
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .student-meta-line span.hl-val {
      font-weight: 700;
    }
    .student-meta-line span.hl-rank {
      color: #dc2626;
      font-weight: 800;
    }

    /* ── Table Styling ── */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
      border: 1px solid #000;
    }
    .report-table th, .report-table td {
      border: 1px solid #000;
      padding: 5px 3px;
      vertical-align: middle;
      height: 27px;
    }
    .report-table thead th {
      background: #e2e8f0;
      font-weight: 700;
      font-size: 12px;
    }
    .report-table td.sub-name {
      text-align: center;
      font-weight: 700;
      padding-left: 6px;
    }
    .report-table td.bold-val {
      font-weight: 700;
    }

    /* ពណ៌និទ្ទេសតាមស្តង់ដារ */
    .gr-A { color: #0284c7; font-weight: 800; }
    .gr-B { color: #b45309; font-weight: 800; }
    .gr-C { color: #16a34a; font-weight: 800; }
    .gr-D { color: #2563eb; font-weight: 800; }
    .gr-E { color: #7c3aed; font-weight: 800; }
    .gr-F { color: #dc2626; font-weight: 800; }

    .summary-cell-text {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 4px;
    }

    /* ── Signatures & Footer ── */
    .sheet-signatures-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 14px;
      padding: 0 4px;
      font-size: 11.5px;
    }

    .sig-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 180px;
    }
    .sig-col.left-col { min-width: 190px; }
    .sig-col.mid-col { min-width: 170px; margin-top: 36px; }
    .sig-col.right-col { min-width: 190px; }

    .sig-title-moul {
      font-size: 12px;
      color: #000;
      margin-bottom: 2px;
    }
    .sig-role {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 45px;
    }
    .sig-name {
      font-weight: 700;
      font-size: 13px;
    }

    .sig-lunar-date, .sig-solar-date {
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .sig-solar-date { margin-bottom: 4px; }

    .parent-dotted-lines {
      width: 100%;
      border-bottom: 1px dotted #000;
      height: 16px;
      margin-top: 10px;
    }

    /* =========================================================
       🖨️ PRINT & PDF SETUP
    ========================================================= */
    @page {
      size: A4 portrait;
      margin: 8mm;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
      }
      .top-toolbar { display: none !important; }
      .paper-stage { padding: 0 !important; gap: 0 !important; }
      .report-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 280mm !important;
      }
      .paper-stage.layout-2col .report-sheet-container-2col {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: 195mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       1. TOOLBAR ផ្នែកខាងលើ (ដូចរូបភាព ១០០%)
  ========================================================= -->
  <div class="top-toolbar">
    
    <!-- Dropdown: ចំនួនសន្លឹក និងទិសដៅ -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('layoutDropdown')">
        <span id="currentLayoutText">1 នាក់ • សន្លឹកបញ្ឈរ</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
      </button>

      <div class="dropdown-popup" id="layoutDropdown">
        <div class="dropdown-item active" onclick="setLayoutMode('1_portrait', '1 នាក់ • សន្លឹកបញ្ឈរ', this)">
          <span>1 នាក់ • សន្លឹកបញ្ឈរ</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setLayoutMode('2_landscape', '2 នាក់ • សន្លឹកផ្តេក A4', this)">
          <span>2 នាក់ • សន្លឹកផ្តេក A4</span>
        </div>
      </div>
    </div>

    <!-- Dropdown: ប្រភេទនិទ្ទេស -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('gradeDropdown')">
        <span id="currentGradeText">និទ្ទេស A–F</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
      </button>

      <div class="dropdown-popup" id="gradeDropdown">
        <div class="dropdown-item active" onclick="setGradeFormat('AF', 'និទ្ទេស A–F', this)">
          <span>និទ្ទេស A–F</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setGradeFormat('KH', 'និទ្ទេស ខ្មែរ', this)">
          <span>និទ្ទេស ខ្មែរ (ល្អប្រសើរ...)</span>
        </div>
      </div>
    </div>

    <!-- ប៊ូតុងកំណត់កាលបរិច្ឆេទហត្ថលេខា -->
    <button type="button" class="pill-btn" onclick="editTeacherDate()">
      <i class="fa-regular fa-calendar-days"></i>
      <span>កាលបរិច្ឆេទហត្ថលេខា</span>
    </button>

    <!-- ប៊ូតុងកំណត់ថ្ងៃនាយកចុះហត្ថលេខា -->
    <button type="button" class="pill-btn" onclick="editDirectorDate()">
      <i class="fa-regular fa-calendar-days"></i>
      <span>ថ្ងៃនាយកចុះហត្ថលេខា</span>
    </button>

    <!-- ប៊ូតុងជ្រើសរើសសិស្សដើម្បីមើល -->
    <div class="student-nav-group">
      <button type="button" class="student-nav-btn" onclick="prevStudent()" title="សិស្សមុន">‹</button>
      <select class="student-select-clean" id="studentSelectBox" onchange="onStudentSelect(this.value)">
        <!-- ជម្រើសសិស្សនឹងត្រូវបញ្ចូលដោយ JavaScript -->
      </select>
      <button type="button" class="student-nav-btn" onclick="nextStudent()" title="សិស្សបន្ទាប់">›</button>
    </div>

    <!-- ប៊ូតុងទាញយក PDF -->
    <button type="button" class="pill-btn" onclick="downloadPDF()">
      <i class="fa-solid fa-download"></i>
      <span>ទាញយក PDF</span>
    </button>

    <!-- ប៊ូតុងបោះពុម្ព (ពណ៌បៃតង) -->
    <button type="button" class="pill-btn primary" onclick="window.print()">
      <i class="fa-solid fa-print"></i>
      <span>បោះពុម្ព</span>
    </button>

  </div>

  <!-- =========================================================
       2. សន្លឹកព្រឹត្តិបត្រពិន្ទុ (PAPER WORKSPACE)
  ========================================================= -->
  <div class="paper-stage" id="paperWorkspace">
    <!-- Rendered dynamically via JavaScript -->
  </div>

  <!-- =========================================================
       3. JAVASCRIPT LOGIC & SUPABASE INTEGRATION
  ========================================================= */ -->
  <script>
    /* ── Supabase Setup ── */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── App State ── */
    let layoutMode = '1_portrait'; // '1_portrait' | '2_landscape'
    let gradeMode = 'AF';         // 'AF' | 'KH'

    // កាលបរិច្ឆេទលំនាំដើមដូចក្នុងរូបភាព
    let teacherLunarDate = "ថ្ងៃពុធ ៣កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let teacherSolarDate = "កំពង់ល្ពៅ ថ្ងៃទី១៤ ខែតុលា ឆ្នាំ២០២៦";
    let directorLunarDate = "ថ្ងៃពុធ ៣កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let directorSolarDate = "កំពង់ល្ពៅ ថ្ងៃទី១៤ ខែតុលា ឆ្នាំ២០២៦";
    let teacherName = "សេង សុភាន់";

    /* ── ទិន្នន័យគំរូដូចក្នុងរូបភាព ១០០% (Fallback & Demo) ── */
    let studentsList = [
      {
        id: "577",
        name: "កែវ លីណា",
        gender: "ប្រុស",
        grade: "៤ក",
        rank: 1,
        avgSem1: 5.82,
        avgSem2: 3.00,
        avgYear: 4.41,
        yearRank: 1,
        yearGrade: "F",
        absentUnexcused: 0,
        absentExcused: 0,
        scores: [
          { no: 1, name: "អំណាន", max: 10, s1: 4, s2: null, avg: 4, grade: "F" },
          { no: 2, name: "ស្ដាប់ និងនិយាយ", max: 10, s1: 5, s2: null, avg: 5, grade: "E" },
          { no: 3, name: "សរសេរតាមអាន", max: 10, s1: 6, s2: null, avg: 6, grade: "D" },
          { no: 4, name: "តែងសេចក្ដី", max: 10, s1: 7, s2: null, avg: 7, grade: "C" },
          { no: 5, name: "គណិតវិទ្យា", max: 10, s1: 7, s2: null, avg: 7, grade: "C" },
          { no: 6, name: "វិទ្យាសាស្ត្រ", max: 10, s1: 7, s2: null, avg: 7, grade: "C" },
          { no: 7, name: "សិក្សាសង្គម", max: 10, s1: 8, s2: null, avg: 8, grade: "B" },
          { no: 8, name: "គេហវិទ្យា-អប់រំសិល្បៈ", max: 10, s1: 9, s2: null, avg: 9, grade: "A" },
          { no: 9, name: "អប់រំកាយ-សុខភាព", max: 10, s1: 7, s2: null, avg: 7, grade: "C" },
          { no: 10, name: "អប់រំបំណិនជីវិត", max: 10, s1: 7, s2: null, avg: 7, grade: "C" },
          { no: 11, name: "ភាសាបរទេស", max: 10, s1: 6, s2: null, avg: 6, grade: "D" }
        ]
      }
    ];

    let currentStudentIndex = 0;

    /* ── វចនានុក្រមបំប្លែងនិទ្ទេស ── */
    const GRADE_KH_MAP = {
      'A': 'ល្អប្រសើរ',
      'B': 'ល្អណាស់',
      'C': 'ល្អ',
      'D': 'បង្គួរ',
      'E': 'មធ្យម',
      'F': 'ខ្សោយ'
    };

    function formatGrade(code) {
      if (!code || code === '-') return '-';
      return (gradeMode === 'KH') ? (GRADE_KH_MAP[code] || code) : code;
    }

    /* ── Dropdown Controller ── */
    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isShown = el.classList.contains('show');
      closeAllDropdowns();
      if (!isShown) el.classList.add('show');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-popup').forEach(d => d.classList.remove('show'));
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tb-group')) closeAllDropdowns();
    });

    function setLayoutMode(mode, label, el) {
      layoutMode = mode;
      document.getElementById('currentLayoutText').innerText = label;
      
      document.querySelectorAll('#layoutDropdown .dropdown-item').forEach(i => {
        i.classList.remove('active');
        const chk = i.querySelector('.fa-check');
        if (chk) chk.remove();
      });
      el.classList.add('active');
      el.innerHTML = `<span>${label}</span> <i class="fa-solid fa-check"></i>`;
      
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function setGradeFormat(fmt, label, el) {
      gradeMode = fmt;
      document.getElementById('currentGradeText').innerText = label;

      document.querySelectorAll('#gradeDropdown .dropdown-item').forEach(i => {
        i.classList.remove('active');
        const chk = i.querySelector('.fa-check');
        if (chk) chk.remove();
      });
      el.classList.add('active');
      el.innerHTML = `<span>${label}</span> <i class="fa-solid fa-check"></i>`;

      closeAllDropdowns();
      renderReportWorkspace();
    }

    /* ── Modal / Prompt កាលបរិច្ឆេទ ── */
    function editTeacherDate() {
      const l = prompt("កាលបរិច្ឆេទចន្ទគតិ (គ្រូទទួលបន្ទុកថ្នាក់)៖", teacherLunarDate);
      if (l !== null) teacherLunarDate = l;
      const s = prompt("កាលបរិច្ឆេទសុរិយគតិ (គ្រូទទួលបន្ទុកថ្នាក់)៖", teacherSolarDate);
      if (s !== null) teacherSolarDate = s;
      const t = prompt("ឈ្មោះគ្រូទទួលបន្ទុកថ្នាក់៖", teacherName);
      if (t !== null) teacherName = t;
      renderReportWorkspace();
    }

    function editDirectorDate() {
      const l = prompt("កាលបរិច្ឆេទចន្ទគតិ (នាយកសាលា)៖", directorLunarDate);
      if (l !== null) directorLunarDate = l;
      const s = prompt("កាលបរិច្ឆេទសុរិយគតិ (នាយកសាលា)៖", directorSolarDate);
      if (s !== null) directorSolarDate = s;
      renderReportWorkspace();
    }

    /* ── Student Navigator ── */
    function populateStudentSelect() {
      const sel = document.getElementById('studentSelectBox');
      sel.innerHTML = studentsList.map((s, idx) => 
        `<option value="${idx}">${idx + 1}. ${s.name}</option>`
      ).join('');
      sel.value = String(currentStudentIndex);
    }

    function onStudentSelect(idx) {
      currentStudentIndex = parseInt(idx, 10);
      renderReportWorkspace();
    }

    function prevStudent() {
      if (currentStudentIndex > 0) {
        currentStudentIndex--;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    function nextStudent() {
      if (currentStudentIndex < studentsList.length - 1) {
        currentStudentIndex++;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    /* =========================================================
       4. HTML TEMPLATE FOR SINGLE REPORT CARD
    ========================================================= */
    function generateReportHTML(st) {
      if (!st) return '';

      let rowsHtml = '';
      st.scores.forEach(row => {
        const s2Val = row.s2 !== null ? row.s2 : '-';
        const grClass = `gr-${row.grade}`;
        rowsHtml += `
          <tr>
            <td>${row.no}</td>
            <td class="sub-name">${row.name}</td>
            <td>${row.max}</td>
            <td>${row.s1}</td>
            <td>${s2Val}</td>
            <td class="bold-val">${row.avg}</td>
            <td class="${grClass}">${formatGrade(row.grade)}</td>
          </tr>
        `;
      });

      const totalAbsent = (st.absentUnexcused || 0) + (st.absentExcused || 0);
      const yearGradeClass = `gr-${st.yearGrade}`;

      return `
        <div class="report-sheet">
          <div>
            <!-- ក្បាលទំព័រជាតិ -->
            <div class="sheet-national-header">
              <div class="nat-title-1 f-moul">ព្រះរាជាណាចក្រកម្ពុជា</div>
              <div class="nat-title-2 f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
              <div class="nat-symbol">─────── ❖ ───────</div>
            </div>

            <!-- ឈ្មោះសាលា និង ចំណងជើង -->
            <div class="sheet-sub-header">
              <div class="left-dept-info">
                <div>ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
                <div style="font-weight:700;">សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
                <div>ថ្នាក់ទី${st.grade}</div>
              </div>

              <div class="center-doc-title">
                <div class="doc-main-title f-moul">ព្រឹត្តិបត្រពិន្ទុ 2026-2027</div>
                <div class="doc-academic-year">ឆ្នាំសិក្សា 2026-2027</div>
              </div>
            </div>

            <!-- ព័ត៌មានសិស្ស -->
            <div class="student-meta-line">
              សិស្សឈ្មោះ: <span class="hl-val">${st.name}</span> • 
              ភេទ <span class="hl-val">${st.gender}</span> • 
              អត្តលេខ <span class="hl-val">${st.id}</span> • 
              ចំណាត់ថ្នាក់ទី <span class="hl-rank">${st.rank}</span>
            </div>

            <!-- តារាងពិន្ទុមុខវិជ្ជា -->
            <table class="report-table">
              <thead>
                <tr>
                  <th style="width: 44px;">ល.រ</th>
                  <th>មុខវិជ្ជា</th>
                  <th style="width: 90px;">ពិន្ទុអតិបរមា</th>
                  <th style="width: 105px;">ប្រឡងឆមាសទី១</th>
                  <th style="width: 105px;">ប្រឡងឆមាសទី២</th>
                  <th style="width: 85px;">មធ្យមភាគ</th>
                  <th style="width: 65px;">និទ្ទេស</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
                <!-- ជួរទី១ សង្ខេបលទ្ធផល -->
                <tr style="background:#f8fafc;">
                  <td colspan="4" class="summary-cell-text" style="text-align:left; padding-left:14px;">
                    មធ្យមភាគឆមាសទី១ ${st.avgSem1.toFixed(2)} • ឆមាសទី២ ${st.avgSem2.toFixed(2)} • ប្រចាំឆ្នាំ ${st.avgYear.toFixed(2)}
                  </td>
                  <td colspan="2" class="summary-cell-text" style="color:#000;">
                    ចំណាត់ថ្នាក់ទី <span style="color:#dc2626; font-weight:800;">${st.yearRank}</span>
                  </td>
                  <td class="summary-cell-text ${yearGradeClass}">
                    និទ្ទេស ${formatGrade(st.yearGrade)}
                  </td>
                </tr>
                <!-- ជួរទី២ សង្ខេបអវត្តមាន -->
                <tr style="background:#f8fafc;">
                  <td colspan="3" class="summary-cell-text">
                    អវត្តមាន (ឥតច្បាប់) ៖ ${st.absentUnexcused}
                  </td>
                  <td colspan="3" class="summary-cell-text">
                    អវត្តមាន (មានច្បាប់) ៖ ${st.absentExcused}
                  </td>
                  <td class="summary-cell-text">
                    សរុប ៖ ${totalAbsent}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- កន្លែងហត្ថលេខាទាំង ៣ ជួរ -->
          <div class="sheet-signatures-area">
            <!-- ឆ្វេង៖ នាយកសាលា -->
            <div class="sig-col left-col">
              <div class="sig-title-moul f-moul">បានឃើញ និងឯកភាព</div>
              <div class="sig-lunar-date">${directorLunarDate}</div>
              <div class="sig-solar-date">${directorSolarDate}</div>
              <div class="sig-role f-moul">នាយកសាលា</div>
            </div>

            <!-- កណ្ដាល៖ មតិអាណាព្យាបាល -->
            <div class="sig-col mid-col">
              <div class="sig-title-moul f-moul" style="font-size:12px;">មតិរបស់មាតាបិតា</div>
              <div class="f-moul" style="font-size:12px; margin-bottom:8px;">ឬអាណាព្យាបាលសិស្ស</div>
              <div class="parent-dotted-lines"></div>
              <div class="parent-dotted-lines"></div>
            </div>

            <!-- ស្ដាំ៖ គ្រូទទួលបន្ទុកថ្នាក់ -->
            <div class="sig-col right-col">
              <div class="sig-lunar-date">${teacherLunarDate}</div>
              <div class="sig-solar-date">${teacherSolarDate}</div>
              <div class="sig-role f-moul">គ្រូទទួលបន្ទុកថ្នាក់</div>
              <div class="sig-name">${teacherName}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       5. RENDER WORKSPACE
    ========================================================= */
    function renderReportWorkspace() {
      const container = document.getElementById('paperWorkspace');

      if (layoutMode === '1_portrait') {
        container.className = 'paper-stage';
        const currentStudent = studentsList[currentStudentIndex] || studentsList[0];
        container.innerHTML = generateReportHTML(currentStudent);
      } else {
        // ទម្រង់ 2 នាក់ក្នុង ១ សន្លឹកផ្តេក A4
        container.className = 'paper-stage layout-2col';
        const st1 = studentsList[currentStudentIndex] || studentsList[0];
        const st2 = studentsList[currentStudentIndex + 1] || st1;

        container.innerHTML = `
          <div class="report-sheet-container-2col">
            ${generateReportHTML(st1)}
            ${generateReportHTML(st2)}
          </div>
        `;
      }
    }

    /* ── ទាញយក PDF តាមរយៈ html2pdf ── */
    function downloadPDF() {
      const element = document.getElementById('paperWorkspace');
      const isPortrait = (layoutMode === '1_portrait');
      const st = studentsList[currentStudentIndex] || studentsList[0];

      const opt = {
        margin: [4, 4, 4, 4],
        filename: `ព្រឹត្តិបត្រពិន្ទុ_${st.name}_ថ្នាក់ទី${st.grade}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isPortrait ? 'portrait' : 'landscape' }
      };

      html2pdf().set(opt).from(element).save();
    }

    /* ── ផ្ទុកទិន្នន័យដំបូង ── */
    window.addEventListener('DOMContentLoaded', async () => {
      // ពិនិត្យមើលឈ្មោះគ្រូពី Session បើមាន
      try {
        const u = JSON.parse(localStorage.getItem('krou_supabase_user') || 'null');
        if (u && u.teacher_name) teacherName = u.teacher_name;
      } catch(e) {}

      populateStudentSelect();
      renderReportWorkspace();
    });
  </script>
</body>
</html>
