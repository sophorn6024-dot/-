<!DOCTYPE html>
<html lang="km">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ព្រឹត្តិបត្រពិន្ទុ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 📊 PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    body {
      background: #334155;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    .f-moul {
      font-family: 'Khmer OS Muol Light', 'Moul', cursive !important;
      font-weight: normal;
    }

    /* =========================================================
       🎛️ TOP TOOLBAR (របារឧបករណ៍ផ្នែកខាងលើ)
    ========================================================= */
    .top-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: #1e293b;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid #334155;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .pill-btn, .pill-select {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      height: 38px;
      padding: 0 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
      white-space: nowrap;
    }

    .pill-btn:hover, .pill-select:hover {
      background: #475569;
      border-color: #64748b;
    }

    .pill-btn.primary {
      background: #00875a;
      color: #ffffff;
      border-color: #00875a;
    }
    .pill-btn.primary:hover {
      background: #00734c;
    }

    /* Dropdown Menu Popup */
    .dropdown-popup {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 190px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      padding: 6px;
      z-index: 2000;
    }
    .dropdown-popup.show { display: block; }

    .dropdown-item {
      padding: 9px 14px;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: #334155; }
    .dropdown-item.active { background: #0284c7; color: #fff; }

    /* Student Navigator */
    .student-nav-group {
      display: inline-flex;
      align-items: center;
      background: #334155;
      border-radius: 20px;
      border: 1px solid #475569;
      height: 38px;
      padding: 0 4px;
    }
    .student-nav-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .student-nav-btn:hover { background: #475569; }
    .student-select-clean {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      padding: 0 8px;
      max-width: 170px;
    }
    .student-select-clean option { background: #1e293b; color: #fff; }

    /* =========================================================
       📄 PAPER WORKSPACE (សន្លឹកក្រដាស A4)
    ========================================================= */
    .paper-stage {
      padding: 25px 15px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ទម្រង់បញ្ឈរ (Portrait - 1 នាក់ក្នុង ១ សន្លឹក) */
    .report-sheet {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 16mm 15mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      color: #000;
      page-break-after: always;
    }

    /* ទម្រង់ផ្តេក (Landscape - 2 នាក់ក្នុង ១ សន្លឹក A4) */
    .paper-stage.layout-2col .report-sheet-container-2col {
      background: #ffffff;
      width: 297mm;
      min-height: 210mm;
      padding: 8mm 10mm;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12mm;
      position: relative;
      page-break-after: always;
    }

    .paper-stage.layout-2col .report-sheet {
      width: 100%;
      min-height: auto;
      box-shadow: none;
      padding: 0;
    }

    /* ── Headers ── */
    .sheet-national-header {
      text-align: center;
      margin-bottom: 6px;
    }
    .nat-title-1 { font-size: 15px; margin-bottom: 3px; }
    .nat-title-2 { font-size: 13px; margin-bottom: 2px; }
    .nat-symbol { font-size: 11px; letter-spacing: 3px; }

    .sheet-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .left-dept-info {
      text-align: left;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .left-dept-info div:first-child { font-weight: 700; }
    .left-dept-info div:last-child { font-weight: 700; }

    .center-doc-title {
      text-align: center;
      flex: 1;
      margin-right: 80px;
    }
    .doc-main-title {
      font-size: 17px;
      color: #000;
      margin-bottom: 2px;
    }
    .doc-academic-year {
      font-size: 13.5px;
      font-weight: 600;
    }

    .student-meta-line {
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .student-meta-line span.hl-val { font-weight: 700; }
    .student-meta-line span.hl-rank { color: #dc2626; font-weight: 800; }

    /* ── Table Styling ── */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
      border: 1px solid #000;
    }
    .report-table th, .report-table td {
      border: 1px solid #000;
      padding: 5px 3px;
      vertical-align: middle;
      height: 27px;
    }
    .report-table thead th {
      background: #e2e8f0;
      font-weight: 700;
      font-size: 12px;
    }
    .report-table td.sub-name {
      text-align: center;
      font-weight: 700;
      padding-left: 6px;
    }
    .report-table td.bold-val { font-weight: 700; }

    /* ពណ៌និទ្ទេស */
    .gr-A { color: #0284c7; font-weight: 800; }
    .gr-B { color: #b45309; font-weight: 800; }
    .gr-C { color: #16a34a; font-weight: 800; }
    .gr-D { color: #2563eb; font-weight: 800; }
    .gr-E { color: #7c3aed; font-weight: 800; }
    .gr-F { color: #dc2626; font-weight: 800; }

    .summary-cell-text {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 4px;
    }

    /* ── Signatures & Footer ── */
    .sheet-signatures-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 14px;
      padding: 0 4px;
      font-size: 11.5px;
    }

    .sig-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 180px;
    }
    .sig-col.left-col { min-width: 190px; }
    .sig-col.mid-col { min-width: 170px; margin-top: 36px; }
    .sig-col.right-col { min-width: 190px; }

    .sig-title-moul { font-size: 12px; color: #000; margin-bottom: 2px; }
    .sig-role { font-weight: 700; font-size: 12px; margin-bottom: 45px; }
    .sig-name { font-weight: 700; font-size: 13px; }
    .sig-lunar-date, .sig-solar-date { font-size: 11px; line-height: 1.4; white-space: nowrap; }
    .sig-solar-date { margin-bottom: 4px; }

    .parent-dotted-lines {
      width: 100%;
      border-bottom: 1px dotted #000;
      height: 16px;
      margin-top: 10px;
    }

    .empty-state-card {
      background: #ffffff;
      padding: 60px 40px;
      border-radius: 16px;
      text-align: center;
      color: #64748b;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 500px;
      margin-top: 50px;
    }

    /* 📱 សម្រួលលើទូរសព្ទដៃ និងថេប្លេត (Mobile & Tablet Responsiveness) */
    @media screen and (max-width: 768px) {
      .top-toolbar {
        padding: 8px 10px;
        justify-content: flex-start;
        overflow-x: auto;
        white-space: nowrap;
      }
      .top-toolbar::-webkit-scrollbar { height: 3px; }
      .paper-stage {
        padding: 15px 5px;
        overflow-x: auto;
        width: 100%;
        display: block;
        -webkit-overflow-scrolling: touch;
      }
      .report-sheet {
        margin: 0 auto;
        transform-origin: top center;
      }
      @media (max-width: 500px) {
        .report-sheet {
          width: 195mm;
          padding: 10mm 10mm;
        }
      }
    }

    /* =========================================================
       🖨️ PRINT & PDF SETUP
    ========================================================= */
    @page {
      size: A4 portrait;
      margin: 8mm;
    }

    @media print {
      body { background: #ffffff !important; padding: 0 !important; }
      .top-toolbar { display: none !important; }
      .paper-stage { padding: 0 !important; gap: 0 !important; overflow: visible !important; display: block !important; }
      .report-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 280mm !important;
      }
      .paper-stage.layout-2col .report-sheet-container-2col {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: 195mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       1. TOOLBAR ផ្នែកខាងលើ
  ========================================================= -->
  <div class="top-toolbar">
    
    <!-- ជ្រើសរើសថ្នាក់ (Class Selector) -->
    <select id="classSelectPill" class="pill-select" onchange="onClassChange(this.value)">
      <option value="">កំពុងទាញយកថ្នាក់...</option>
    </select>

    <!-- Dropdown: ចំនួនសន្លឹក និងទិសដៅ -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('layoutDropdown')">
        <span id="currentLayoutText">1 នាក់ • សន្លឹកបញ្ឈរ</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
      </button>

      <div class="dropdown-popup" id="layoutDropdown">
        <div class="dropdown-item active" onclick="setLayoutMode('1_portrait', '1 នាក់ • សន្លឹកបញ្ឈរ', this)">
          <span>1 នាក់ • សន្លឹកបញ្ឈរ</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setLayoutMode('2_landscape', '2 នាក់ • សន្លឹកផ្តេក A4', this)">
          <span>2 នាក់ • សន្លឹកផ្តេក A4</span>
        </div>
      </div>
    </div>

    <!-- Dropdown: ប្រភេទនិទ្ទេស -->
    <div class="tb-group">
      <button type="button" class="pill-btn" onclick="toggleDropdown('gradeDropdown')">
        <span id="currentGradeText">និទ្ទេស A–F</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
      </button>

      <div class="dropdown-popup" id="gradeDropdown">
        <div class="dropdown-item active" onclick="setGradeFormat('AF', 'និទ្ទេស A–F', this)">
          <span>និទ្ទេស A–F</span> <i class="fa-solid fa-check"></i>
        </div>
        <div class="dropdown-item" onclick="setGradeFormat('KH', 'និទ្ទេស ខ្មែរ', this)">
          <span>និទ្ទេស ខ្មែរ (ល្អប្រសើរ...)</span>
        </div>
      </div>
    </div>

    <!-- កាលបរិច្ឆេទហត្ថលេខាគ្រូ -->
    <button type="button" class="pill-btn" onclick="editTeacherDate()">
      <i class="fa-regular fa-calendar-days"></i>
      <span>កាលបរិច្ឆេទហត្ថលេខា</span>
    </button>

    <!-- ថ្ងៃនាយកចុះហត្ថលេខា -->
    <button type="button" class="pill-btn" onclick="editDirectorDate()">
      <i class="fa-regular fa-calendar-days"></i>
      <span>ថ្ងៃនាយកចុះហត្ថលេខា</span>
    </button>

    <!-- រុករកសិស្ស -->
    <div class="student-nav-group">
      <button type="button" class="student-nav-btn" onclick="prevStudent()" title="សិស្សមុន">‹</button>
      <select class="student-select-clean" id="studentSelectBox" onchange="onStudentSelect(this.value)">
        <option value="">គ្មានសិស្ស</option>
      </select>
      <button type="button" class="student-nav-btn" onclick="nextStudent()" title="សិស្សបន្ទាប់">›</button>
    </div>

    <!-- ប៊ូតុងទាញយក PDF -->
    <button type="button" class="pill-btn" onclick="downloadPDF()">
      <i class="fa-solid fa-download"></i>
      <span>ទាញយក PDF</span>
    </button>

    <!-- ប៊ូតុងបោះពុម្ព (ពណ៌បៃតង) -->
    <button type="button" class="pill-btn primary" onclick="window.print()">
      <i class="fa-solid fa-print"></i>
      <span>បោះពុម្ព</span>
    </button>

  </div>

  <!-- =========================================================
       2. សន្លឹកព្រឹត្តិបត្រពិន្ទុ (PAPER WORKSPACE)
  ========================================================= -->
  <div class="paper-stage" id="paperWorkspace">
    <div class="empty-state-card">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7; margin-bottom:12px;"></i>
      <div>កំពុងទាញយកទិន្នន័យពី Database...</div>
    </div>
  </div>

  <!-- =========================================================
       3. JAVASCRIPT: SUPABASE & DYNAMIC REAL DATA
  ========================================================= -->
  <script>
    /* ── Supabase Configuration ── */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── Read Session User ── */
    function readSession() {
      try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
    }
    const CURRENT_USER = readSession();
    const USER_ROLE = CURRENT_USER?.role || "teacher";
    const USER_CLASS = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
    const IS_ADMIN = String(USER_ROLE).toLowerCase().trim() === 'admin';

    /* ── State ── */
    let layoutMode = '1_portrait';
    let gradeMode = 'AF';
    let currentClassName = '';
    let studentsList = []; // 🌟 ចាប់ផ្តើមទទេ (គ្មាន Mock Data)
    let currentStudentIndex = 0;

    const now = new Date();
    const currentYear = now.getFullYear();
    const academicYearStr = `${currentYear}-${currentYear + 1}`;

    let teacherLunarDate = "ថ្ងៃពុធ ៣កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let teacherSolarDate = `កំពង់ល្ពៅ ថ្ងៃទី១៤ ខែតុលា ឆ្នាំ${currentYear}`;
    let directorLunarDate = "ថ្ងៃពុធ ៣កើត ខែអស្សុជ ឆ្នាំមមែ អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
    let directorSolarDate = `កំពង់ល្ពៅ ថ្ងៃទី១៤ ខែតុលា ឆ្នាំ${currentYear}`;
    let teacherName = CURRENT_USER?.teacher_name || "គ្រូទទួលបន្ទុកថ្នាក់";

    function cleanGrade(g) {
      return String(g || '').replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/, '').trim();
    }

    const GRADE_KH_MAP = {
      'A': 'ល្អប្រសើរ',
      'B': 'ល្អណាស់',
      'C': 'ល្អ',
      'D': 'បង្គួរ',
      'E': 'មធ្យម',
      'F': 'ខ្សោយ'
    };

    function formatGrade(code) {
      if (!code || code === '-') return '-';
      return (gradeMode === 'KH') ? (GRADE_KH_MAP[code] || code) : code;
    }

    function calculateGrade(avg) {
      if (avg >= 9) return 'A';
      if (avg >= 8) return 'B';
      if (avg >= 7) return 'C';
      if (avg >= 6) return 'D';
      if (avg >= 5) return 'E';
      return 'F';
    }

    /* ── Dropdown Controller ── */
    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isShown = el.classList.contains('show');
      closeAllDropdowns();
      if (!isShown) el.classList.add('show');
    }
    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-popup').forEach(d => d.classList.remove('show'));
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tb-group')) closeAllDropdowns();
    });

    function setLayoutMode(mode, label, el) {
      layoutMode = mode;
      document.getElementById('currentLayoutText').innerText = label;
      document.querySelectorAll('#layoutDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function setGradeFormat(fmt, label, el) {
      gradeMode = fmt;
      document.getElementById('currentGradeText').innerText = label;
      document.querySelectorAll('#gradeDropdown .dropdown-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      closeAllDropdowns();
      renderReportWorkspace();
    }

    function editTeacherDate() {
      const l = prompt("កាលបរិច្ឆេទចន្ទគតិ (គ្រូទទួលបន្ទុកថ្នាក់)៖", teacherLunarDate);
      if (l !== null) teacherLunarDate = l;
      const s = prompt("កាលបរិច្ឆេទសុរិយគតិ (គ្រូទទួលបន្ទុកថ្នាក់)៖", teacherSolarDate);
      if (s !== null) teacherSolarDate = s;
      const t = prompt("ឈ្មោះគ្រូទទួលបន្ទុកថ្នាក់៖", teacherName);
      if (t !== null) teacherName = t;
      renderReportWorkspace();
    }

    function editDirectorDate() {
      const l = prompt("កាលបរិច្ឆេទចន្ទគតិ (នាយកសាលា)៖", directorLunarDate);
      if (l !== null) directorLunarDate = l;
      const s = prompt("កាលបរិច្ឆេទសុរិយគតិ (នាយកសាលា)៖", directorSolarDate);
      if (s !== null) directorSolarDate = s;
      renderReportWorkspace();
    }

    /* =========================================================
       4. FETCH REAL DATA FROM SUPABASE
    ========================================================= */
    async function initClassDropdown() {
      const sel = document.getElementById('classSelectPill');
      sel.innerHTML = '<option value="">កំពុងទាញយកថ្នាក់...</option>';

      try {
        const { data, error } = await sb.from('students').select('grade').limit(5000);
        if (error) throw error;

        let rawClasses = Array.from(new Set((data || []).map(d => cleanGrade(d.grade)).filter(Boolean)));
        rawClasses.sort((a,b) => a.localeCompare(b, 'km', { numeric: true }));

        sel.innerHTML = rawClasses.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');

        const cleanUserClass = cleanGrade(USER_CLASS);
        if (!IS_ADMIN && cleanUserClass) {
          sel.value = cleanUserClass;
          sel.disabled = true;
          currentClassName = cleanUserClass;
        } else {
          sel.value = (cleanUserClass && rawClasses.includes(cleanUserClass)) ? cleanUserClass : (rawClasses[0] || '');
          currentClassName = sel.value;
        }

        await loadRealDataForClass(currentClassName);

      } catch (err) {
        sel.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

    function onClassChange(val) {
      currentClassName = val;
      loadRealDataForClass(val);
    }

    async function loadRealDataForClass(cls) {
      const pure = cleanGrade(cls);
      if (!pure) return;

      document.getElementById('paperWorkspace').innerHTML = `
        <div class="empty-state-card">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7; margin-bottom:12px;"></i>
          <div>កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${pure}...</div>
        </div>`;

      try {
        // ១. ទាញយកបញ្ជីសិស្សពិត
        const { data: stData, error: stErr } = await sb
          .from('students')
          .select('*')
          .in('grade', [pure, `ថ្នាក់ទី${pure}`, `ថ្នាក់ទី ${pure}`])
          .order('id', { ascending: true });
        if (stErr) throw stErr;

        if (!stData || stData.length === 0) {
          studentsList = [];
          populateStudentSelect();
          document.getElementById('paperWorkspace').innerHTML = `
            <div class="empty-state-card">
              <i class="fa-solid fa-user-slash fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
              <div>មិនទាន់មានទិន្នន័យសិស្សក្នុងថ្នាក់ទី ${pure} នៅឡើយទេ</div>
            </div>`;
          return;
        }

        // ២. ទាញយកមុខវិជ្ជាឆមាសពិតពី table subjects
        const { data: subData } = await sb
          .from('subjects')
          .select('*')
          .eq('assigned_class', pure)
          .eq('subject_type', 'semester')
          .order('sort_order', { ascending: true });

        const defaultSemSubjects = [
          { name: "អំណាន", code: "read", max: 10 },
          { name: "ស្ដាប់ និងនិយាយ", code: "listen", max: 10 },
          { name: "សរសេរតាមអាន", code: "dictation", max: 10 },
          { name: "តែងសេចក្ដី", code: "essay", max: 10 },
          { name: "គណិតវិទ្យា", code: "math", max: 10 },
          { name: "វិទ្យាសាស្ត្រ", code: "science", max: 10 },
          { name: "សិក្សាសង្គម", code: "social", max: 10 },
          { name: "គេហវិទ្យា-អប់រំសិល្បៈ", code: "homeArts", max: 10 },
          { name: "អប់រំកាយ-សុខភាព", code: "pe", max: 10 },
          { name: "អប់រំបំណិនជីវិត", code: "ethics", max: 10 },
          { name: "ភាសាបរទេស", code: "foreign", max: 10 }
        ];

        let classSubjects = (subData && subData.length > 0)
          ? subData.map((s, i) => ({ no: i + 1, name: s.name, code: s.code || `sub_${s.id}`, max: Number(s.max_score) || 10 }))
          : defaultSemSubjects.map((s, i) => ({ no: i + 1, name: s.name, code: s.code, max: s.max }));

        // ៣. ទាញយកពិន្ទុឆមាសទី១ និងទី២
        const { data: scData } = await sb
          .from('scores')
          .select('*')
          .eq('assigned_class', pure)
          .eq('score_type', 'semester');

        const scoreMapS1 = {};
        const scoreMapS2 = {};

        (scData || []).forEach(row => {
          let scObj = row.scores || {};
          if (typeof scObj === 'string') {
            try { scObj = JSON.parse(scObj); } catch(e) { scObj = {}; }
          }
          const sid = String(row.student_id);
          if (row.period === 'ឆមាសទី១') scoreMapS1[sid] = scObj;
          if (row.period === 'ឆមាសទី២') scoreMapS2[sid] = scObj;
        });

        // ៤. ទាញយកអវត្តមានសិស្សពិត
        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, status')
          .eq('assigned_class', pure);

        const unexcusedMap = {};
        const excusedMap = {};
        const unexcusedCodes = ['A', 'អ', 'អត់ច្បាប់', 'អវត្តមាន', 'ABSENT', 'UNEXCUSED'];
        const excusedCodes = ['C', 'ច', 'ច្បាប់', 'មានច្បាប់', 'EXCUSED', 'PERMISSION'];

        (attData || []).forEach(a => {
          const sid = String(a.student_id);
          const st = String(a.status || '').trim().toUpperCase();
          if (unexcusedCodes.includes(st)) unexcusedMap[sid] = (unexcusedMap[sid] || 0) + 1;
          if (excusedCodes.includes(st)) excusedMap[sid] = (excusedMap[sid] || 0) + 1;
        });

        // ៥. បូកសរុបពិន្ទុ មធ្យមភាគ និងចំណាត់ថ្នាក់
        studentsList = stData.map(st => {
          const sid = String(st.student_id || st.id);
          const sc1 = scoreMapS1[sid] || {};
          const sc2 = scoreMapS2[sid] || {};

          let sem1Total = 0, sem1Count = 0;
          let sem2Total = 0, sem2Count = 0;

          const studentScores = classSubjects.map((sub, i) => {
            const v1 = parseFloat(sc1[sub.code]);
            const v2 = parseFloat(sc2[sub.code]);

            const has1 = !isNaN(v1);
            const has2 = !isNaN(v2);

            if (has1) { sem1Total += v1; sem1Count++; }
            if (has2) { sem2Total += v2; sem2Count++; }

            let subAvg = '-';
            let subGrade = '-';

            if (has1 && has2) subAvg = ((v1 + v2) / 2);
            else if (has1) subAvg = v1;
            else if (has2) subAvg = v2;

            if (subAvg !== '-') {
              subGrade = calculateGrade(subAvg);
              subAvg = subAvg.toFixed(2).replace(/\.00$/, '');
            }

            return {
              no: i + 1,
              name: sub.name,
              max: sub.max,
              s1: has1 ? v1 : '-',
              s2: has2 ? v2 : '-',
              avg: subAvg,
              grade: subGrade
            };
          });

          const avg1 = sem1Count > 0 ? (sem1Total / sem1Count) : 0;
          const avg2 = sem2Count > 0 ? (sem2Total / sem2Count) : 0;
          let yearAvg = 0;

          if (sem1Count > 0 && sem2Count > 0) yearAvg = (avg1 + avg2) / 2;
          else if (sem1Count > 0) yearAvg = avg1;
          else if (sem2Count > 0) yearAvg = avg2;

          return {
            id: st.student_id || st.id,
            name: st.student_name || 'គ្មានឈ្មោះ',
            gender: st.gender || 'ប្រុស',
            grade: pure,
            avgSem1: avg1,
            avgSem2: avg2,
            avgYear: yearAvg,
            yearGrade: yearAvg > 0 ? calculateGrade(yearAvg) : '-',
            absentUnexcused: unexcusedMap[sid] || 0,
            absentExcused: excusedMap[sid] || 0,
            scores: studentScores
          };
        });

        // ៦. គណនាចំណាត់ថ្នាក់ប្រចាំឆ្នាំ (Year Rank)
        const sortedList = [...studentsList].sort((a, b) => b.avgYear - a.avgYear);
        const rankMap = {};
        let lastAvg = null, lastRank = 0;
        sortedList.forEach((item, index) => {
          if (item.avgYear === lastAvg) {
            rankMap[item.id] = lastRank;
          } else {
            rankMap[item.id] = index + 1;
            lastRank = index + 1;
            lastAvg = item.avgYear;
          }
        });

        studentsList.forEach(s => {
          s.rank = rankMap[s.id] || '-';
          s.yearRank = rankMap[s.id] || '-';
        });

        currentStudentIndex = 0;
        populateStudentSelect();
        renderReportWorkspace();

      } catch (err) {
        console.error(err);
        document.getElementById('paperWorkspace').innerHTML = `<div class="empty-state-card" style="color:#ef4444;">❌ កំហុសផ្ទុកទិន្នន័យ៖ ${err.message}</div>`;
      }
    }

    /* ── Student Navigator ── */
    function populateStudentSelect() {
      const sel = document.getElementById('studentSelectBox');
      if (!studentsList.length) {
        sel.innerHTML = '<option value="">គ្មានសិស្ស</option>';
        return;
      }
      sel.innerHTML = studentsList.map((s, idx) => 
        `<option value="${idx}">${idx + 1}. ${s.name}</option>`
      ).join('');
      sel.value = String(currentStudentIndex);
    }

    function onStudentSelect(idx) {
      currentStudentIndex = parseInt(idx, 10);
      renderReportWorkspace();
    }

    function prevStudent() {
      if (currentStudentIndex > 0) {
        currentStudentIndex--;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    function nextStudent() {
      if (currentStudentIndex < studentsList.length - 1) {
        currentStudentIndex++;
        document.getElementById('studentSelectBox').value = String(currentStudentIndex);
        renderReportWorkspace();
      }
    }

    /* =========================================================
       5. HTML TEMPLATE FOR SINGLE REPORT CARD
    ========================================================= */
    function generateReportHTML(st) {
      if (!st) return '';

      let rowsHtml = '';
      st.scores.forEach(row => {
        const grClass = row.grade !== '-' ? `gr-${row.grade}` : '';
        rowsHtml += `
          <tr>
            <td>${row.no}</td>
            <td class="sub-name">${row.name}</td>
            <td>${row.max}</td>
            <td>${row.s1}</td>
            <td>${row.s2}</td>
            <td class="bold-val">${row.avg}</td>
            <td class="${grClass}">${formatGrade(row.grade)}</td>
          </tr>
        `;
      });

      const totalAbsent = (st.absentUnexcused || 0) + (st.absentExcused || 0);
      const yearGradeClass = st.yearGrade !== '-' ? `gr-${st.yearGrade}` : '';

      return `
        <div class="report-sheet">
          <div>
            <!-- ក្បាលទំព័រជាតិ -->
            <div class="sheet-national-header">
              <div class="nat-title-1 f-moul">ព្រះរាជាណាចក្រកម្ពុជា</div>
              <div class="nat-title-2 f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
              <div class="nat-symbol">─────── ❖ ───────</div>
            </div>

            <!-- ឈ្មោះសាលា និង ចំណងជើង -->
            <div class="sheet-sub-header">
              <div class="left-dept-info">
                <div>ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
                <div style="font-weight:700;">សាលាបឋមសិក្សាកំពង់ល្ពៅ</div>
                <div>ថ្នាក់ទី${st.grade}</div>
              </div>

              <div class="center-doc-title">
                <div class="doc-main-title f-moul">ព្រឹត្តិបត្រពិន្ទុ ${academicYearStr}</div>
                <div class="doc-academic-year">ឆ្នាំសិក្សា ${academicYearStr}</div>
              </div>
            </div>

            <!-- ព័ត៌មានសិស្ស -->
            <div class="student-meta-line">
              សិស្សឈ្មោះ: <span class="hl-val">${st.name}</span> • 
              ភេទ <span class="hl-val">${st.gender}</span> • 
              អត្តលេខ <span class="hl-val">${st.id}</span> • 
              ចំណាត់ថ្នាក់ទី <span class="hl-rank">${st.rank}</span>
            </div>

            <!-- តារាងពិន្ទុមុខវិជ្ជា -->
            <table class="report-table">
              <thead>
                <tr>
                  <th style="width: 44px;">ល.រ</th>
                  <th>មុខវិជ្ជា</th>
                  <th style="width: 90px;">ពិន្ទុអតិបរមា</th>
                  <th style="width: 105px;">ប្រឡងឆមាសទី១</th>
                  <th style="width: 105px;">ប្រឡងឆមាសទី២</th>
                  <th style="width: 85px;">មធ្យមភាគ</th>
                  <th style="width: 65px;">និទ្ទេស</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
                <!-- ជួរទី១ សង្ខេបលទ្ធផល -->
                <tr style="background:#f8fafc;">
                  <td colspan="4" class="summary-cell-text" style="text-align:left; padding-left:14px;">
                    មធ្យមភាគឆមាសទី១ ${st.avgSem1 > 0 ? st.avgSem1.toFixed(2) : '-'} • ឆមាសទី២ ${st.avgSem2 > 0 ? st.avgSem2.toFixed(2) : '-'} • ប្រចាំឆ្នាំ ${st.avgYear > 0 ? st.avgYear.toFixed(2) : '-'}
                  </td>
                  <td colspan="2" class="summary-cell-text" style="color:#000;">
                    ចំណាត់ថ្នាក់ទី <span style="color:#dc2626; font-weight:800;">${st.yearRank}</span>
                  </td>
                  <td class="summary-cell-text ${yearGradeClass}">
                    និទ្ទេស ${formatGrade(st.yearGrade)}
                  </td>
                </tr>
                <!-- ជួរទី២ សង្ខេបអវត្តមាន -->
                <tr style="background:#f8fafc;">
                  <td colspan="3" class="summary-cell-text">
                    អវត្តមាន (ឥតច្បាប់) ៖ ${st.absentUnexcused}
                  </td>
                  <td colspan="3" class="summary-cell-text">
                    អវត្តមាន (មានច្បាប់) ៖ ${st.absentExcused}
                  </td>
                  <td class="summary-cell-text">
                    សរុប ៖ ${totalAbsent}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- កន្លែងហត្ថលេខាទាំង ៣ ជួរ -->
          <div class="sheet-signatures-area">
            <!-- ឆ្វេង៖ នាយកសាលា -->
            <div class="sig-col left-col">
              <div class="sig-title-moul f-moul">បានឃើញ និងឯកភាព</div>
              <div class="sig-lunar-date">${directorLunarDate}</div>
              <div class="sig-solar-date">${directorSolarDate}</div>
              <div class="sig-role f-moul">នាយកសាលា</div>
            </div>

            <!-- កណ្ដាល៖ មតិអាណាព្យាបាល -->
            <div class="sig-col mid-col">
              <div class="sig-title-moul f-moul" style="font-size:12px;">មតិរបស់មាតាបិតា</div>
              <div class="f-moul" style="font-size:12px; margin-bottom:8px;">ឬអាណាព្យាបាលសិស្ស</div>
              <div class="parent-dotted-lines"></div>
              <div class="parent-dotted-lines"></div>
            </div>

            <!-- ស្ដាំ៖ គ្រូទទួលបន្ទុកថ្នាក់ -->
            <div class="sig-col right-col">
              <div class="sig-lunar-date">${teacherLunarDate}</div>
              <div class="sig-solar-date">${teacherSolarDate}</div>
              <div class="sig-role f-moul">គ្រូទទួលបន្ទុកថ្នាក់</div>
              <div class="sig-name">${teacherName}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       6. RENDER WORKSPACE
    ========================================================= */
    function renderReportWorkspace() {
      const container = document.getElementById('paperWorkspace');

      if (!studentsList.length) {
        container.className = 'paper-stage';
        container.innerHTML = `
          <div class="empty-state-card">
            <i class="fa-solid fa-folder-open fa-2x" style="color:#f59e0b; margin-bottom:12px;"></i>
            <div>មិនមានទិន្នន័យសិស្សត្រូវបង្ហាញឡើយ</div>
          </div>`;
        return;
      }

      if (layoutMode === '1_portrait') {
        container.className = 'paper-stage';
        const currentStudent = studentsList[currentStudentIndex] || studentsList[0];
        container.innerHTML = generateReportHTML(currentStudent);
      } else {
        container.className = 'paper-stage layout-2col';
        const st1 = studentsList[currentStudentIndex] || studentsList[0];
        const st2 = studentsList[currentStudentIndex + 1] || st1;

        container.innerHTML = `
          <div class="report-sheet-container-2col">
            ${generateReportHTML(st1)}
            ${generateReportHTML(st2)}
          </div>
        `;
      }
    }

    function downloadPDF() {
      if (!studentsList.length) return alert('គ្មានទិន្នន័យដើម្បីទាញយកជា PDF ឡើយ!');
      const element = document.getElementById('paperWorkspace');
      const isPortrait = (layoutMode === '1_portrait');
      const st = studentsList[currentStudentIndex] || studentsList[0];

      const opt = {
        margin: [4, 4, 4, 4],
        filename: `ព្រឹត្តិបត្រពិន្ទុ_${st.name}_ថ្នាក់ទី${st.grade}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 3, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isPortrait ? 'portrait' : 'landscape' }
      };

      html2pdf().set(opt).from(element).save();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initClassDropdown();
    });
  </script>
</body>
</html>
