<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>សៀវភៅតាមដានការសិក្សា</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 🌟 បង្ខំឱ្យ DROPDOWN, SELECT និង BUTTON ទាំងអស់ប្រើ FONT BATTAMBANG 100% */
    .sp-btn, .sp-popup, .sp-popup *,
    .mp-btn, .mp-popup, .mp-popup *,
    .form-control, select, option,
    .panel-pill-box, .toolbar-label, .btn {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif !important;
      font-weight: 700 !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 400; }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ SLEEK SINGLE-ROW TOOLBAR
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }

    .no-print-bar::-webkit-scrollbar { height: 3px; }
    .no-print-bar::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.25); border-radius: 3px; }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 9px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .form-control {
      padding: 4px 7px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 30px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .btn {
      padding: 4px 11px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 30px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 7px rgba(16, 185, 129, 0.25);
    }
    .btn-purple {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      box-shadow: 0 2px 7px rgba(124, 58, 237, 0.25);
    }
    .btn-toggle {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 2px 7px rgba(5, 150, 105, 0.25);
    }

    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--ctrl-group-bg);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--tb-border);
      height: 30px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      height: 24px;
      display: flex;
      align-items: center;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 1px 5px rgba(2, 132, 199, 0.35);
    }

    /* =========================================================
       🌟 1. CUSTOM MONTH PICKER (រចនាដូចរូបភាព ១០០%)
    ========================================================= */
    .mp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 86px;
      height: 30px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .mp-btn:hover, .mp-btn.open {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .mp-btn-label {
      white-space: nowrap;
    }
    .mp-chev {
      font-size: 10px;
      color: #0284c7;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .mp-btn.open .mp-chev {
      transform: rotate(180deg);
    }

    .mp-popup {
      display: none;
      position: fixed;
      z-index: 99999;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      padding: 8px 6px;
      width: 140px;
      animation: mpIn 0.15s ease-out;
    }
    .mp-popup.show { display: block; }
    @keyframes mpIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mp-list {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .mp-list::-webkit-scrollbar { width: 4px; }
    .mp-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .mp-item {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #f1f5f9;
      transition: all 0.15s ease;
    }
    .mp-item:last-child {
      border-bottom: none;
    }
    .mp-item:hover {
      background: #f8fafc;
      color: #0284c7;
    }
    .mp-item.active {
      background: #e0f2fe !important;
      color: #0284c7 !important;
      border-bottom-color: transparent;
    }
    .mp-item .fa-check {
      display: none;
      position: absolute;
      right: 12px;
      font-size: 11px;
      color: #0284c7;
    }
    .mp-item.active .fa-check {
      display: inline;
    }

    /* =========================================================
       🔎 2. CUSTOM STUDENT PICKER
    ========================================================= */
    .sp-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 150px; max-width: 210px; height: 30px; padding: 4px 10px;
      font-size: 12.5px; font-weight: 700; color: var(--text-main);
      background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 7px; cursor: pointer; outline: none; transition: all 0.2s ease;
    }
    .sp-btn:hover, .sp-btn.open { border-color: var(--input-focus); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }
    .sp-btn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-chev { font-size: 10px; color: #0284c7; transition: transform 0.2s ease; flex-shrink: 0; }
    .sp-btn.open .sp-chev { transform: rotate(180deg); }

    .sp-popup {
      display: none; position: fixed; z-index: 99999;
      background: var(--card-panel-bg); color: var(--text-main);
      border: 1px solid var(--tb-border); border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      padding: 8px; animation: spIn 0.15s ease-out;
    }
    .sp-popup.show { display: block; }
    @keyframes spIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .sp-search {
      display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px;
      background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 12px; margin-bottom: 6px;
    }
    .sp-search:focus-within { border-color: var(--input-focus); }
    .sp-search i { color: var(--text-muted); font-size: 12px; }
    .sp-search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      color: var(--text-main); font-size: 13px; font-weight: 700;
    }
    .sp-list { position: relative; overflow-y: auto; scrollbar-width: thin; }
    .sp-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; border-radius: 12px; cursor: pointer;
      font-size: 14px; font-weight: 700; color: var(--text-main);
    }
    .sp-item:hover { background: var(--ctrl-group-bg); }
    .sp-item.active { background: rgba(2, 132, 199, 0.15); color: #0284c7; }
    .sp-item .fa-check { display: none; font-size: 13px; }
    .sp-item.active .fa-check { display: inline; }
    .sp-empty { padding: 18px 10px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 700; }

    /* =========================================================
       📱 RESPONSIVE ADJUSTMENTS
    ========================================================= */
    @media screen and (min-width: 769px) and (max-width: 1180px) {
      .no-print-bar { padding: 8px 16px; gap: 8px; }
      .panel-pill-box { padding: 3px 8px; }
      .form-control, .btn, .sp-btn, .mp-btn { height: 32px; font-size: 12.5px; }
      .zoom-btn-group { height: 32px; }
      .zoom-btn { height: 26px; font-size: 11.5px; }
      .preview-wrapper { padding: 14px 10px; gap: 18px; }
    }

    @media screen and (max-width: 768px) {
      body { padding-bottom: 40px; }
      .no-print-bar { padding: 6px 10px; gap: 6px; }
      .tb-group { gap: 4px; }
      .panel-pill-box { padding: 2px 6px; }
      .form-control, .btn { height: 28px; font-size: 11px; padding: 2px 6px; }
      .sp-btn, .mp-btn { height: 28px; font-size: 11.5px; padding: 2px 8px; }
      .sp-btn { min-width: 120px; }
      .mp-btn { min-width: 74px; }
      .zoom-btn-group { height: 28px; }
      .zoom-btn { height: 22px; padding: 1px 5px; font-size: 10px; }
      .preview-wrapper {
        padding: 10px 4px;
        gap: 14px;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* =========================================================
       📄 BOOKLET PREVIEW (សៀវភៅតាមដានការសិក្សា)
    ========================================================= */
    .preview-wrapper {
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transition: zoom 0.2s ease;
      transform-origin: top center;
    }

    .booklet-container {
      background: #ffffff !important;
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      min-height: 210mm;
      padding: 6mm 7.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      page-break-after: always;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy);
      padding: 13px 18px 10px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      background: #ffffff !important;
      color: var(--navy) !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14.5px; letter-spacing: 6px; color: var(--red-star); margin: 6px 0 8px 0; }
    .page-left .header-text h2 { margin-bottom: 5px; }
    .page-left .header-text h3 { margin-bottom: 5px; }

    .cover-title-block { text-align: center; margin: 18px 0 12px 0; color: var(--navy); }
    .cover-title-block h2 { font-size: 17px; margin-bottom: 6px; }
    .cover-title-block h3 { font-size: 15.5px; margin-bottom: 10px; }
    .cover-title-block h1 { font-size: 29px; margin: 14px 0; letter-spacing: 0.5px; line-height: 1.35; }
    .cover-title-block .school-name { font-size: 16.5px; margin-top: 8px; }

    .dotted-info-list {
      margin: 14px 0 8px 0;
      display: flex;
      flex-direction: column;
      gap: 15.5px;
      font-size: 15.5px;
    }
    .info-row { display: flex; align-items: flex-end; width: 100%; }
    .info-label { white-space: nowrap; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; color: var(--navy); font-weight: bold; font-size: 15.5px; }
    .info-dots {
      flex: 1; border-bottom: 1.5px dotted #132d56; margin-left: 6px; padding-left: 6px; min-height: 23px;
      color: #0f172a; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-size: 15.5px;
    }

    .cover-footer { text-align: center; font-size: 21px; color: var(--navy); margin-top: 6px; margin-bottom: 2px; }

    .report-meta-grid {
      display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; margin: 2px 0 4px 0; font-size: 13.5px; color: var(--navy);
    }

    .score-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      margin-bottom: 3px; 
      border: 1.4px solid var(--navy) !important; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .score-table th, .score-table td { 
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 0.5px; 
      height: 22px; 
      vertical-align: middle; 
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .score-table th { 
      background-color: #f8fafc !important; 
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; 
      font-weight: bold; 
      color: var(--navy) !important; 
      font-size: 13.5px; 
    }
    .score-table td.subject-name {
      text-align: left; padding-left: 7px; font-size: 13px; color: var(--navy) !important;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-table .val-cell {
      font-weight: bold; color: var(--navy) !important; font-size: 15.5px; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    .th-grade { width: 8.8%; white-space: nowrap; padding: 1px 0 !important; }
    .grade-range { font-size: 8.8px; font-weight: normal; white-space: nowrap; display: inline-block; letter-spacing: -0.3px; font-family: 'Arial', sans-serif; line-height: 1.1; }

    .summary-text { font-size: 12.5px; margin-top: 3px; line-height: 1.45; color: var(--navy); }
    .summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; }

    .signature-grid {
      display: grid; grid-template-columns: 1.25fr 1.05fr 1.4fr; text-align: center; font-size: 12px; margin-top: 14px; align-items: start; color: var(--navy);
    }
    .sig-col { display: flex; flex-direction: column; align-items: center; }
    .sig-lunar { font-size: 9px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; line-height: 1.25; white-space: nowrap; }
    .sig-solar { font-size: 9.5px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; margin-bottom: 2px; line-height: 1.25; white-space: nowrap; }
    .sig-title { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-size: 11.5px; color: var(--navy); white-space: nowrap; }
    .sig-name { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; font-size: 13.5px; margin-top: 38px; white-space: nowrap; }

    .score-table tbody tr { height: 22px; }
    .score-table tbody td { height: 22px; line-height: 20px; overflow: hidden; }
    .score-table tbody td.val-cell { font-size: 14px; line-height: 20px; padding: 0 !important; }

    /* =========================================================
       🖨️ PRINT RULES (A4 LANDSCAPE)
    ========================================================= */
    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }
      .no-print-bar, .sp-popup, .mp-popup { display: none !important; }
      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .booklet-container {
        box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important;
        max-height: 210mm !important; min-height: 210mm !important; padding: 6mm 7.5mm !important;
        page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important;
        border-radius: 0 !important;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- =========================================================

    <!-- ផ្នែកខាងឆ្វេង ៖ ជម្រើសទិន្នន័យ (Filters) -->

      <div class="panel-pill-box" id="adminClassBox" style="display:none;">

      <!-- 🌟 ខែ៖ ប៊ូតុងរចនាថ្មីស្អាតបេះបិទតាមរូបភាព -->
      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> ខែ៖</span>

      <div class="panel-pill-box">

        <button type="button" class="sp-btn" id="spBtn" onclick="toggleStudentPicker(event)">
          <span class="sp-btn-label" id="spLabel">🏫 ទាំងថ្នាក់ (ទាំងអស់)</span>

        </button>
        <select id="studentSelect" style="display:none;" onchange="renderFilteredView()">

    <!-- ផ្នែកខាងស្តាំ ៖ ប៊ូតុងមុខងារ, Zoom & Print -->
    <div class="tb-group">
      <button class="btn btn-toggle" id="btnDisplayMode" onclick="toggleDisplayMode()" title="ប្តូររវាង ធីក (✔) និង ពិន្ទុលេខ">

      </button>

      <button class="btn btn-purple" id="btnCoverToggle" onclick="toggleCover()" title="បង្ហាញ ឬលាក់ទំព័រក្របមុខ">
        <i class="fa-solid fa-book-open"></i> <span id="txtCoverToggle">ក្រប</span>
      </button>

      <!-- Zoom Buttons -->
      <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំ">

        <button type="button" class="zoom-btn" id="z75" onclick="setZoom(0.75, 'z75')">75%</button>

  <!-- =========================================================
       📄 BOOKLET PREVIEW CONTAINER

  <!-- 🔎 SEARCHABLE STUDENT PICKER POPUP -->

    </div>
    <div class="sp-list" id="spList"></div>

  <div class="preview-wrapper" id="reportContainer" style="display:none;">

      <p style="margin-top:12px;">កំពុងរៀបចំទាញទិន្នន័យសៀវភៅតាមដាន...</p>
    </div>

  <!-- =========================================================
       ⚙️ JAVASCRIPT ENGINE (SUPABASE INTEGRATED)
  ========================================================= -->
  <script>
    /* 1. SUPABASE CLIENT CONFIG */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* 2. AUTH GUARD */
    function readSession() {
      try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
    }
    const CURRENT_USER = readSession();

    function checkAuthentication() {
      if (!CURRENT_USER || !CURRENT_USER.username) {
        document.getElementById('controlToolbar').style.display = 'none';
        document.getElementById('reportContainer').style.display = 'none';
        document.getElementById('authDeniedWrap').style.display = 'flex';
        return false;
      }
      document.getElementById('authDeniedWrap').style.display = 'none';
      document.getElementById('controlToolbar').style.display = 'flex';
      document.getElementById('reportContainer').style.display = 'flex';
      return true;
    }

    function goToIndex(e) {
      if (e) e.preventDefault();
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'OPEN_LOGIN', action: 'LOGIN' }, '*');
          window.parent.location.href = 'index.html';
          return;
        } catch(err) {}
      }
      window.location.href = 'index.html';
    }

    const USER_ROLE    = CURRENT_USER?.role || "teacher";
    const USER_CLASS   = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
    const TEACHER_NAME = CURRENT_USER?.teacher_name || "";
    const IS_ADMIN     = String(USER_ROLE).toLowerCase().trim() === 'admin';

    const KHMER_MONTHS = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];

    function cleanGrade(g) { return String(g || '').replace(/^ថ្នាក់ទី\s*/, '').trim(); }
    function toKhmerNum(num) {
      if (num === null || num === undefined) return '';
      return num.toString().replace(/\d/g, d => KHMER_DIGITS[parseInt(d)] !== undefined ? KHMER_DIGITS[parseInt(d)] : d);
    }

    function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme || 'dark'); }
    applyTheme(localStorage.getItem('krou_theme_manual') || 'dark');
    window.addEventListener('message', e => { if (e.data && (e.data.type === 'THEME_CHANGE' || e.data.theme)) applyTheme(e.data.theme || e.data); });

    /* 3. SUBJECT LIST */
    const SUBJECTS = [
      { key: 'kh_listen', label: 'សមត្ថភាពស្តាប់' },
      { key: 'kh_write',  label: 'សមត្ថភាពសរសេរ' },
      { key: 'kh_read',   label: 'សមត្ថភាពអាន' },
      { key: 'kh_speak',  label: 'សមត្ថភាពនិយាយ' },
      { key: 'm_num',     label: 'ចំនួន' },
      { key: 'm_measure', label: 'រង្វាស់រង្វាល់' },
      { key: 'm_geo',     label: 'ធរណីមាត្រ' },
      { key: 'm_algebra', label: 'ពិជគណិត' },
      { key: 'm_stat',    label: 'ស្ថិតិ' },
      { key: 'science',   label: 'វិទ្យាសាស្ត្រ' },
      { key: 'social',    label: 'សិក្សាសង្គម' },
      { key: 'a_craft',   label: 'គេហវិទ្យា-អប់រំសិល្បៈ' },
      { key: 'a_pe',      label: 'អប់រំកាយ-កីឡា' },
      { key: 'a_health',  label: 'សុខភាព-អនាម័យ' },
      { key: 'a_env',     label: 'អប់រំបរិស្ថាន' },
      { key: 'foreign',   label: 'ភាសាបរទេស' }
    ];

    let showCover = true;
    let displayMode = 'tick';
    let allStudentsData = [];
    let classSavedScores = {};
    let classAttendanceMap = {};
    let currentClassName = '';

    window.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuthentication()) return;

      const now = new Date();
      const curMonth = KHMER_MONTHS[now.getMonth()];
      const mInput = document.getElementById('monthSelect');
      if (mInput && curMonth) {
        mInput.value = curMonth;
        const mpLabel = document.getElementById('mpLabel');
        if (mpLabel) mpLabel.textContent = curMonth;
      }

      await initClasses();

      if (window.innerWidth <= 1180) {
        setFitZoom();
      }
    });

    function toggleDisplayMode() {
      if (displayMode === 'tick') {
        displayMode = 'score';
        document.getElementById('txtDisplayMode').innerText = 'ពិន្ទុ';
      } else {
        displayMode = 'tick';
        document.getElementById('txtDisplayMode').innerText = 'ធីក';
      }
      renderFilteredView();
    }

    function setZoom(scale, btnId) {
      const container = document.getElementById('reportContainer');
      if (container) container.style.zoom = scale;
      ['zFit', 'z75', 'z100'].forEach(id => document.getElementById(id)?.classList.remove('active'));
      document.getElementById(btnId)?.classList.add('active');
    }

    function setFitZoom() {
      const screenW = window.innerWidth;
      const targetW = showCover ? 1125 : 610;
      let scale = (screenW - 20) / targetW;
      if (scale > 1) scale = 1;
      if (scale < 0.28) scale = 0.28;
      setZoom(scale, 'zFit');
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth <= 1180 && document.getElementById('zFit')?.classList.contains('active')) {
        setFitZoom();
      }
    });

    function doPrint() {
      window.focus();
      setTimeout(() => {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    function toggleCover() {
      showCover = !showCover;
      document.getElementById('txtCoverToggle').innerText = showCover ? 'ក្រប' : 'តែតារាង';
      document.querySelectorAll('.page-left').forEach(el => {
        el.style.display = showCover ? 'flex' : 'none';
      });
      document.querySelectorAll('.booklet-container').forEach(el => {
        el.style.gridTemplateColumns = showCover ? '1fr 1fr' : '1fr';
        el.style.width = showCover ? '297mm' : '160mm';
      });
      if (window.innerWidth <= 1180) {
        setFitZoom();
      }
    }

    /* =========================================================
       🌟 3.5 CUSTOM MONTH PICKER LOGIC (ដូចរូបភាព)
    ========================================================= */
    function toggleMonthPicker(e) {
      if (e) e.stopPropagation();
      closeStudentPicker();
      const pop = document.getElementById('mpPopup');
      if (pop.classList.contains('show')) { closeMonthPicker(); return; }

      const btn = document.getElementById('mpBtn');
      renderMpList();

      const r = btn.getBoundingClientRect();
      const w = 140;
      pop.style.width = w + 'px';
      pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      pop.style.top = (r.bottom + 6) + 'px';

      pop.classList.add('show');
      btn.classList.add('open');

      const act = pop.querySelector('.mp-item.active');
      if (act) {
        const list = document.getElementById('mpList');
        list.scrollTop = act.offsetTop - list.clientHeight / 2 + act.clientHeight / 2;
      }
    }

    function renderMpList() {
      const list = document.getElementById('mpList');
      const curMonth = document.getElementById('monthSelect').value;
      list.innerHTML = '';
      KHMER_MONTHS.forEach(m => {
        const item = document.createElement('div');
        item.className = 'mp-item' + (m === curMonth ? ' active' : '');
        item.innerHTML = `<span>${m}</span><i class="fa-solid fa-check"></i>`;
        item.onclick = (e) => {
          e.stopPropagation();
          chooseMonth(m);
        };
        list.appendChild(item);
      });
    }

    function chooseMonth(m) {
      document.getElementById('monthSelect').value = m;
      document.getElementById('mpLabel').textContent = m;
      closeMonthPicker();
      loadReportData();
    }

    function closeMonthPicker() {
      document.getElementById('mpPopup')?.classList.remove('show');
      document.getElementById('mpBtn')?.classList.remove('open');
    }

    /* 3.6 SEARCHABLE STUDENT PICKER */
    function updateSpLabel() {
      const sel = document.getElementById('studentSelect');
      const cur = sel.options[sel.selectedIndex];
      document.getElementById('spLabel').textContent = cur ? cur.textContent : 'ជ្រើសរើសសិស្ស';
    }

    function renderSpList(query) {
      const sel = document.getElementById('studentSelect');
      const list = document.getElementById('spList');
      const q = String(query || '').trim().toLowerCase();
      list.innerHTML = '';
      let count = 0;
      Array.from(sel.options).forEach(opt => {
        const label = opt.textContent;
        if (q && !label.toLowerCase().includes(q)) return;
        const item = document.createElement('div');
        item.className = 'sp-item' + (opt.value === sel.value ? ' active' : '');
        const span = document.createElement('span');
        span.textContent = label;
        const chk = document.createElement('i');
        chk.className = 'fa-solid fa-check';
        item.appendChild(span);
        item.appendChild(chk);
        item.addEventListener('click', () => chooseStudent(opt.value));
        list.appendChild(item);
        count++;
      });
      if (!count) {
        const empty = document.createElement('div');
        empty.className = 'sp-empty';
        empty.textContent = 'រកមិនឃើញសិស្សទេ';
        list.appendChild(empty);
      }
    }

    function chooseStudent(value) {
      const sel = document.getElementById('studentSelect');
      sel.value = value;
      updateSpLabel();
      closeStudentPicker();
      renderFilteredView();
    }

    function closeStudentPicker() {
      document.getElementById('spPopup')?.classList.remove('show');
      document.getElementById('spBtn')?.classList.remove('open');
    }

    function toggleStudentPicker(e) {
      if (e) e.stopPropagation();
      closeMonthPicker();
      const pop = document.getElementById('spPopup');
      if (pop.classList.contains('show')) { closeStudentPicker(); return; }

      const btn = document.getElementById('spBtn');
      const input = document.getElementById('spInput');
      const list = document.getElementById('spList');
      input.value = '';
      renderSpList('');

      const r = btn.getBoundingClientRect();
      const w = Math.min(Math.max(r.width, 290), window.innerWidth - 16);
      pop.style.width = w + 'px';
      pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      pop.style.top = (r.bottom + 6) + 'px';
      list.style.maxHeight = Math.max(160, Math.min(320, window.innerHeight - r.bottom - 90)) + 'px';

      pop.classList.add('show');
      btn.classList.add('open');

      const act = list.querySelector('.sp-item.active');
      if (act) list.scrollTop = act.offsetTop - list.clientHeight / 2 + act.clientHeight / 2;
      setTimeout(() => input.focus(), 30);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#spPopup') && !e.target.closest('#spBtn')) closeStudentPicker();
      if (!e.target.closest('#mpPopup') && !e.target.closest('#mpBtn')) closeMonthPicker();
    });
    document.addEventListener('keydown', (e) => { 
      if (e.key === 'Escape') {
        closeStudentPicker(); 
        closeMonthPicker();
      }
    });
    document.getElementById('controlToolbar').addEventListener('scroll', () => {
      closeStudentPicker();
      closeMonthPicker();
    });

    /* =========================================================
       4. CLASS SELECTOR (🌟 ADMIN ទើបបង្ហាញ គ្រូមិនបាច់បង្ហាញ)
    ========================================================= */
    async function initClasses() {
      const adminBox = document.getElementById('adminClassBox');
      const select = document.getElementById('classSelect');
      const cleanCls = cleanGrade(USER_CLASS);

      if (!IS_ADMIN) {
        // 🌟 បើជាគ្រូ លាក់ប្រអប់ថ្នាក់ទាំងស្រុង មិនបាច់បង្ហាញលើ Toolbar ឡើយ
        if (adminBox) adminBox.style.display = 'none';

        if (cleanCls) {
          select.innerHTML = `<option value="${cleanCls}">ថ្នាក់ទី ${cleanCls}</option>`;
          select.value = cleanCls;
          currentClassName = cleanCls;
          onClassChange();
        } else {
          document.getElementById('reportContainer').innerHTML = 
            '<div style="text-align:center; padding:50px; color:#f59e0b; font-weight:700;">⚠️ គណនីរបស់អ្នកមិនទាន់មានថ្នាក់ទទួលបន្ទុកឡើយ។ សូមទាក់ទង Admin។</div>';
        }
        return;
      }

      // 🌟 ប្រសិនបើជា Admin ទើបបង្ហាញប្រអប់ជ្រើសរើសថ្នាក់
      if (adminBox) adminBox.style.display = 'inline-flex';

      try {
        const { data, error } = await sb.from('students').select('grade');
        let classes = [];
        if (!error && data) {
          classes = [...new Set(data.map(d => cleanGrade(d.grade)).filter(Boolean))];
        }
        if (!classes.length) classes = ['១', '២', '៣', '៤(ក)', '៤(ខ)', '៥', '៦'];

        select.innerHTML = classes.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');
        if (cleanCls && classes.includes(cleanCls)) select.value = cleanCls;
        onClassChange();
      } catch (err) {
        select.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
      }
    }

    function onClassChange() {
      currentClassName = document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      if (!currentClassName) return;
      loadReportData();
    }

    /* 5. FETCH BUNDLE DATA */
    async function loadReportData() {
      const cls = currentClassName || document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      const month = document.getElementById('monthSelect').value;
      if (!cls || !month) return;

      const curPure = cleanGrade(cls);
      document.getElementById('reportContainer').innerHTML = `
        <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${curPure} (ខែ${month})...</p>
        </div>`;

      try {
        const { data: stList, error: stErr } = await sb
          .from('students')
          .select('*')
          .order('id', { ascending: true });

        if (stErr) throw stErr;

        const isSem2 = ['ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'].includes(month);
        allStudentsData = (stList || [])
          .filter(s => cleanGrade(s.grade) === curPure)
          .filter(s => {
            const drop = String(s.dropout_semester || '').trim();
            if (isSem2 && (drop.includes('ឆមាស១') || drop.includes('ឆមាសទី១') || drop === '១')) return false;
            return true;
          })
          .map(s => ({
            id: String(s.student_id || s.id),
            name: s.student_name || 'គ្មានឈ្មោះ',
            sex: s.gender || 'ប្រុស',
            dob: s.dob || '',
            pob: s.pob || '',
            address: s.address || '',
            father: s.father_name || '',
            fatherJob: s.father_job || '',
            mother: s.mother_name || '',
            motherJob: s.mother_job || '',
            guardian: s.guardian || s.father_name || s.mother_name || '',
            guardianJob: s.guardian_job || s.father_job || s.mother_job || ''
          }));

        if (!allStudentsData.length) {
          document.getElementById('reportContainer').innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
          return;
        }

        const studentIds = allStudentsData.map(s => s.id);

        const { data: scList, error: scErr } = await sb
          .from('scores')
          .select('student_id, scores, total, average, rank, grade_label')
          .eq('assigned_class', curPure)
          .eq('score_type', 'monthly')
          .eq('period', month)
          .in('student_id', studentIds);

        if (scErr) console.warn("Score fetch warning:", scErr);

        classSavedScores = {};
        (scList || []).forEach(row => {
          const sid = String(row.student_id);
          const scObj = (row.scores && typeof row.scores === 'object') ? row.scores : {};
          classSavedScores[sid] = Object.assign({}, scObj, {
            total: row.total,
            avg: row.average,
            rank: row.rank,
            grade_label: row.grade_label
          });
        });

        const now = new Date();
        const year = now.getFullYear();
        const mIdx = KHMER_MONTHS.indexOf(month);
        classAttendanceMap = {};

        if (mIdx !== -1) {
          const firstDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-01`;
          const lastDay = new Date(year, mIdx + 1, 0).getDate();
          const lastDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

          const { data: attList } = await sb
            .from('attendance')
            .select('student_id, status')
            .eq('assigned_class', curPure)
            .gte('attendance_date', firstDate)
            .lte('attendance_date', lastDate)
            .in('status', ['A', 'C']);

          (attList || []).forEach(r => {
            const sid = String(r.student_id);
            if (!classAttendanceMap[sid]) classAttendanceMap[sid] = { totalPermission: 0, totalAbsent: 0 };
            if (r.status === 'C') classAttendanceMap[sid].totalPermission++;
            if (r.status === 'A') classAttendanceMap[sid].totalAbsent++;
          });
        }

        const sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>';
        allStudentsData.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.id} - ${s.name}`;
          sSelect.appendChild(opt);
        });
        updateSpLabel();

        renderFilteredView();

      } catch (err) {
        document.getElementById('reportContainer').innerHTML = `<div style="color: #ef4444; text-align: center; padding: 40px; font-weight: 700;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

    /* 6. RENDER BOOKLET VIEW */
    function renderFilteredView() {
      const selectedSid = document.getElementById('studentSelect').value;
      const month = document.getElementById('monthSelect').value;
      const cls = currentClassName || cleanGrade(USER_CLASS);
      const container = document.getElementById('reportContainer');
      container.innerHTML = '';

      const targetList = (selectedSid === 'ALL') ? allStudentsData : allStudentsData.filter(s => s.id === selectedSid);

      if (!targetList.length) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align: center; padding: 40px; font-size: 14px; font-weight: 600;">មិនមានទិន្នន័យសិស្សឡើយ</div>';
        return;
      }

      const sortedRanks = Object.keys(classSavedScores).map(k => ({
        id: k, avg: parseFloat(classSavedScores[k].avg) || 0
      })).sort((a,b) => b.avg - a.avg);

      const rankMap = {};
      let currentR = 0, prevA = null;
      sortedRanks.forEach((r, idx) => {
        if (r.avg > 0) {
          if (r.avg !== prevA) {
            currentR = idx + 1;
            prevA = r.avg;
          }
          rankMap[r.id] = currentR;
        } else {
          rankMap[r.id] = '-';
        }
      });

      targetList.forEach((student, index) => {
        const scoreData = classSavedScores[student.id] || {};
        const attData = classAttendanceMap[student.id] || { totalPermission: 0, totalAbsent: 0 };
        const totalAbs = (attData.totalPermission || 0) + (attData.totalAbsent || 0);

        const avg = parseFloat(scoreData.avg) || 0;
        const rank = rankMap[student.id] || (scoreData.rank ? scoreData.rank : '-');
        const gradeLetter = getGradeLetter(avg);

        const booklet = document.createElement('div');
        booklet.className = 'booklet-container';
        booklet.style.gridTemplateColumns = showCover ? '1fr 1fr' : '1fr';
        booklet.style.width = showCover ? '297mm' : '160mm';

        // ================= LEFT COVER =================
        const leftPage = document.createElement('div');
        leftPage.className = 'page-box page-left';
        leftPage.style.display = showCover ? 'flex' : 'none';
        leftPage.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
            <div>
              <div class="header-text">
                <h2 class="f-moul">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                <h3 class="f-moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                <div class="header-icons">✻ ✻ ✻ 📖 ✻ ✻ ✻</div>
              </div>

              <div class="cover-title-block">
                <h2 class="f-moul">ក្រសួងអប់រំ យុវជន និងកីឡា</h2>
                <h3 class="f-moul">ការិយាល័យអប់រំ យុវជន និងកីឡា</h3>
                <h1 class="f-moul">សៀវភៅតាមដានការសិក្សា</h1>
                <h3 class="f-moul school-name">សាលាបឋមសិក្សាកំពង់ល្ពៅ</h3>
              </div>

              <div class="dotted-info-list">
                <div class="info-row">
                  <span class="info-label">ឈ្មោះសិស្ស:</span>
                  <span class="info-dots" style="max-width: 155px; font-weight: bold;">${student.name || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ភេទ:</span>
                  <span class="info-dots" style="max-width: 60px;">${student.sex || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ថ្នាក់:</span>
                  <span class="info-dots">ថ្នាក់ទី ${cls}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អត្តលេខ:</span>
                  <span class="info-dots" style="max-width: 80px;">${student.id || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">ថ្ងៃ ខែ ឆ្នាំកំណើត:</span>
                  <span class="info-dots">${student.dob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ទីកន្លែងកំណើត:</span>
                  <span class="info-dots">${student.pob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ឪពុកឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.father || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.fatherJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">ម្តាយឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.mother || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.motherJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អាណាព្យាបាលឈ្មោះ:</span>
                  <span class="info-dots" style="max-width: 155px;">${student.guardian || ''}</span>
                  <span class="info-label" style="margin-left: 10px;">មុខរបរ:</span>
                  <span class="info-dots">${student.guardianJob || ''}</span>
                </div>

                <div class="info-row">
                  <span class="info-label">អាសយដ្ឋានបច្ចុប្បន្ន:</span>
                  <span class="info-dots">${student.address || ''}</span>
                </div>
              </div>
            </div>

            <div class="cover-footer f-moul">
              ឆ្នាំសិក្សា ២០២៦-២០២៧
            </div>
          </div>
        `;

        // ================= RIGHT REPORT =================
        let tableRowsHtml = '';
        SUBJECTS.forEach(sub => {
          const rawVal = scoreData[sub.key];
          const val = (rawVal !== undefined && rawVal !== null && rawVal !== '') ? Number(rawVal) : null;
          const sGrade = val !== null ? (val <= 0 ? 'F' : getGradeLetter(val)) : '';

          function getCellContent(gradeCode) {
            if (sGrade !== gradeCode || val === null) return '';
            return displayMode === 'tick' ? '✔' : val.toFixed(val % 1 === 0 ? 0 : 1);
          }

          tableRowsHtml += `
            <tr>
              <td class="subject-name">${sub.label}</td>
              <td class="val-cell">${getCellContent('A')}</td>
              <td class="val-cell">${getCellContent('B')}</td>
              <td class="val-cell">${getCellContent('C')}</td>
              <td class="val-cell">${getCellContent('D')}</td>
              <td class="val-cell">${getCellContent('E')}</td>
              <td class="val-cell">${getCellContent('F')}</td>
              <td class="val-cell">${(val !== null && val < 5) ? '✔' : ''}</td>
            </tr>
          `;
        });

        const rightPage = document.createElement('div');
        rightPage.className = 'page-box page-right';
        rightPage.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            <div>
              <div class="header-text">
                <h2 class="f-moul" style="font-size: 16px;">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                <h3 class="f-moul" style="font-size: 14.5px;">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
              </div>

              <div class="report-meta-grid">
                <div class="f-bold" style="grid-column: span 2; font-size: 13.5px;">ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
                <div style="grid-column: span 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
                  <div class="f-bold">ថ្នាក់ទី ${cls}</div>
                  <div class="f-bold" style="text-align: center; white-space: nowrap;">លទ្ធផលនៃការសិក្សាប្រចាំខែ${month}</div>
                  <div></div>
                </div>
                <div style="grid-column: span 2; display: flex; justify-content: space-between; margin-top: 2px;">
                  <span>លេខរៀងទី: <strong class="f-bold">${toKhmerNum(index + 1)}</strong></span>
                  <span>សិស្សឈ្មោះ: <strong class="f-bold">${student.name}</strong></span>
                  <span>ភេទ: <strong class="f-bold">${student.sex}</strong></span>
                  <span>អត្តលេខ: <strong class="f-bold">${student.id}</strong></span>
                </div>
              </div>

              <table class="score-table">
                <thead>
                  <tr>
                    <th rowspan="2" style="width: 29%; font-size: 13px;">មុខវិជ្ជា</th>
                    <th colspan="6" style="font-size: 13px;">និទ្ទេស</th>
                    <th rowspan="2" style="width: 18.2%; font-size: 11px; line-height: 1.25;">ចំណុចដែលត្រូវ<br>ជួយពង្រឹងបន្ថែម</th>
                  </tr>
                  <tr>
                    <th class="th-grade">A<br><span class="grade-range">9.00-10</span></th>
                    <th class="th-grade">B<br><span class="grade-range">8.00-8.99</span></th>
                    <th class="th-grade">C<br><span class="grade-range">7.00-7.99</span></th>
                    <th class="th-grade">D<br><span class="grade-range">6.00-6.99</span></th>
                    <th class="th-grade">E<br><span class="grade-range">5.00-5.99</span></th>
                    <th class="th-grade">F<br><span class="grade-range">4.99-0</span></th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>

              <div class="summary-text">
                <div class="summary-row">
                  <span>-មធ្យមភាគ <strong class="f-bold">${avg > 0 ? avg.toFixed(2) : '-'}</strong></span>
                  <span>-ចំណាត់ថ្នាក់ <strong class="f-bold">${rank !== '-' ? toKhmerNum(rank) : '-'}</strong></span>
                  <span>-និទ្ទេស <strong class="f-bold">${gradeLetter || '-'}</strong></span>
                  <span>អវត្តមាន: ឥត.ច្បាប់ <strong class="f-bold">${toKhmerNum(attData.totalAbsent || 0)}</strong> - ម.ច្បាប់ <strong class="f-bold">${toKhmerNum(attData.totalPermission || 0)}</strong> - សរុប <strong class="f-bold">${toKhmerNum(totalAbs)}</strong></span>
                </div>
                <div style="margin-top: 2px;">
                  វិន័យនិងសីលធម៌: ............................................................................................................
                </div>
              </div>
            </div>

            <div class="signature-grid">
              <div class="sig-col" style="margin-top: 30px;">
                <div>
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="f-bold" style="margin-top: 3px;">នាយកសាលា</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-title">មតិរបស់មាតាបិតា</div>
                  <div class="f-bold" style="margin-top: 3px;">ឬអាណាព្យាបាលសិស្ស</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-lunar">ថ្ងៃ.................... .... ខែ.......... ឆ្នាំ........... ព.ស. ២៥៧០</div>
                  <div class="sig-solar">ត្រូវនឹងថ្ងៃទី...... ខែ${month} ឆ្នាំ ២០២៦</div>
                  <div class="sig-title" style="margin-top: 3px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
                </div>
                <div class="sig-name">${TEACHER_NAME || ''}</div>
              </div>
            </div>
          </div>
        `;

        booklet.appendChild(leftPage);
        booklet.appendChild(rightPage);
        container.appendChild(booklet);
      });
    }

    function getGradeLetter(num) {
      if (num === null || isNaN(num) || num <= 0) return '';
      if (num >= 9.00) return 'A';
      if (num >= 8.00) return 'B';
      if (num >= 7.00) return 'C';
      if (num >= 6.00) return 'D';
      if (num >= 5.00) return 'E';
      return 'F';
    }
  </script>
</body>
</html>
