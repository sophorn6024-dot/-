<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>សៀវភៅតាមដានការសិក្សា</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.95);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.94);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ SMART RESPONSIVE TOOLBAR DESIGN
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .form-control {
      padding: 5px 8px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 32px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12.5px;
      height: 32px;
      white-space: nowrap;
      user-select: none;
    }

    .btn {
      padding: 5px 12px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 32px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: var(--ctrl-group-bg);
      color: var(--text-main);
      border-color: var(--input-border);
    }
    .btn-secondary:hover {
      border-color: var(--input-focus);
      color: var(--input-focus);
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }
    .btn-purple {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
    }
    .btn-toggle {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    }

    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--ctrl-group-bg);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--tb-border);
      height: 32px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
      height: 26px;
      display: flex;
      align-items: center;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
    }

    /* =========================================================
       📱 SMART RESPONSIVE FOR MOBILE SCREENS
    ========================================================= */
    @media screen and (max-width: 768px) {
      body { padding-bottom: 70px; }
      .no-print-bar { padding: 8px 10px; gap: 6px; }
      .toolbar-row { gap: 6px; }

      .toolbar-filters-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        width: 100%;
      }
      .toolbar-filters-grid .panel-pill-box {
        width: 100%;
        padding: 3px 6px;
        justify-content: space-between;
      }
      .toolbar-filters-grid .form-control {
        width: 100%;
        min-width: 0 !important;
        flex: 1;
        height: 28px;
        font-size: 11.5px;
        padding: 2px 5px;
      }
      .toolbar-filters-grid .teacher-class-badge {
        width: 100%;
        justify-content: center;
        height: 28px;
        font-size: 11.5px;
        padding: 2px 6px;
      }
      .toolbar-label { font-size: 11px; gap: 4px; }
      .toolbar-label i { font-size: 10px; }

      .student-filter-wrap {
        grid-column: 1 / -1;
      }

      .toolbar-actions-grid {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .toolbar-actions-grid::-webkit-scrollbar { display: none; }
      
      .btn {
        height: 28px;
        padding: 3px 8px;
        font-size: 11px;
        gap: 4px;
        border-radius: 6px;
      }
      .zoom-btn-group { height: 28px; }
      .zoom-btn { height: 24px; padding: 2px 6px; font-size: 10.5px; }

      .preview-wrapper {
        padding: 10px 4px;
        gap: 15px;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* =========================================================
       📄 BOOKLET PREVIEW (សៀវភៅតាមដានការសិក្សា)
    ========================================================= */
    .preview-wrapper {
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      transition: zoom 0.2s ease;
      transform-origin: top center;
    }

    .booklet-container {
      background: #ffffff !important;
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      min-height: 210mm;
      padding: 6mm 7.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      page-break-after: always;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy);
      padding: 13px 18px 10px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      background: #ffffff !important;
      color: var(--navy) !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14.5px; letter-spacing: 6px; color: var(--red-star); margin: 2px 0 4px 0; }

    .cover-title-block { text-align: center; margin: 10px 0 8px 0; color: var(--navy); }
    .cover-title-block h2 { font-size: 17px; margin-bottom: 3px; }
    .cover-title-block h3 { font-size: 15.5px; margin-bottom: 6px; }
    .cover-title-block h1 { font-size: 29px; margin: 8px 0; letter-spacing: 0.5px; line-height: 1.35; }
    .cover-title-block .school-name { font-size: 16.5px; margin-top: 5px; }

    .dotted-info-list {
      margin: 14px 0 8px 0;
      display: flex;
      flex-direction: column;
      gap: 15.5px;
      font-size: 15.5px;
    }
    .info-row { display: flex; align-items: flex-end; width: 100%; }
    .info-label { white-space: nowrap; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; color: var(--navy); font-weight: bold; font-size: 15.5px; }
    .info-dots {
      flex: 1; border-bottom: 1.5px dotted #132d56; margin-left: 6px; padding-left: 6px; min-height: 23px;
      color: #0f172a; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-size: 15.5px;
    }

    .cover-footer { text-align: center; font-size: 21px; color: var(--navy); margin-top: 6px; margin-bottom: 2px; }

    .report-meta-grid {
      display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; margin: 2px 0 4px 0; font-size: 13.5px; color: var(--navy);
    }

    .score-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      margin-bottom: 3px; 
      border: 1.4px solid var(--navy) !important; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .score-table th, .score-table td { 
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 0.5px; 
      height: 22px; 
      vertical-align: middle; 
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .score-table th { 
      background-color: #f8fafc !important; 
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; 
      font-weight: bold; 
      color: var(--navy) !important; 
      font-size: 13.5px; 
    }
    .score-table td.subject-name {
      text-align: left; padding-left: 7px; font-size: 13px; color: var(--navy) !important;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-table .val-cell {
      font-weight: bold; color: var(--navy) !important; font-size: 15.5px; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }

    .th-grade { width: 8.8%; white-space: nowrap; padding: 1px 0 !important; }
    .grade-range { font-size: 8.8px; font-weight: normal; white-space: nowrap; display: inline-block; letter-spacing: -0.3px; font-family: 'Arial', 'Kantumruy Pro', sans-serif; line-height: 1.1; }

    .summary-text { font-size: 12.5px; margin-top: 3px; line-height: 1.45; color: var(--navy); }
    .summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; }

    .signature-grid {
      display: grid; grid-template-columns: 1.25fr 1.05fr 1.4fr; text-align: center; font-size: 12px; margin-top: 14px; align-items: start; color: var(--navy);
    }
    .sig-col { display: flex; flex-direction: column; align-items: center; }
    .sig-lunar { font-size: 9px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; line-height: 1.25; white-space: nowrap; }
    .sig-solar { font-size: 9.5px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; margin-bottom: 2px; line-height: 1.25; white-space: nowrap; }
    .sig-title { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-size: 11.5px; color: var(--navy); white-space: nowrap; }
    .sig-name { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; font-size: 13.5px; margin-top: 38px; white-space: nowrap; }

    /* =========================================================
       🖨️ PRINT RULES (A4 LANDSCAPE)
    ========================================================= */
    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .booklet-container {
        box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important;
        max-height: 210mm !important; min-height: 210mm !important; padding: 6mm 7.5mm !important;
        page-break-after: always !important; break-after: page !important; page-break-inside: avoid !important;
        border-radius: 0 !important;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ -->
  <div class="auth-wrapper" id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីមើលសៀវភៅតាមដានការសិក្សា។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម (Login)</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       🎛️ NEW RESPONSIVE TOOLBAR DESIGN
  ========================================================= -->
  <div class="no-print-bar" id="controlToolbar" style="display:none;">
    
    <!-- ជួរទី ១ ៖ ប្រអប់ចម្រោះ (Filters Grid លើ Mobile) -->
    <div class="toolbar-row">
      <div class="toolbar-filters-grid">
        
        <!-- ថ្នាក់ -->
        <div class="panel-pill-box" id="adminClassBox" style="display:none;">
          <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
          <select id="classSelect" class="form-control" onchange="onClassChange()">
            <option value="">កំពុងទាញយក...</option>
          </select>
        </div>

        <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span id="teacherClassText">ថ្នាក់ទី...</span>
        </div>

        <!-- ខែ -->
        <div class="panel-pill-box">
          <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> ខែ៖</span>
          <select id="monthSelect" class="form-control" onchange="loadReportData()">
            <option value="មករា">មករា</option><option value="កុម្ភៈ">កុម្ភៈ</option>
            <option value="មីនា">មីនា</option><option value="មេសា">មេសា</option>
            <option value="ឧសភា">ឧសភា</option><option value="មិថុនា">មិថុនា</option>
            <option value="កក្កដា">កក្កដា</option><option value="សីហា">សីហា</option>
            <option value="កញ្ញា">កញ្ញា</option><option value="តុលា">តុលា</option>
            <option value="វិច្ឆិកា">វិច្ឆិកា</option><option value="ធ្នូ">ធ្នូ</option>
          </select>
        </div>

        <!-- សិស្ស (Full-width on mobile) -->
        <div class="panel-pill-box student-filter-wrap">
          <span class="toolbar-label"><i class="fa-solid fa-user" style="color:#10b981;"></i> សិស្ស៖</span>
          <select id="studentSelect" class="form-control" onchange="renderFilteredView()">
            <option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>
          </select>
        </div>

      </div>
    </div>

    <!-- ជួរទី ២ ៖ ប៊ូតុងបញ្ជា & Zoom (Scrollable row on mobile) -->
    <div class="toolbar-row">
      <div class="toolbar-actions-grid">
        
        <button class="btn btn-secondary" onclick="window.history.back()" title="ត្រឡប់ក្រោយ">
          <i class="fa-solid fa-arrow-left"></i> <span>ត្រឡប់</span>
        </button>

        <button class="btn btn-toggle" id="btnDisplayMode" onclick="toggleDisplayMode()">
          <i class="fa-solid fa-font"></i> <span id="txtDisplayMode">ធីក</span>
        </button>

        <button class="btn btn-purple" id="btnCoverToggle" onclick="toggleCover()">
          <i class="fa-solid fa-book-open"></i> <span id="txtCoverToggle">ក្រប</span>
        </button>

        <!-- 🔍 Zoom Buttons (មានប៊ូតុង សម / Fit សម្រាប់ទូរស័ព្ទ) -->
        <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំ">

    async function loadReportData() {
      const cls = currentClassName || document.getElementById('classSelect').value || cleanGrade(USER_CLASS);

      if (!cls || !month) return;

      const curPure = cleanGrade(cls);

      try {
        const { data: stList, error: stErr } = await sb
          .from('students')

        if (stErr) throw stErr;

        const isSem2 = ['ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'].includes(month);

          .filter(s => cleanGrade(s.grade) === curPure)
          .filter(s => {
            const drop = String(s.dropout_semester || '').trim();
            if (isSem2 && (drop.includes('ឆមាស១') || drop.includes('ឆមាសទី១') || drop === '១')) return false;
            return true;
          })
          .map(s => ({
            id: String(s.student_id || s.id),
            name: s.student_name || 'គ្មានឈ្មោះ',
            sex: s.gender || 'ប្រុស',
            dob: s.dob || '',
            pob: s.pob || '',
            address: s.address || '',
            father: s.father_name || '',
            fatherJob: s.father_job || '',
            mother: s.mother_name || '',
            motherJob: s.mother_job || '',
            guardian: s.guardian || s.father_name || s.mother_name || '',
            guardianJob: s.guardian_job || s.father_job || s.mother_job || ''
          }));

        if (!allStudentsData.length) {
          document.getElementById('reportContainer').innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
          return;
        }

        const studentIds = allStudentsData.map(s => s.id);

        const { data: scList, error: scErr } = await sb
          .from('scores')
          .select('student_id, scores, total, average, rank, grade_label')
          .eq('assigned_class', curPure)
          .eq('score_type', 'monthly')
          .eq('period', month)
          .in('student_id', studentIds);

        if (scErr) console.warn("Score fetch warning:", scErr);

        classSavedScores = {};
        (scList || []).forEach(row => {
          const sid = String(row.student_id);
          const scObj = (row.scores && typeof row.scores === 'object') ? row.scores : {};
          classSavedScores[sid] = Object.assign({}, scObj, {
            total: row.total,
            avg: row.average,
            rank: row.rank,
            grade_label: row.grade_label
          });
        });

        const now = new Date();
        const year = now.getFullYear();
        const mIdx = KHMER_MONTHS.indexOf(month);
        classAttendanceMap = {};

        if (mIdx !== -1) {
          const firstDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-01`;
          const lastDay = new Date(year, mIdx + 1, 0).getDate();
          const lastDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

          const { data: attList } = await sb
            .from('attendance')
            .select('student_id, status')
            .eq('assigned_class', curPure)
            .gte('attendance_date', firstDate)
            .lte('attendance_date', lastDate)
            .in('status', ['A', 'C']);

          (attList || []).forEach(r => {
            const sid = String(r.student_id);
            if (!classAttendanceMap[sid]) classAttendanceMap[sid] = { totalPermission: 0, totalAbsent: 0 };
            if (r.status === 'C') classAttendanceMap[sid].totalPermission++;
            if (r.status === 'A') classAttendanceMap[sid].totalAbsent++;
          });
        }

        const sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>';
        allStudentsData.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.id} - ${s.name}`;
          sSelect.appendChild(opt);
        });

        renderFilteredView();

      } catch (err) {
        document.getElementById('reportContainer').innerHTML = `<div style="color: #ef4444; text-align: center; padding: 40px; font-weight: 700;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

            </div>

            <div class="cover-footer f-moul">
              ឆ្នាំសិក្សា ២០២៦-២០២៧
            </div>
          </div>
        `;

        // ================= RIGHT REPORT =================
        let tableRowsHtml = '';
        SUBJECTS.forEach(sub => {
          const rawVal = scoreData[sub.key];
          const val = (rawVal !== undefined && rawVal !== null && rawVal !== '') ? Number(rawVal) : null;
          const sGrade = val !== null ? getGradeLetter(val) : '';

          function getCellContent(gradeCode) {
            if (sGrade !== gradeCode || val === null) return '';
            return displayMode === 'tick' ? '✔' : val.toFixed(val % 1 === 0 ? 0 : 1);
          }

          tableRowsHtml += `
            <tr>
              <td class="subject-name">${sub.label}</td>
              <td class="val-cell">${getCellContent('A')}</td>
              <td class="val-cell">${getCellContent('B')}</td>
              <td class="val-cell">${getCellContent('C')}</td>
              <td class="val-cell">${getCellContent('D')}</td>
              <td class="val-cell">${getCellContent('E')}</td>
              <td class="val-cell">${getCellContent('F')}</td>
              <td></td>
            </tr>
          `;
        });

        const rightPage = document.createElement('div');
        rightPage.className = 'page-box page-right';
        rightPage.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            <div>
              <div class="header-text">
                <h2 class="f-moul" style="font-size: 16px;">ព្រះរាជាណាចក្រកម្ពុជា</h2>
                <h3 class="f-moul" style="font-size: 14.5px;">ជាតិ សាសនា ព្រះមហាក្សត្រ</h3>
                <div class="f-bold" style="font-size: 13.5px; margin-top: 1px;">ការិយាល័យអប់រំ យុវជន និងកីឡា</div>
              </div>

              <div class="report-meta-grid">
                <div class="f-bold">ថ្នាក់ទី ${cls}</div>
                <div class="f-bold" style="text-align: right;">លទ្ធផលនៃការសិក្សាប្រចាំខែ${month}</div>
                <div style="grid-column: span 2; display: flex; justify-content: space-between; margin-top: 2px;">
                  <span>លេខរៀងទី: <strong class="f-bold">${toKhmerNum(index + 1)}</strong></span>
                  <span>សិស្សឈ្មោះ: <strong class="f-bold">${student.name}</strong></span>
                  <span>ភេទ: <strong class="f-bold">${student.sex}</strong></span>
                  <span>អត្តលេខ: <strong class="f-bold">${student.id}</strong></span>
                </div>
              </div>

              <table class="score-table">
                <thead>
                  <tr>
                    <th rowspan="2" style="width: 29%; font-size: 13px;">មុខវិជ្ជា</th>
                    <th colspan="6" style="font-size: 13px;">និទ្ទេស</th>
                    <th rowspan="2" style="width: 18.2%; font-size: 11px; line-height: 1.25;">ចំណុចដែលត្រូវ<br>ជួយពង្រឹងបន្ថែម</th>
                  </tr>
                  <tr>
                    <th class="th-grade">A<br><span class="grade-range">9.00-10</span></th>
                    <th class="th-grade">B<br><span class="grade-range">8.00-8.99</span></th>
                    <th class="th-grade">C<br><span class="grade-range">7.00-7.99</span></th>
                    <th class="th-grade">D<br><span class="grade-range">6.00-6.99</span></th>
                    <th class="th-grade">E<br><span class="grade-range">5.00-5.99</span></th>
                    <th class="th-grade">F<br><span class="grade-range">4.99-0</span></th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>

              <div class="summary-text">
                <div class="summary-row">
                  <span>-មធ្យមភាគ <strong class="f-bold">${avg > 0 ? avg.toFixed(2) : '-'}</strong></span>
                  <span>-ចំណាត់ថ្នាក់ <strong class="f-bold">${rank !== '-' ? toKhmerNum(rank) : '-'}</strong></span>
                  <span>-និទ្ទេស <strong class="f-bold">${gradeLetter || '-'}</strong></span>
                  <span>អវត្តមាន: ឥត.ច្បាប់ <strong class="f-bold">${toKhmerNum(attData.totalAbsent || 0)}</strong> - ម.ច្បាប់ <strong class="f-bold">${toKhmerNum(attData.totalPermission || 0)}</strong> - សរុប <strong class="f-bold">${toKhmerNum(totalAbs)}</strong></span>
                </div>
                <div style="margin-top: 2px;">
                  វិន័យនិងសីលធម៌: ............................................................................................................
                </div>
              </div>
            </div>

            <div class="signature-grid">
              <div class="sig-col">
                <div>
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="f-bold" style="margin-top: 3px;">នាយកសាលា</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-title">មតិរបស់មាតាបិតា</div>
                  <div class="f-bold" style="margin-top: 3px;">ឬអាណាព្យាបាលសិស្ស</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-lunar">ថ្ងៃ.................... .... ខែ.......... ឆ្នាំ........... ព.ស. ២៥៧០</div>
                  <div class="sig-solar">ត្រូវនឹងថ្ងៃទី...... ខែ${month} ឆ្នាំ ២០២៦</div>
                  <div class="sig-title" style="margin-top: 3px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
                </div>
                <div class="sig-name">${TEACHER_NAME || ''}</div>
              </div>
            </div>
          </div>
        `;

        booklet.appendChild(leftPage);
        booklet.appendChild(rightPage);
        container.appendChild(booklet);
      });
    }

    function getGradeLetter(num) {
      if (num === null || isNaN(num) || num <= 0) return '';
      if (num >= 9.00) return 'A';
      if (num >= 8.00) return 'B';
      if (num >= 7.00) return 'C';
      if (num >= 6.00) return 'D';
      if (num >= 5.00) return 'E';
      return 'F';
    }
  </script>
</body>
</html>
