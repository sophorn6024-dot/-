<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>សៀវភៅសិក្ខាគារិក</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', sans-serif; font-weight: 400; }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ SLEEK SINGLE-ROW TOOLBAR (សន្សំទំហំ & ស្អាតលើ TABLET)
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }
    .no-print-bar::-webkit-scrollbar { height: 3px; }
    .no-print-bar::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.25); border-radius: 3px; }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 9px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .form-control {
      padding: 4px 7px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 30px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 12px;
      height: 30px;
      white-space: nowrap;
      user-select: none;
    }

    .btn {
      padding: 4px 10px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 30px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 7px rgba(2, 132, 199, 0.25);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 7px rgba(16, 185, 129, 0.25);
    }

    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--ctrl-group-bg);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--tb-border);
      height: 30px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Kantumruy Pro', sans-serif;
      height: 24px;
      display: flex;
      align-items: center;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 1px 5px rgba(2, 132, 199, 0.35);
    }

    /* =========================================================
       📱 TABLET & MOBILE RESPONSIVE TWEAKS
    ========================================================= */
    @media screen and (min-width: 769px) and (max-width: 1180px) {
      .no-print-bar { padding: 8px 16px; gap: 8px; }
      .panel-pill-box { padding: 3px 8px; }
      .form-control, .btn { height: 32px; font-size: 12.5px; }
      .zoom-btn-group { height: 32px; }
      .zoom-btn { height: 26px; font-size: 11.5px; }
      .preview-wrapper { padding: 14px 10px; gap: 18px; }
    }

    @media screen and (max-width: 768px) {
      body { padding-bottom: 40px; }
      .no-print-bar { padding: 6px 10px; gap: 6px; }
      .tb-group { gap: 4px; }
      .panel-pill-box { padding: 2px 6px; }
      .form-control { height: 28px; font-size: 11px; padding: 2px 5px; }
      .btn { height: 28px; padding: 2px 7px; font-size: 11px; gap: 4px; }
      .zoom-btn-group { height: 28px; }
      .zoom-btn { height: 22px; padding: 1px 5px; font-size: 10px; }
      .preview-wrapper {
        padding: 10px 4px; gap: 14px; width: 100%;
        overflow-x: auto; -webkit-overflow-scrolling: touch;
      }
    }

    /* =========================================================
       📄 A4 BOOKLET PREVIEW (សៀវភៅសិក្ខាគារិក)
    ========================================================= */
    .preview-wrapper {
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transition: zoom 0.2s ease;
      transform-origin: top center;
    }

    .sheet-page {
      background: #ffffff !important; 
      color: var(--navy) !important;
      width: 297mm; 
      height: 210mm; 
      max-height: 210mm;
      padding: 6mm 7.5mm; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35); 
      page-break-after: always; 
      position: relative; 
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy); 
      padding: 14px 18px 12px 18px; 
      display: flex;
      flex-direction: column; 
      justify-content: space-between; 
      height: 100%; 
      position: relative;
      background: #ffffff !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14px; letter-spacing: 6px; color: var(--red-star); margin: 3px 0 5px 0; }

    .dotted-row { display: flex; align-items: flex-end; width: 100%; margin-bottom: 12px; font-size: 15px; }
    .dotted-label { white-space: nowrap; font-weight: bold; font-size: 15px; }
    .dotted-space { flex: 1; border-bottom: 1.5px dotted var(--navy); margin-left: 6px; padding-left: 6px; min-height: 23px; font-weight: bold; font-size: 15px; }

    .cover-info-block {
      margin: 30px 0 20px 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .cover-dotted-row { display: flex; align-items: flex-end; width: 100%; font-size: 16px; }
    .cover-dotted-label { white-space: nowrap; font-weight: bold; font-size: 16px; }
    .cover-dotted-space {
      flex: 1; border-bottom: 1.6px dotted var(--navy); margin-left: 6px; padding-left: 6px; min-height: 26px; font-weight: bold; font-size: 16px;
    }

    /* ── Table Styling ── */
    .custom-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      border: 1.35px solid var(--navy) !important; 
      margin-bottom: 3px; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .custom-table th, .custom-table td {
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 2px; 
      height: 21.5px; 
      vertical-align: middle;
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .custom-table th { background: #f8fafc !important; font-weight: bold; font-size: 13.5px; }
    .custom-table td.text-left { text-align: left; padding-left: 7px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .red-bold { color: #dc2626 !important; font-weight: bold; font-size: 13.5px; }

    .sig-block { display: flex; justify-content: flex-end; margin-top: 6px; }
    .sig-inner { text-align: center; min-width: 180px; }

    /* =========================================================
       🖨️ PRINT RULES (A4 LANDSCAPE)
    ========================================================= */
    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }
      .no-print-bar { display: none !important; }
      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .sheet-page {
        box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important;
        padding: 6mm 7.5mm !important; page-break-after: always !important; break-after: page !important;
        page-break-inside: avoid !important; border-radius: 0 !important;
      }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ -->
  <div class="auth-wrapper" id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីមើលសៀវភៅសិក្ខាគារិក។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម (Login)</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       🎛️ NEW SINGLE-ROW SLEEK TOOLBAR DESIGN
  ========================================================= -->
  <div class="no-print-bar" id="controlToolbar" style="display:none;">
    
    <!-- ផ្នែកខាងឆ្វេង ៖ Filters -->
    <div class="tb-group">
      <!-- ថ្នាក់ -->
      <div class="panel-pill-box" id="adminClassBox" style="display:none;">
        <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
        <select id="classSelect" class="form-control" onchange="onClassSelectChange()">
          <option value="">កំពុងទាញយក...</option>
        </select>
      </div>

      <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span id="teacherClassText">ថ្នាក់ទី...</span>
      </div>

      <!-- សិស្ស -->
      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-user" style="color:#10b981;"></i> សិស្ស៖</span>
        <select id="studentSelect" class="form-control" style="min-width:130px; max-width:180px;" onchange="renderSemesterView()">
          <option value="ALL">🏫 ទាំងថ្នាក់</option>
        </select>
      </div>

      <!-- សន្លឹក -->
      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-file-lines" style="color:#f59e0b;"></i> សន្លឹក៖</span>
        <select id="sheetFilterSelect" class="form-control" onchange="renderSemesterView()">
          <option value="ALL">ទាំងអស់ (៣ សន្លឹក)</option>
          <option value="1">សន្លឹកទី១ (ក្របក្រៅ)</option>
          <option value="2">សន្លឹកទី២ (ក្របក្នុង)</option>
          <option value="3" selected>សន្លឹកទី៣ (លទ្ធផលប្រឡង)</option>
        </select>
      </div>
    </div>

    <!-- ផ្នែកខាងស្តាំ ៖ Zoom & Action Buttons -->
    <div class="tb-group">
      <!-- 🔍 Zoom Buttons -->
      <div class="zoom-btn-group" title="ពង្រីក/បង្រួមទំហំ">
        <button type="button" class="zoom-btn active" id="zFit" onclick="setFitZoom()">សម</button>
        <button type="button" class="zoom-btn" id="z75" onclick="setZoom(0.75, 'z75')">75%</button>
        <button type="button" class="zoom-btn" id="z100" onclick="setZoom(1, 'z100')">100%</button>
      </div>

      <button class="btn btn-primary" onclick="loadSemesterData()" title="ទាញយកទិន្នន័យឡើងវិញ">
        <i class="fa-solid fa-rotate"></i> <span>ផ្ទុកឡើងវិញ</span>
      </button>

      <button class="btn btn-success" onclick="doPrint()" title="បោះពុម្ពសៀវភៅសិក្ខាគារិក">
        <i class="fa-solid fa-print"></i> <span>បោះពុម្ព</span>
      </button>
    </div>

  </div>

  <!-- =========================================================
       📄 A4 BOOKLET PREVIEW CONTAINER
  ========================================================= -->
  <div class="preview-wrapper" id="semesterContainer" style="display:none;">
    <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
      <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យសៀវភៅសិក្ខាគារិក...</p>
    </div>
  </div>

  <!-- =========================================================
       ⚙️ JAVASCRIPT ENGINE (SUPABASE INTEGRATED)
  ========================================================= -->
  <script>
    /* 1. SUPABASE CLIENT CONFIG */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* 2. AUTH GUARD */
    function readSession() {
      try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
    }
    const CURRENT_USER = readSession();

    function checkAuthentication() {
      if (!CURRENT_USER || !CURRENT_USER.username) {
        document.getElementById('controlToolbar').style.display = 'none';
        document.getElementById('semesterContainer').style.display = 'none';
        document.getElementById('authDeniedWrap').style.display = 'flex';
        return false;
      }
      document.getElementById('authDeniedWrap').style.display = 'none';
      document.getElementById('controlToolbar').style.display = 'flex';
      document.getElementById('semesterContainer').style.display = 'flex';
      return true;
    }

    function goToIndex(e) {
      if (e) e.preventDefault();
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'OPEN_LOGIN', action: 'LOGIN' }, '*');
          window.parent.location.href = 'index.html';
          return;
        } catch(err) {}
      }
      window.location.href = 'index.html';
    }

    const USER_ROLE    = CURRENT_USER?.role || "teacher";
    const USER_CLASS   = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
    const TEACHER_NAME = CURRENT_USER?.teacher_name || "";
    const IS_ADMIN     = String(USER_ROLE).toLowerCase().trim() === 'admin';

    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
    function cleanGrade(g) { return String(g || '').replace(/^ថ្នាក់ទី\s*/, '').trim(); }
    function toKhmerNum(num) {
      if (num === null || num === undefined) return '';
      return num.toString().replace(/\d/g, d => KHMER_DIGITS[parseInt(d)] !== undefined ? KHMER_DIGITS[parseInt(d)] : d);
    }

    function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme || 'dark'); }
    applyTheme(localStorage.getItem('krou_theme_manual') || 'dark');
    window.addEventListener('message', e => { if (e.data && (e.data.type === 'THEME_CHANGE' || e.data.theme)) applyTheme(e.data.theme || e.data); });

    /* 3. SEMESTER SUBJECT LIST */
    const SEMESTER_SUBJECTS = [
      { key: 'read',      label: 'អំណាន' },
      { key: 'listen',    label: 'ស្តាប់ និងនិយាយ' },
      { key: 'dictation', label: 'សរសេរតាមអាន' },
      { key: 'essay',     label: 'តែងសេចក្តី' },

    function setFitZoom() {
      const screenW = window.innerWidth;
      const targetW = 1125; // 297mm Landscape Booklet Width
      let scale = (screenW - 20) / targetW;
      if (scale > 1) scale = 1;
      if (scale < 0.28) scale = 0.28;
      setZoom(scale, 'zFit');
    }

    // ── COMPETITION RANKING HELPER ──
    function computeCompetitionRanks(items) {
      const valid = items.filter(x => x.val !== '' && x.val !== null && !isNaN(Number(x.val)));
      valid.sort((a, b) => Number(b.val) - Number(a.val));
      const ranks = {};
      let curRank = 1;
      for (let i = 0; i < valid.length; i++) {
        if (i > 0 && Number(valid[i].val) < Number(valid[i - 1].val)) {
          curRank = i + 1;
        }
        ranks[String(valid[i].id).trim()] = curRank;
      }
      return ranks;
    }

    function getGradeFromAverage(avg) {
      const n = Number(avg);
      if (!Number.isFinite(n) || n <= 0) return '-';
      if (n >= 9.00) return 'A';
      if (n >= 8.00) return 'B';
      if (n >= 7.00) return 'C';
      if (n >= 6.00) return 'D';
      if (n >= 5.00) return 'E';
      return 'F';
    }

    /* 5. FETCH SEMESTER DATA BUNDLE FROM SUPABASE */
    async function loadSemesterData() {
      const cls = document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      const curPure = cleanGrade(cls);
      const container = document.getElementById('semesterContainer');

      if (!curPure) return;

      container.innerHTML = `
        <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${curPure}...</p>
        </div>`;

      try {
        // ក. ទាញយកសិស្សក្នុងថ្នាក់
        const { data: stList, error: stErr } = await sb
          .from('students')
          .select('*')
          .order('id', { ascending: true });

        if (stErr) throw stErr;

        const students = (stList || [])
          .filter(s => cleanGrade(s.grade) === curPure)
          .map(s => ({
            id: String(s.student_id || s.id),
            name: s.student_name || 'គ្មានឈ្មោះ',
            sex: s.gender || 'ប្រុស',
            dob: s.dob || '',
            pob: s.pob || '',
            address: s.address || '',
            father: s.father_name || '',
            fatherJob: s.father_job || '',
            mother: s.mother_name || '',
            motherJob: s.mother_job || ''
          }));

        if (!students.length) {
          container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
          return;
        }

        const studentIds = students.map(s => s.id);

        // ខ. ទាញយកពិន្ទុប្រឡងឆមាសទី១ និងទី២
        const { data: scData, error: scErr } = await sb
          .from('scores')
          .select('student_id, score_type, period, scores, total, average, rank, grade_label')
          .eq('assigned_class', curPure)
          .in('student_id', studentIds);

        if (scErr) console.warn("Scores error:", scErr);

        const sem1Scores = {}, sem2Scores = {};
        const sem1RankMap = {}, sem2RankMap = {}, yearRankMap = {};
        const s1MonthlyAvgMap = {}, s2MonthlyAvgMap = {};

        // គណនាពិន្ទុប្រចាំខែសម្រាប់ Sem 1 & Sem 2
        const s1Months = ['វិច្ឆិកា', 'ធ្នូ', 'មករា', 'កុម្ភៈ', 'មីនា', 'មេសា'];
        const s2Months = ['ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា'];

        students.forEach(st => {
          const sId = st.id;
          const myScores = (scData || []).filter(r => String(r.student_id) === sId);

          // ប្រឡងឆមាសទី១
          const e1 = myScores.find(r => r.score_type === 'semester' && r.period === 'ឆមាសទី១');
          if (e1) {
            sem1Scores[sId] = Object.assign({}, e1.scores || {}, { avg: e1.average, total: e1.total });
            sem1RankMap[sId] = { rank: e1.rank, avg: e1.average, grade: e1.grade_label };
          }

          // ប្រឡងឆមាសទី២
          const e2 = myScores.find(r => r.score_type === 'semester' && r.period === 'ឆមាសទី២');
          if (e2) {
            sem2Scores[sId] = Object.assign({}, e2.scores || {}, { avg: e2.average, total: e2.total });
            sem2RankMap[sId] = { rank: e2.rank, avg: e2.average, grade: e2.grade_label };
          }

          // មធ្យមភាគពិន្ទុខែ Sem 1
          let sum1 = 0, c1 = 0;
          s1Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { sum1 += Number(r.average); c1++; }
          });
          if (c1 > 0) s1MonthlyAvgMap[sId] = (sum1 / c1).toFixed(2);

          // មធ្យមភាគពិន្ទុខែ Sem 2
          let sum2 = 0, c2 = 0;
          s2Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { sum2 += Number(r.average); c2++; }
          });
          if (c2 > 0) s2MonthlyAvgMap[sId] = (sum2 / c2).toFixed(2);
        });

        // គ. ទាញយកវត្តមាន Sem 1 & Sem 2
        const attMap = {};
        students.forEach(st => attMap[st.id] = { sem1_p:0, sem1_a:0, sem2_p:0, sem2_a:0 });

        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, attendance_date, status')
          .eq('assigned_class', curPure)
          .in('student_id', studentIds)
          .in('status', ['A', 'C']);

        (attData || []).forEach(r => {
          const sid = String(r.student_id);
          if (!attMap[sid]) return;
          const dt = new Date(r.attendance_date);
          const m = dt.getMonth() + 1; // 1 to 12
          // Sem 1 months: 11, 12, 1, 2, 3, 4
          const isSem1 = [11, 12, 1, 2, 3, 4].includes(m);
          if (isSem1) {
            if (r.status === 'C') attMap[sid].sem1_p++;
            if (r.status === 'A') attMap[sid].sem1_a++;
          } else {
            if (r.status === 'C') attMap[sid].sem2_p++;
            if (r.status === 'A') attMap[sid].sem2_a++;
          }
        });

        bundleData = {
          className: curPure,
          schoolName: 'កំពង់ល្ពៅ',
          students: students,
          sem1Scores: sem1Scores,
          sem2Scores: sem2Scores,
          sem1RankMap: sem1RankMap,
          sem2RankMap: sem2RankMap,
          yearRankMap: yearRankMap,
          s1MonthlyAvgMap: s1MonthlyAvgMap,
          s2MonthlyAvgMap: s2MonthlyAvgMap,
          attMap: attMap
        };

        const sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់</option>';
        students.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.id} - ${s.name}`;
          sSelect.appendChild(opt);
        });

        renderSemesterView();

      } catch (err) {
        container.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 40px; font-weight: 700;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

      const totalClassCount = studentsList.length;

        const s2 = (bundleData.sem2Scores && bundleData.sem2Scores[st.id]) ? bundleData.sem2Scores[st.id] : {};

        let tot1 = 0, cnt1 = 0;
        let tot2 = 0, cnt2 = 0;

        SEMESTER_SUBJECTS.forEach(sub => {
          const v1 = s1[sub.key]; if (v1 !== '' && v1 !== undefined && !isNaN(Number(v1))) { tot1 += Number(v1); cnt1++; }
          const v2 = s2[sub.key]; if (v2 !== '' && v2 !== undefined && !isNaN(Number(v2))) { tot2 += Number(v2); cnt2++; }
        });

        if (tot1 > 0) {
          s1TotList.push({ id: st.id, val: tot1 });
          s1AvgList.push({ id: st.id, val: Number((tot1 / (cnt1 || 1)).toFixed(2)) });
        }
        if (tot2 > 0) {

          s2AvgList.push({ id: st.id, val: Number((tot2 / (cnt2 || 1)).toFixed(2)) });

        const a1 = cnt1 > 0 ? (tot1 / cnt1) : 0;

        if (yAvg > 0) yAvgList.push({ id: st.id, val: Number(yAvg.toFixed(2)) });
      });

      const s1TotRanks = computeCompetitionRanks(s1TotList);
      const s2TotRanks = computeCompetitionRanks(s2TotList);
      const s1AvgRanks = computeCompetitionRanks(s1AvgList);
      const s2AvgRanks = computeCompetitionRanks(s2AvgList);
      const yAvgRanks  = computeCompetitionRanks(yAvgList);

        const yRankObj  = (bundleData.yearRankMap && bundleData.yearRankMap[student.id]) ? bundleData.yearRankMap[student.id] : {};
