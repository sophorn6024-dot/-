<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>កាតសម្គាល់ខ្លួនសិស្ស - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>

  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700;900&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      /* Theme Tokens - Light Mode */
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      /* Card Printing Palette (ស្តង់ដារកាតសិស្ស) */
      --c-blue: #001fd1;
      --c-green: #009639;
      --c-orange: #c85000;
      --c-red: #e60000;
      --c-border: #0022cc;
      --stamp-w: 34mm;
      --stamp-h: 23.8mm;
      --stamp-top: -3px;
      --stamp-left: 0px;
    }

    [data-theme="dark"] {
      /* Theme Tokens - Dark Mode */
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    html, body {
      min-height: 100%;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-family: 'Siemreap', 'Battambang', Arial, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-overflow-scrolling: touch;
    }

    body {
      padding-bottom: 70px;
    }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ 2-ROW BALANCED TOOLBAR DESIGN
    ========================================================= */
    .no-print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 10px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .form-control {
      padding: 5px 8px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 32px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .teacher-class-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12.5px;
      height: 32px;
      white-space: nowrap;
      user-select: none;
    }

    /* ── Buttons ── */
    .btn {
      padding: 5px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 32px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 7px rgba(37, 99, 235, 0.25);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 7px rgba(16, 185, 129, 0.25);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      height: 30px;
    }
    .btn-danger:hover {
      background: #ef4444;
      color: #fff;
    }

    .btn-outline {
      background: var(--card-panel-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 4px 10px;
      height: 30px;
      font-size: 12px;
    }
    .btn-outline:hover {
      border-color: var(--input-focus);
      color: var(--input-focus);
    }

    /* ── Zoom Buttons ── */
    .zoom-btn-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--ctrl-group-bg);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--tb-border);
      height: 32px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      height: 26px;
      display: flex;
      align-items: center;
    }
    .zoom-btn:hover { color: var(--text-main); }
    .zoom-btn.active {
      background: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 1px 5px rgba(2, 132, 199, 0.35);
    }

    /* ── Range Sliders ── */
    input[type="range"] {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 4px;
      background: var(--input-border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0284c7;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(2, 132, 199, 0.4);
    }

    @media screen and (max-width: 768px) {
      .no-print-toolbar { padding: 8px 10px; gap: 6px; }
      .toolbar-row { gap: 6px; }
      .form-control, .btn { height: 28px; font-size: 11.5px; padding: 3px 6px; }
      .zoom-btn-group { height: 28px; }
      .zoom-btn { height: 24px; padding: 2px 6px; font-size: 10.5px; }
    }

    /* =========================================================
       📄 PRINT PREVIEW AREA (A4 PAGES)
    ========================================================= */
    .print-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
      gap: 22px;
      padding-bottom: 50px;
      transition: zoom 0.2s ease;
      transform-origin: top center;
    }

    .a4-page {
      width: 297mm;
      height: 209mm;
      background: #ffffff !important;
      color: #0f172a !important;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
      box-sizing: border-box;
      flex-shrink: 0;
      border-radius: 4px;
    }

    /* 3x2 (6 កាត) */
    .a4-page.layout-6 {
      display: grid;
      grid-template-columns: repeat(3, 70mm);
      grid-template-rows: repeat(2, 100mm);
      justify-content: center;
      align-content: center;
      gap: 3mm 14mm;
      padding: 2mm 4mm;
    }

    /* 4x2 (8 កាត) */
    .a4-page.layout-8 {
      display: grid;
      grid-template-columns: repeat(4, 70mm);
      grid-template-rows: repeat(2, 100mm);
      justify-content: center;
      align-content: center;
      gap: 3mm 3mm;
      padding: 2mm 4mm;
    }

    /* ── Student Card (7cm × 10cm) ── */
    .student-card {
      width: 70mm;
      height: 100mm;
      border: 1.8px solid var(--c-border);
      background: #ffffff !important;
      color: #000000 !important;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .card-top-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1.8px solid var(--c-border);
      padding: 1px 4px;
      background: #ffffff !important;
      height: 33px;
      flex-shrink: 0;
    }
    .header-logo-box {
      position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .header-logo-img { width: 26px; height: 26px; object-fit: contain; }
    .header-kingdom { width: 100%; text-align: center; line-height: 1.15; z-index: 1; }
    .kingdom-title    { font-family: 'Moul', serif; font-size: 8.2px; color: #000 !important; letter-spacing: -.1px; }
    .kingdom-subtitle { font-family: 'Moul', serif; font-size: 7.5px; color: #000 !important; margin-top: 1px; }
    .kingdom-divider  { display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .kingdom-divider svg { width: 72px; height: 3.5px; }

    .card-main-body {
      flex: 1;
      padding: 3mm 4mm 2.5mm 4mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff !important;
    }
    .card-watermark {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 44mm; height: 44mm; opacity: .22; pointer-events: none; z-index: 0; object-fit: contain;
    }

    .card-titles {
      position: relative; z-index: 1; text-align: center;
      display: flex; flex-direction: column; align-items: center;
      gap: 1px; margin-bottom: 1px;
    }
    .title-badge        { font-family: 'Moul', serif; font-size: 9.2px; color: var(--c-blue) !important; letter-spacing: .2px; line-height: 1.35; }
    .title-school       { font-family: 'Moul', serif; font-size: 8.3px; color: var(--c-green) !important; line-height: 1.35; }
    .title-id           { font-family: 'Moul', serif; font-size: 8.8px; color: var(--c-orange) !important; line-height: 1.35; }

    .title-student-name-center {
      font-family: 'Moul', 'Khmer OS Muol Light', serif;
      font-size: 12.2px;
      color: var(--c-blue) !important;
      text-align: center;
      line-height: 1.65;
      padding-top: 2px;
      padding-bottom: 1px;
      width: 100%;
      white-space: nowrap;
      overflow: visible;
      letter-spacing: .2px;
    }

    .content-container { 
      position: relative; 
      z-index: 1; 
      display: flex; 
      flex-direction: column; 
      margin-top: 1px; 
    }
    
    .mid-split { 
      display: flex; 
      justify-content: space-between; 
      align-items: stretch; 
      gap: 5px; 
      height: 25.5mm; 
    }
    .left-profile-block { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    .student-card table,
    .student-card tbody,
    .student-card tr,
    .student-card td,
    .info-table-top,
    .info-table-bottom,
    .info-table-top td,
    .info-table-bottom td {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .info-table-top  { width: 100%; height: 100%; border-collapse: collapse; font-size: 8.8px; line-height: 1.42; }
    .info-table-top tr { height: 20%; }
    .info-table-top td { padding: 1.2px 0; vertical-align: middle; }

    .info-table-bottom { width: 100%; border-collapse: collapse; font-size: 8.8px; line-height: 1.42; margin-top: 3px; }
    .info-table-bottom tr { height: 16px; }
    .info-table-bottom td { padding: 1.2px 0; vertical-align: middle; }

    .lbl-col { width: 68px; color: var(--c-red) !important; font-weight: 700 !important; white-space: nowrap; text-align: left; }
    .cln-col { width: 8px; color: var(--c-red) !important; font-weight: 700 !important; text-align: center; padding-right: 1px; }
    .val-col { font-weight: 700 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-size: 9px; }
    .val-blue  { color: var(--c-blue) !important; }
    .val-green { color: var(--c-green) !important; }

    .student-photo-box {
      width: 19mm; height: 25.5mm; border: 1.5px solid #000;
      border-radius: 4px; background: #fff !important; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .student-photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .student-photo-box i { font-size: 24px; color: #cbd5e1; }

    .card-bottom-signature {
      position: relative; 
      z-index: 2;
      display: flex; 
      justify-content: flex-start;
      padding-left: 2mm;
      margin-top: 2mm;
      margin-bottom: 1mm;
    }
    .signature-box { display: flex; flex-direction: column; align-items: center; position: relative; width: 44mm; text-align: center; }
    .sig-date { font-family: inherit; font-weight: 700; font-size: 6.8px; color: #000 !important; line-height: 1.2; white-space: nowrap; text-align: center; }

    .sig-stamp-wrapper {
      position: relative; display: flex; flex-direction: column; align-items: center;
      width: 100%; margin-top: 1.5px; min-height: 22mm;
    }
    .sig-title { font-family: 'Moul', serif; font-size: 7.2px; color: #000 !important; line-height: 1.25; margin-top: 1px; white-space: nowrap; text-align: center; position: relative; z-index: 2; }
    .sig-role  { font-family: 'Moul', serif; font-size: 7px; color: #000 !important; line-height: 1.25; margin-top: 1px; white-space: nowrap; text-align: center; position: relative; z-index: 2; }

    .stamp-overlay-box {
      position: absolute;
      top: var(--stamp-top);
      left: calc(50% + var(--stamp-left));
      transform: translateX(-50%);
      width: var(--stamp-w);
      height: var(--stamp-h);
      pointer-events: none; z-index: 6;
      display: flex; align-items: center; justify-content: center;
    }
    .stamp-overlay-box img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }

    /* ── Print Settings ── */
    @page {
      size: A4 landscape;
      margin: 0;
    }
    @media print {
      html, body {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        overflow: visible !important;
      }
      .no-print-toolbar { display: none !important; }
      .print-area {
        zoom: 1 !important;
        transform: none !important;
        margin: 0 !important;
        gap: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .a4-page {
        box-shadow: none !important;
        margin: 0 !important;
        border: none !important;
        width: 297mm !important;
        height: 209mm !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }
    }
  </style>
</head>
<body>

<!-- ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ -->
<div class="auth-wrapper" id="authDeniedWrap">
  <div class="auth-card">
    <div class="auth-icon">🔒</div>
    <h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
    <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីមើល ឬបោះពុម្ពកាតសិស្ស។</p>
    <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
      <span>🔑</span> <span>ទៅកាន់ទំព័រដើម (Login)</span>
    </a>
  </div>
</div>

<!-- =========================================================
     🎛️ 2-ROW BALANCED TOOLBAR DESIGN
========================================================= -->
<div class="no-print-toolbar" id="controlToolbar" style="display:none;">
  <!-- ជួរទី ១៖ ការកំណត់ថ្នាក់ + ទម្រង់ + សាលា + ឆ្នាំ + Zoom + បោះពុម្ព -->
  <div class="toolbar-row">
    <div class="toolbar-section">
      <!-- ថ្នាក់ -->
      <div class="panel-pill-box" id="adminClassBox" style="display:none;">
        <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> ថ្នាក់៖</span>
        <select id="classSelect" class="form-control" style="min-width:120px;" onchange="onClassChange()">
          <option value="">កំពុងទាញយក...</option>
        </select>
      </div>

      <div id="teacherClassBadge" class="teacher-class-badge" style="display:none;">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span id="teacherClassText">ថ្នាក់ទី...</span>
      </div>

      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-layer-group" style="color:#2563eb;"></i> ទម្រង់៖</span>
        <select id="layoutSelect" class="form-control" onchange="switchLayout(this.value)">
          <option value="8">៨ កាត (៤×២)</option>
          <option value="6">៦ កាត (៣×២)</option>
        </select>
      </div>

      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-school" style="color:#10b981;"></i> សាលា៖</span>
        <input type="text" id="schoolName" class="form-control" value="សាលាបឋមសិក្សាកំពង់ល្ពៅ" style="width:160px;" oninput="refreshDisplay()">
      </div>

      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> ឆ្នាំសិក្សា៖</span>

<div class="print-area" id="printArea" style="display:none;">

  </div>
</div>

<script>
/* 1. SUPABASE CLIENT CONFIG */
const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* 2. AUTH GUARD */
function readSession() {
  try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
}
const CURRENT_USER = readSession();

function checkAuthentication() {
  if (!CURRENT_USER || !CURRENT_USER.username) {
    document.getElementById('controlToolbar').style.display = 'none';
    document.getElementById('printArea').style.display = 'none';
    document.getElementById('authDeniedWrap').style.display = 'flex';
    return false;
  }
  document.getElementById('authDeniedWrap').style.display = 'none';
  document.getElementById('controlToolbar').style.display = 'flex';
  document.getElementById('printArea').style.display = 'flex';
  return true;
}

function goToIndex(e) {
  if (e) e.preventDefault();
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({ type: 'OPEN_LOGIN', action: 'LOGIN' }, '*');
      window.parent.location.href = 'index.html';
      return;
    } catch(err) {}
  }
  window.location.href = 'index.html';
}

const USER_ROLE    = CURRENT_USER?.role || "teacher";
const USER_CLASS   = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
const IS_ADMIN     = String(USER_ROLE).toLowerCase().trim() === 'admin';

const OFFICIAL_LOGO = 'https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/thumb/8/85/Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg/300px-Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg.png';

function _get(key) { try { return localStorage.getItem(key) || ''; } catch(e) { return ''; } }
function _set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
function _del(key) { try { localStorage.removeItem(key); } catch(e) {} }

let customLogoUrl  = _get('school_user_logo_url')       || OFFICIAL_LOGO;
let customStampUrl = _get('school_principal_stamp_url') || '';
let currentOpacity = '0.22';
let currentLayout  = parseInt(_get('school_cards_layout') || '8');
let currentZoom    = 1;

let stampSettings = { size: '34', top: '-3', left: '0' };
try {
  const _sp = _get('school_stamp_settings');
  if (_sp) stampSettings = JSON.parse(_sp);
} catch(e) {}

let allStudents = [];

function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme || 'dark'); }
applyTheme(localStorage.getItem('krou_theme_manual') || 'dark');
window.addEventListener('message', e => { if (e.data && (e.data.type === 'THEME_CHANGE' || e.data.theme)) applyTheme(e.data.theme || e.data); });

const _KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
function toKhmerNum(val) {
  if (val === null || val === undefined || val === '') return '';
  return val.toString().replace(/[0-9]/g, d => _KHMER_DIGITS[+d]);
}
function cleanGrade(g) { return String(g || '').replace(/^ថ្នាក់ទី\s*/, '').trim(); }

function getAutoKhmerDate() {
  const now = new Date();
  const months = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
  return 'ធ្វើនៅកំពង់ល្ពៅ ថ្ងៃទី' + toKhmerNum(now.getDate())
       + ' ខែ' + months[now.getMonth()]
       + ' ឆ្នាំ' + toKhmerNum(now.getFullYear());
}

/* 3. ZOOM CONTROLS (TABLET & MOBILE AUTO-FIT) */
function setZoom(scale, btnId) {
  currentZoom = scale;
  const printArea = document.getElementById('printArea');
  if (printArea) printArea.style.zoom = scale;

  ['zFit', 'z75', 'z100'].forEach(id => document.getElementById(id)?.classList.remove('active'));
  document.getElementById(btnId)?.classList.add('active');
}

function setFitZoom() {
  const screenW = window.innerWidth;
  // A4 Landscape width ~1125px
  let scale = (screenW - 20) / 1125;
  if (scale > 1) scale = 1;
  if (scale < 0.28) scale = 0.28;
  setZoom(scale, 'zFit');
}

window.addEventListener('resize', () => {
  if (window.innerWidth <= 1180 && document.getElementById('zFit')?.classList.contains('active')) {
    setFitZoom();
  }
});

/* ── Stamp Customization ── */
function applyStampStyles() {
  const sz  = parseFloat(stampSettings.size)  || 34;
  const top = parseFloat(stampSettings.top)   || -3;
  const lft = parseFloat(stampSettings.left)  || 0;
  document.documentElement.style.setProperty('--stamp-w', sz + 'mm');
  document.documentElement.style.setProperty('--stamp-h', (sz * 0.70).toFixed(1) + 'mm');
  document.documentElement.style.setProperty('--stamp-top',  top + 'px');
  document.documentElement.style.setProperty('--stamp-left', lft + 'px');
  _set('school_stamp_settings', JSON.stringify(stampSettings));
}
function updateStampSize(v)  { stampSettings.size = v;  applyStampStyles(); }
function updateStampTop(v)   { stampSettings.top  = v;  applyStampStyles(); }
function updateStampLeft(v)  { stampSettings.left = v;  applyStampStyles(); }
function resetStampPosition() {
  stampSettings = { size:'34', top:'-3', left:'0' };
  document.getElementById('stampSizeSlider').value = 34;
  document.getElementById('stampTopSlider').value  = -3;
  document.getElementById('stampLeftSlider').value = 0;
  applyStampStyles();
}

function handleCustomLogo(event) {
  const file = event.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = function(e) {
    customLogoUrl = e.target.result;
    _set('school_user_logo_url', customLogoUrl);
    renderCards();
  };
  r.readAsDataURL(file);
}
function clearCustomLogo() {
  customLogoUrl = '';
  _del('school_user_logo_url');
  document.getElementById('logoUploadInput').value = '';
  renderCards();
}

function handleCustomStamp(event) {
  const file = event.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = function(e) {
    customStampUrl = e.target.result;
    _set('school_principal_stamp_url', customStampUrl);
    renderCards();
  };
  r.readAsDataURL(file);
}
function clearCustomStamp() {
  customStampUrl = '';
  _del('school_principal_stamp_url');
  document.getElementById('stampUploadInput').value = '';
  renderCards();
}

function updateWatermarkOpacity(val) {
  currentOpacity = val;
  document.querySelectorAll('.card-watermark').forEach(m => m.style.opacity = val);
}

function switchLayout(val) {
  currentLayout = parseInt(val);
  _set('school_cards_layout', currentLayout);
  renderCards();
}
function refreshDisplay() { renderCards(); }

function doPrintCards() {
  if (!allStudents || allStudents.length === 0) {
    alert('⚠️ សូមរង់ចាំឱ្យទិន្នន័យកាតបង្ហាញសិន ទើបអាចបោះពុម្ពបាន!');
    return;
  }
  window.focus();
  setTimeout(() => {
    try { window.print(); } catch(err) { window.parent.print(); }
  }, 100);
}

/* 4. INITIALIZATION */
window.addEventListener('DOMContentLoaded', async () => {
  if (!checkAuthentication()) return;

  document.getElementById('stampSizeSlider').value = stampSettings.size;
  document.getElementById('stampTopSlider').value  = stampSettings.top;
  document.getElementById('stampLeftSlider').value = stampSettings.left;
  document.getElementById('layoutSelect').value    = currentLayout;
  applyStampStyles();

  await initPage();

  if (window.innerWidth <= 1180) {
    setFitZoom();
  }
});

async function initPage() {
  const adminBox = document.getElementById('adminClassBox');
  const teacherBadge = document.getElementById('teacherClassBadge');
  const select = document.getElementById('classSelect');
  const cleanCls = cleanGrade(USER_CLASS);

  if (!IS_ADMIN) {
    adminBox.style.display = 'none';
    if (cleanCls) {
      document.getElementById('teacherClassText').innerText = 'ថ្នាក់ទី ' + cleanCls;
      teacherBadge.style.display = 'inline-flex';
      select.innerHTML = `<option value="${cleanCls}">ថ្នាក់ទី ${cleanCls}</option>`;
      select.value = cleanCls;
      onClassChange();
    } else {
      teacherBadge.style.display = 'inline-flex';
      document.getElementById('teacherClassText').innerText = 'មិនទាន់កំណត់ថ្នាក់';
      document.getElementById('printArea').innerHTML = 
        '<div style="text-align:center; padding:50px; color:#f59e0b; font-weight:700;">⚠️ គណនីរបស់អ្នកមិនទាន់មានថ្នាក់ទទួលបន្ទុកឡើយ។ សូមទាក់ទង Admin។</div>';
    }
    return;
  }

  teacherBadge.style.display = 'none';
  adminBox.style.display = 'inline-flex';

  try {
    const { data, error } = await sb.from('students').select('grade');
    let classes = [];
    if (!error && data) {
      classes = [...new Set(data.map(d => cleanGrade(d.grade)).filter(Boolean))];
    }
    if (!classes.length) classes = ['១', '២', '៣', '៤(ក)', '៤(ខ)', '៥', '៦'];

    select.innerHTML = classes.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');
    if (cleanCls && classes.includes(cleanCls)) select.value = cleanCls;
    onClassChange();
  } catch (err) {
    select.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
  }
}

async function onClassChange() {
  const selectedClass = document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
  const curPure = cleanGrade(selectedClass);

  if (!curPure) {
    document.getElementById('printArea').innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);">សូមជ្រើសរើសថ្នាក់</div>';
    return;
  }

  document.getElementById('printArea').innerHTML = `
    <div style="text-align:center;padding:60px;color:var(--text-muted);">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
      <p style="margin-top:12px;font-weight:600;">កំពុងទាញយកទិន្នន័យសិស្សថ្នាក់ទី ${curPure} ពី Supabase...</p>
    </div>`;

  try {
    const { data: stList, error: stErr } = await sb
      .from('students')
      .select('id, student_id, student_name, gender, dob, pob, address, father_name, mother_name, grade, photo_url, dropout_semester')
      .order('id', { ascending: true });

    if (stErr) throw stErr;

    // ត្រងសិស្សក្នុងថ្នាក់ (ដកសិស្សបោះបង់ការសិក្សាឆមាសទី១ ចេញ)
    allStudents = (stList || [])
      .filter(s => cleanGrade(s.grade) === curPure)
      .filter(s => {
        const drop = String(s.dropout_semester || '').trim();
        if (drop.includes('ឆមាស១') || drop.includes('ឆមាសទី១') || drop === '១') return false;
        return true;
      })
      .map(s => ({
        id: s.student_id || s.id,
        name: s.student_name || 'គ្មានឈ្មោះ',
        sex: s.gender || 'ប្រុស',
        dob: s.dob || '',
        pob: s.pob || '',
        address: s.address || s.pob || 'ស្វាយជ្រុំ កំពង់ល្ពៅ សំឡូត បាត់ដំបង',
        father: s.father_name || '—',
        mother: s.mother_name || '—',
        grade: curPure,
        imageUrl: s.photo_url || ''
      }));

    renderCards();
  } catch (err) {
    document.getElementById('printArea').innerHTML = `
      <div style="color:#ef4444;text-align:center;padding:40px;font-weight:700;">
        ❌ កំហុសក្នុងការទាញយកទិន្នន័យ៖ ${err.message || err}
      </div>`;
  }
}

/* 5. RENDER STUDENT CARDS */
function renderCards() {
  const container = document.getElementById('printArea');
  if (!allStudents || allStudents.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);font-weight:600;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះទេ</div>';
    return;
  }

  const schoolName   = document.getElementById('schoolName').value || 'សាលាបឋមសិក្សាកំពង់ល្ពៅ';
  const schoolYear   = document.getElementById('schoolYear').value || '២០២៦~២០២៧';
  const autoDateText = getAutoKhmerDate();

  const cardsPerPage = currentLayout;
  const layoutClass  = (cardsPerPage === 6) ? 'layout-6' : 'layout-8';
  const totalPages   = Math.ceil(allStudents.length / cardsPerPage);

  for (let p = 0; p < totalPages; p++) {
    html += `<div class="a4-page ${layoutClass}">`;
    const pageStudents = allStudents.slice(p * cardsPerPage, (p + 1) * cardsPerPage);

      const s = pageStudents[i];
      const khmerId = toKhmerNum(s.id);
      const dobFormatted = toKhmerNum(s.dob || '');
      const addressText = s.address || s.pob || 'ស្វាយជ្រុំ កំពង់ល្ពៅ សំឡូត បាត់ដំបង';
      const cleanGradeStr = cleanGrade(s.grade);

      const photoHtml = (s.imageUrl && s.imageUrl.length > 5)
        ? `<img src="${s.imageUrl}" alt="រូបថត" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-user\\'></i>'">`
        : `<i class="fa-solid fa-user"></i>`;

      const stampHtml = customStampUrl
        ? `<div class="stamp-overlay-box"><img src="${customStampUrl}" alt="ត្រានាយក"></div>`
        : '';

      const headerLogoHtml = customLogoUrl
        ? `<img src="${customLogoUrl}" class="header-logo-img" alt="Logo" onerror="this.style.display='none'">`
        : '';

      const watermarkHtml = customLogoUrl
        ? `<img src="${customLogoUrl}" class="card-watermark" style="opacity:${currentOpacity};" alt="Watermark" onerror="this.style.display='none'">`
        : '';

      html += `
        <div class="student-card">
          <div class="card-top-header">
            <div class="header-logo-box">${headerLogoHtml}</div>
            <div class="header-kingdom">
              <div class="kingdom-title">ព្រះរាជាណាចក្រកម្ពុជា</div>
              <div class="kingdom-subtitle">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
              <div class="kingdom-divider">
                <svg viewBox="0 0 140 8">
                  <line x1="10" y1="4" x2="60" y2="4" stroke="#000" stroke-width="0.8"/>
                  <circle cx="8" cy="4" r="1.4" fill="#000"/>
                  <polygon points="70,1 74,4 70,7 66,4" fill="#000"/>
                  <circle cx="63" cy="4" r="1.2" fill="#000"/>
                  <circle cx="77" cy="4" r="1.2" fill="#000"/>
                  <line x1="80" y1="4" x2="130" y2="4" stroke="#000" stroke-width="0.8"/>
                  <circle cx="132" cy="4" r="1.4" fill="#000"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="card-main-body">
            ${watermarkHtml}

            <!-- ផ្នែកចំណងជើង និងឈ្មោះសិស្ស -->
            <div class="card-titles">
              <div class="title-badge">កាតសម្គាល់ខ្លួនសិស្ស</div>
              <div class="title-school">${schoolName}</div>
              <div class="title-id">អត្តលេខ៖ ${khmerId}</div>
              <div class="title-student-name-center">${s.name || ''}</div>
            </div>

            <!-- តារាងព័ត៌មាន និងរូបថត -->
            <div class="content-container">
              <div class="mid-split">
                <div class="left-profile-block">
                  <table class="info-table-top">
                    <tr>
                      <td class="lbl-col">ភេទ</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${s.sex || ''}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ថ្ងៃខែឆ្នាំកំណើត</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${dobFormatted}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ថ្នាក់ទី</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-blue">${toKhmerNum(cleanGradeStr)}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ឈ្មោះឪពុក</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-green">${s.father || '—'}</td>
                    </tr>
                    <tr>
                      <td class="lbl-col">ឈ្មោះម្តាយ</td>
                      <td class="cln-col">៖</td>
                      <td class="val-col val-green">${s.mother || '—'}</td>
                    </tr>
                  </table>
                </div>

                <div class="student-photo-box">${photoHtml}</div>
              </div>

              <table class="info-table-bottom">
                <tr>
                  <td class="lbl-col">អាសយដ្ឋាន</td>
                  <td class="cln-col">៖</td>
                  <td class="val-col val-blue" style="font-size: 8.8px;" title="${addressText}">${addressText}</td>
                </tr>
                <tr>
                  <td class="lbl-col">ឆ្នាំសិក្សា</td>
                  <td class="cln-col">៖</td>
                  <td class="val-col val-green">${toKhmerNum(schoolYear)}</td>
                </tr>
              </table>
            </div>

            <!-- ផ្នែកហត្ថលេខា និងត្រានាយកសាលា -->
            <div class="card-bottom-signature">
              <div class="signature-box">
                <div class="sig-date">${autoDateText}</div>
                <div class="sig-stamp-wrapper">
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="sig-role">នាយកសាលា</div>
                  ${stampHtml}
                </div>
              </div>
            </div>

          </div>
        </div>
      `;
    }
    html += '</div>';
  }

  container.innerHTML = html;
}
</script>
</body>
</html>
